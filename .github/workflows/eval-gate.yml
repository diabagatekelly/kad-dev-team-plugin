# Runs the eval cases a pull request can affect and fails the check if any
# case scores below its bar in evals/thresholds.json. See evals/README.md,
# "Eval gate".
name: Eval gate

on:
  pull_request:
    paths: ["skills/**", "agents/**", "evals/**"]
  workflow_dispatch:
    inputs:
      cases:
        description: "Case names to run, space-separated, or 'all'. Empty: what changed against main."
        required: false
        default: ""

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # 22.04, not latest: Ubuntu 24.04 restricts unprivileged user namespaces
    # and bubblewrap then cannot bring up loopback ("bwrap: loopback: Failed
    # RTM_NEWADDR"), which leaves every run without a shell. Review cases
    # limp along on Read and Grep; the tdd cases cannot run tests.
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The eval sandboxes each run with bubblewrap on Linux.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      # Prove a sandbox starts before anything is spent.
      - name: Check the sandbox starts
        run: bwrap --ro-bind / / --dev /dev --unshare-all --die-with-parent -- /bin/true
      # Pinned to the version the recorded bars came from; move it together
      # with a re-recorded thresholds.json.
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Run the gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # A user-scoped key (sk-ant-usr-...) is rejected unless every
          # request names a workspace; a workspace-scoped key ignores this.
          ANTHROPIC_CUSTOM_HEADERS: "${{ secrets.ANTHROPIC_WORKSPACE_ID && format('anthropic-workspace-id: {0}', secrets.ANTHROPIC_WORKSPACE_ID) || '' }}"
          CASES: ${{ github.event.inputs.cases }}
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          if [ "$CASES" = "all" ]; then
            python3 -I evals/tools/eval_gate.py --all
          elif [ -n "$CASES" ]; then
            python3 -I evals/tools/eval_gate.py --cases $CASES
          else
            python3 -I evals/tools/eval_gate.py --base "origin/$BASE"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
