schema_version: "1.0"
name: map-update-cancel-hold
description: "After the cancel-hold slice lands, the map is regenerated in place at its fixed home (docs/architecture-map.md, no path given): new rows extracted faithfully, tiers carried forward or taken from the design, utils/ left untiered, the new tier-1 -> tier-3 edge and the untiered edge flagged without verdicts, the shared roundHalfUpCents flagged as a duplication candidate, pre-existing candidates not reported as new, no severity, no app code touched."
tags: [map-update, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. The cancel-hold slice has landed (its design is `docs/cancel-hold/design.md`). Update the architecture map to match the code as it is now, and tell me what changed.
  model: sonnet
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:map-update"'
    min: 1
  - type: regex
    name: new-rows-extracted
    # A judge until E5: the two new rows with their tier, exactly their two
    # edges or none, no external package, exactly their two exports.
    target:
      source: file
      path: docs/architecture-map.md
    pattern: '^(?=[\s\S]*\|\s*\x60?lending/cancel-hold\.ts\x60?\s*\|\s*tier 1\s*\|(?=[^|\n]*infra/memory/in-memory-hold-queue\.ts)(?=[^|\n]*utils/money-format\.ts)[^|\n;,]*[;,][^|\n;,]*\|\s*(?:—|-|none|)\s*\|(?=[^|\n]*\bCancelHold\b)(?=[^|\n]*\bCancelHoldResult\b)[^|\n;,]*[;,][^|\n;,]*\|)(?=[\s\S]*\|\s*\x60?utils/money-format\.ts\x60?\s*\|\s*untiered\s*\|\s*(?:—|-|none|)\s*\|\s*(?:—|-|none|)\s*\|(?=[^|\n]*\broundHalfUpCents\b)(?=[^|\n]*\bformatCents\b)[^|\n;,]*[;,][^|\n;,]*\|)'
  - type: regex
    name: keeps-existing-rows-and-tiers
    # A judge until E5. The pattern is every source row of the fixture's
    # earlier map with its tier (rows under test/ left out, as the extractor
    # does); tools/fixture_patterns.py writes it and --check holds it. The
    # judge failed five maps that kept every row and tier.
    target:
      source: file
      path: docs/architecture-map.md
    pattern: '^(?=[\s\S]*\|\s*\x60?catalog\/book\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?catalog\/catalog-reader\.port\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?catalog\/search-catalog\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?fines\/assess-overdue-fine\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?fines\/collect-fine\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?fines\/fine-ledger\.port\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?fines\/fine-payments\.port\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?fines\/fine\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?fines\/money\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?fines\/standard-waiver\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?fines\/waive-small-fine\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?fines\/waiver-strategy\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?infra\/email\/sendgrid-mailer\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/files\/local-report-files\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/http\/catalog-routes\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/http\/fines-routes\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/http\/lending-routes\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/http\/portal-routes\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/http\/respond\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/http\/sessions\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/logging\/logger\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/memory\/in-memory-hold-queue\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/monitoring\/error-reporter\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/payments\/stripe-fine-payments\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/postal\/file-postal-queue\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/postgres\/postgres-catalog-reader\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/postgres\/postgres-fine-ledger\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/postgres\/postgres-loan-history\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/postgres\/postgres-loan-store\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/postgres\/postgres-member-directory\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/postgres\/postgres-report-queries\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/postgres\/postgres-session-store\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/sms\/sms-gateway\.port\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?infra\/sms\/twilio-sms-gateway\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?lending\/checkout-book\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?lending\/hold-queue\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?lending\/hold\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?lending\/loan-history\.port\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?lending\/loan-policy\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?lending\/loan-store\.port\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?lending\/loan\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?lending\/place-hold\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?lending\/renew-loan\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?lending\/return-book\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?main\/jobs\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?main\/server\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?main\/wiring\.ts\x60?\s*\|\s*tier 3\s*\|)(?=[\s\S]*\|\s*\x60?members\/member-directory\.port\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?members\/member\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?members\/register-member\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?members\/suspend-member\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?notifications\/email-reminder\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?notifications\/mailer\.port\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?notifications\/postal-queue\.port\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?notifications\/postal-reminder\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?notifications\/reminder-schedule\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?notifications\/send-due-reminder\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?notifications\/sms-reminder\.ts\x60?\s*\|\s*tier 1\s*\|)(?=[\s\S]*\|\s*\x60?reporting\/export-report\.ts\x60?\s*\|\s*tier 2\s*\|)(?=[\s\S]*\|\s*\x60?reporting\/monthly-circulation-report\.ts\x60?\s*\|\s*tier 2\s*\|)(?=[\s\S]*\|\s*\x60?reporting\/overdue-report\.ts\x60?\s*\|\s*tier 2\s*\|)(?=[\s\S]*\|\s*\x60?reporting\/report-files\.port\.ts\x60?\s*\|\s*tier 2\s*\|)(?=[\s\S]*\|\s*\x60?reporting\/report-processor\.ts\x60?\s*\|\s*tier 2\s*\|)(?=[\s\S]*\|\s*\x60?reporting\/report-queries\.port\.ts\x60?\s*\|\s*tier 2\s*\|)(?=[\s\S]*\|\s*\x60?reporting\/revenue-report\.ts\x60?\s*\|\s*tier 2\s*\|)(?=[\s\S]*\|\s*\x60?reporting\/rounding\.ts\x60?\s*\|\s*tier 2\s*\|)(?=[\s\S]*\|\s*\x60?services\/payment-service\.ts\x60?\s*\|\s*untiered\s*\|)(?=[\s\S]*\|\s*\x60?utils\/date-utils\.ts\x60?\s*\|\s*untiered\s*\|)'
  - type: llm
    name: flags-new-wrong-direction-edge
    focus:
      source: file
      path: docs/architecture-map.md
    weight: 1
    criteria: |
      PASS if the map flags `lending/cancel-hold.ts` (tier 1) → `infra/memory/in-memory-hold-queue.ts` (tier 3) as a wrong-direction candidate, naming both tiers, as a fact rather than a ruling (no "must fix", no prescribed fix).

      FAIL if it is missing, or presented as a confirmed violation with a demanded fix.
  - type: llm
    name: untiered-edge-direction-unknown
    focus:
      source: file
      path: docs/architecture-map.md
    weight: 1
    criteria: |
      `lending/cancel-hold.ts` (tier 1) → `utils/money-format.ts` (untiered) can't be checked mechanically.

      PASS if the map reports this edge as untiered / direction unknown (or equivalent), and does not call it either correct or wrong.

      FAIL if it is omitted from the flags entirely, or judged either way, or if `utils/money-format.ts` is given a tier to make the check possible.
  - type: llm
    name: flags-duplication-candidate
    focus:
      source: file
      path: docs/architecture-map.md
    weight: 1
    criteria: |
      `utils/money-format.ts` and `fines/money.ts` both export `roundHalfUpCents`.

      PASS if the map flags this pair as a duplication candidate, names the shared export, and leaves open whether it is a real duplicate (no "merge these", no "these are fine").

      FAIL if it is missing, or a verdict is given.
  - type: llm
    name: pre-existing-flags-not-new
    focus:
      source: file
      path: docs/architecture-map.md
    weight: 1
    criteria: |
      The previous map already listed `lending/return-book.ts` → `main/wiring.ts` and `notifications/sms-reminder.ts` → `infra/sms/sms-gateway.port.ts` as wrong-direction candidates.

      PASS if neither edge is reported as new in this update: a candidates list that marks them "carried forward" (or leaves them unmarked while marking another edge "new"), and a changes section that does not name them as new, both pass.

      FAIL only if either edge is explicitly reported as new (marked "new" in the candidates list, or listed under new edges or new candidates in the changes section).
  - type: regex
    name: no-severity
    # A judge until E5: no severity or rating word anywhere in the map.
    target:
      source: file
      path: docs/architecture-map.md
    pattern: '\b(?:critical|high|medium|low|serious|severity|severe|scores?|scored|rating|rated|fixed first|priority)\b'
    flags: i
    match: not_contains
  - type: regex
    name: writes-only-the-map
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/architecture-map\.md")[^"]*"'
    match: not_contains
  - type: regex
    name: no-bash-writes
    target: trace
    pattern: '"name":"Bash","input":\{[^{}]*"command":"(?:[^"\\]|\\.)*?(?:(?<![0-9&>])>{1,2}|\btee\b|\bsed\s+-i|\b(?:cp|mv|rm)\b|\b(?:python3?|node|perl|ruby|php)\s+(?:-[ce]\b|<<))(?:[^|;&"\\]|\\.)*?(?<![\w./-])(?:\./)?(?:catalog|members|lending|fines|notifications|reporting|services|utils|infra|main|test|docs)/'
    match: not_contains
