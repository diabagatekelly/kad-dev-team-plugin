schema_version: "1.0"
name: orchestrator-route-domain-model
description: "Routing, one row of the orchestrator's table (0.18.0): a problem and an Active requirements doc whose `Outside systems and lasting things` section names a bank connection, no `domain-model.md` and no slice: routes to domain-model before any slicing, and logs the route."
tags: [orchestrator, bank-connection]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    This repository holds only planning documents so far, in `docs/connect-bank/`. We're planning a household money app. What's next?
  model: sonnet
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: routes-to-domain-model
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:domain-model"'
    min: 1
  - type: regex
    name: no-slicing-before-the-model
    # A run that goes on to slicing after the model is fine; one that
    # slices first is not.
    target: trace
    pattern: '^(?:(?!"skill":"kad-dev-team:domain-model")[\s\S])*"skill":"kad-dev-team:vertical-slicing"'
    match: not_contains
  - type: tool_used
    name: not-requirements-refinement
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:requirements-refinement"'
    min: 0
    max: 0
  - type: regex
    name: log-names-the-route
    target:
      source: file
      path: docs/connect-bank/orchestrator-log.md
    pattern: '\*\*Routed to:\*\*[^\n]*domain-model'
