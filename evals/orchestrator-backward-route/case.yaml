schema_version: "1.0"
name: orchestrator-backward-route
description: "Backward routing: security-requirements-001 hands a missing capability (a member refund path) back to product-slicer as blocking. Must route to product-slicer, the owner, not forward to reliability criteria and not resolve it in place."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. We're planning a new feature for it, and the planning documents so far are in `docs/pay-fine/`. What's next?
  model: sonnet
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: invokes-vertical-slicing
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:vertical-slicing"'
    min: 1
  - type: tool_used
    name: does-not-go-forward-to-reliability
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:reliability-requirements"'
    min: 0
    max: 0
  - type: tool_used
    name: does-not-hunt-for-agent-files
    tool: Glob
    input_match: 'AGENT|agents/|devsecops-engineer|product-slicer|product-manager'
    min: 0
    max: 0
  - type: llm
    name: routes-back-to-the-owner
    focus: last_message
    weight: 1
    criteria: |
      `docs/pay-fine/security-requirements-001.md` ends with "Handed back to product-slicer — blocking": members have no refund path, a capability nobody scoped. The orchestrator's backward rule takes precedence over the forward table and routes to the persona that owns the invalidated artifact — `product-slicer` — not to the next forward row (reliability criteria) and not back to devsecops-engineer to resolve it.

      PASS if the response routes to product-slicer (or is working as it, on whether the slice grows or a new slice comes first) because of the hand-back.

      FAIL if it continues forward (reliability criteria or later), resolves the refund question itself as devsecops-engineer, or lays out scope options for the user before routing to product-slicer. Options presented by product-slicer itself, once routed there, are its job and pass.
  - type: file_exists
    name: log-written
    path: docs/pay-fine/orchestrator-log.md
