schema_version: "1.0"
name: orchestrator-backward-route
description: "Backward routing: security-requirements-001 hands a missing capability (a receipt for a portal payment) back to product-slicer as blocking. Must route to product-slicer, the owner, not forward to reliability criteria and not resolve it in place."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. We're planning a new feature for it, and the planning documents so far are in `docs/pay-fine/`. What's next?
  model: sonnet
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: invokes-vertical-slicing
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:vertical-slicing"'
    min: 1
  - type: tool_used
    name: does-not-go-forward-to-reliability
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:reliability-requirements"'
    min: 0
    max: 0
  - type: tool_used
    name: does-not-hunt-for-agent-files
    tool: Glob
    input_match: 'AGENT|agents/|devsecops-engineer|product-slicer|product-manager'
    min: 0
    max: 0
  - type: llm
    name: routes-back-to-the-owner
    focus: last_message
    weight: 1
    criteria: |
      `docs/pay-fine/security-requirements-001.md` ends with "Handed back to product-slicer — blocking": a member paying online gets no receipt, which the library's merchant agreement requires, a capability nobody scoped. The orchestrator's backward rule takes precedence over the forward table and routes to the persona that owns the invalidated artifact — `product-slicer` — not to the next forward row (reliability criteria) and not back to devsecops-engineer to resolve it.

      PASS if the response routes to product-slicer (or is working as it: deciding whether a new slice is cut, slice 1 is narrowed, or slice 1 grows, and saying which and why) because of the hand-back. A scope decision that chooses one option and lists the others as rejected with reasons is product-slicer doing its job and passes; so does product-slicer stopping to put that scope choice to the owner with its recommendation and the rejected options, since the question tool is unavailable here and the owner's answer is what resumes the flow.

      FAIL if it continues forward (reliability criteria or later), resolves the receipt question itself as devsecops-engineer, or lays out scope options for the user to pick from without routing to product-slicer.
  - type: file_exists
    name: log-written
    path: docs/pay-fine/orchestrator-log.md
  - type: llm
    name: log-names-the-hand-back
    focus:
      source: file
      path: docs/pay-fine/orchestrator-log.md
    weight: 1
    criteria: |
      The orchestrator appends one entry to `orchestrator-log.md` each time it routes, before invoking the routed skill. For a backward route the entry names which artifact was handed back or invalidated and why, not just the forward destination.

      Here `security-requirements-001.md` hands a missing capability (a receipt for a portal payment) back to product-slicer as blocking, so the route is backward, to `product-slicer` (`vertical-slicing`).

      PASS if the log has an entry that says this is a backward route (a hand-back from the security criteria, or words to that effect), names the receipt gap or the security document as what triggered it, routes to product-slicer or vertical-slicing, and names an artifact path under `docs/pay-fine/`.

      FAIL if there is no entry, the entry routes forward (reliability criteria or later), or it names neither the hand-back nor what was handed back.
