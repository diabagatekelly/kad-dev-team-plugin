schema_version: "1.0"
name: orchestrator-budget-exceeded
description: "The chunk loop's budget line (design §11 case 9): resumed at the boundary after chunk 1, with the handoff's counters saying the loop started six hours ago against a 5 h budget. The orchestrator reads the clock and the counts, ends the flow at the boundary with the branch intact, records `budget exceeded` on the log, launches nothing, and reports what is built. Since 0.15.1 the state carries the owner's `autopilot.md` saying yes: the loop time is a number the owner approved, so it ends the flow under autopilot too (the stop that is still the owner's, beside `orchestrator-autopilot-counts-over`)."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory, a git repository on the branch `slice-001-cancel-hold`; the planning documents are in `docs/cancel-hold/`. The build of slice 001 was handed off at the end of the previous session: `docs/cancel-hold/implementation/handoff-slice-001.md` says where it stopped. Keep going.
  model: sonnet
  max_turns: 30
  timeout_seconds: 1200
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: nothing-launched
    tool: Agent
    min: 0
    max: 0
  - type: regex
    name: budget-exceeded-on-the-log
    target:
      source: file
      path: docs/cancel-hold/orchestrator-log.md
    pattern: 'budget exceeded'
  - type: regex
    name: branch-left-as-it-is
    target: trace
    pattern: '"name":"Bash","input":\{[^{}]*"command":"(?:[^"\\]|\\.)*?\bgit\s+(?:reset\b|checkout\s+--|stash\b|clean\b|revert\b|rebase\b|push\b)'
    match: not_contains
  - type: regex
    name: flow-ends-on-the-clock-and-says-what-is-built
    # Was the judge `flow-ends-saying-what-is-built` until 0.15.1: it had
    # passed 1 run of 3 at its bar and failed, three votes of three, a
    # reply that named the 5 h budget and the 6.0 h read, said autopilot
    # does not cover the clock, listed chunk 1 as built and chunks 2 and 3
    # as not, and left the new limit to the owner. The reply names the
    # time budget as exceeded, chunk 1, and chunk 2 as not built or not
    # started. That nothing was launched is `nothing-launched`; that the
    # branch was left alone is `branch-left-as-it-is`.
    target: last_message
    pattern: '^(?=[\s\S]*(?:\b5 ?h\b|loop time|time budget|\bclock\b))(?=[\s\S]*(?:exceed|used up|over (?:the|its) (?:budget|limit)|past (?:the|that|its) (?:budget|limit)))(?=[\s\S]*chunk 1\b)(?=[\s\S]*chunks? 2\b)(?=[\s\S]*(?:not built|not been built|hasn.t started|has not started|not started|unbuilt|remain))'
    flags: i
