schema_version: "1.0"
name: orchestrator-route-screen-design
description: "Routing, one row of the orchestrator's table: a design system exists but this slice has no screen design: routes to screen-design."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. We're planning a new feature for it, and the planning documents so far are in `docs/pay-fine/`. What's next?
  model: sonnet
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 2
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: routes-to-screen-design
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:screen-design"'
    min: 1
  - type: tool_used
    name: not-design-system
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:design-system"'
    min: 0
    max: 0
  - type: regex
    name: accessibility-review-only-after-screen-design
    target: trace
    pattern: '"skill"\s*:\s*"kad-dev-team:accessibility-review"[\s\S]*"skill"\s*:\s*"kad-dev-team:screen-design"'
    match: not_contains
  - type: file_exists
    name: log-written
    path: docs/pay-fine/orchestrator-log.md
  - type: llm
    name: log-names-row-and-artifact
    focus:
      source: file
      path: docs/pay-fine/orchestrator-log.md
    weight: 1
    criteria: |
      The orchestrator appends one entry to `orchestrator-log.md` in the target directory each time it routes, before invoking the routed skill. Each entry names the detected state that matched, where it routed, and the path the routed step will save to.

      Here the state is: the slice is UI-touching, its security and reliability criteria are filled, a design system exists, and this slice has no screen design. The right destination is `ux-designer:screen-design`.

      PASS if the log has an entry whose detected state is that one (in its own words or the table's; it need not list every element of the row), whose destination is screen-design, and whose artifact line names a path under `docs/pay-fine/` (the screen design under `visual-ux/`). A later entry correcting an earlier one is fine.

      FAIL if there is no entry, the entry routes somewhere else, the detected state it names is a different row, or no artifact path under `docs/pay-fine/` is given.
  - type: llm
    name: stops-after-the-routed-step
    focus: last_message
    weight: 1
    criteria: |
      The orchestrator executes one routed step at a time: it reports what it detected, where it routed and what was produced, then continues to the next row in the same conversation, and asks the owner only when the next row needs an owner decision or a routed skill has a question of its own. Here the routed step is `ux-designer:screen-design`; once the screen design is written, the next row is `accessibility-engineer:accessibility-review` on it, which may run in the same conversation, reported as its own step.

      PASS if the response ends in one of these ways: with screen-design's own questions to the user (the routed skill stopping to ask, its artifact to come in a later turn); with the screen design reported as written and the flow stopped or asking whether to go on; or with that reported and the accessibility review started and reported in its own words (its findings, or its question to the owner). Nothing from a later stage (a build, a technology bootstrap) has been produced, and no design-system work was redone.

      FAIL if the response goes forward to a build or a technology bootstrap, redoes the design system, answers a routed skill's question itself from the repository and carries on past it, or routes first to something other than screen-design.
