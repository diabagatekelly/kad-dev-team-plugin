schema_version: "1.0"
name: orchestrator-route-screen-design
description: "Routing, one row of the orchestrator's table: a design system exists but this slice has no screen design: routes to screen-design."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. We're planning a new feature for it, and the planning documents so far are in `docs/pay-fine/`. What's next?
  model: sonnet
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 2
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: routes-to-screen-design
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:screen-design"'
    min: 1
  - type: tool_used
    name: not-design-system
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:design-system"'
    min: 0
    max: 0
  - type: tool_used
    name: not-accessibility-review
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:accessibility-review"'
    min: 0
    max: 0
  - type: file_exists
    name: log-written
    path: docs/pay-fine/orchestrator-log.md
  - type: llm
    name: log-names-row-and-artifact
    focus:
      source: file
      path: docs/pay-fine/orchestrator-log.md
    weight: 1
    criteria: |
      The orchestrator appends one entry to `orchestrator-log.md` in the target directory each time it routes, before invoking the routed skill. Each entry names the detected state that matched, where it routed, and the path the routed step will save to.

      Here the state is: the slice is UI-touching, its security and reliability criteria are filled, a design system exists, and this slice has no screen design. The right destination is `ux-designer:screen-design`.

      PASS if the log has an entry whose detected state is that one (in its own words), whose destination is screen-design, and whose artifact line names a path under `docs/pay-fine/` (the screen design under `visual-ux/`). A later entry correcting an earlier one is fine.

      FAIL if there is no entry, the entry routes somewhere else, the detected state it names is a different row, or no artifact path under `docs/pay-fine/` is given.
  - type: llm
    name: stops-after-the-routed-step
    focus: last_message
    weight: 1
    criteria: |
      The orchestrator executes exactly one routed step per invocation, then reports what it detected, where it routed and what was produced, and asks whether to continue; it never chains into the next stage. Here the routed step is `ux-designer:screen-design`.

      PASS if the response ends in one of two ways: with screen-design's own questions to the user (the routed skill stopping to ask, its artifact to come in a later turn), or with the routed step's result reported and a question whether to continue to the next step. Either way nothing from a later stage (an accessibility review, technology-bootstrap or implementation) has been produced.

      FAIL if the response goes on to run or produce a later stage's work, answers the routed skill's questions itself from what it read in the repository and proceeds past them, or routes to something other than screen-design.
