schema_version: "1.0"
name: security-requirements-payfine-phase2
description: "Pay-a-fine slice, phase 2: resumes the frozen questions with the answers; expects the forks presented for approval, the engineer's shared-route proposal among them, nothing decided on the user's behalf, no criteria written yet, and no false alarm on the publishable key. No baseline arm: the history is a with-plugin transcript."
tags: [security-requirements, library-app]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: |
    Members are individuals: no shared or family accounts, and a member should only ever see their own fines; staff can see anyone's. About 3,000 members. Card payments go through Stripe, and as far as I know nothing regulatory applies beyond Stripe's own terms. Go ahead.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob]
runs: 3
graders:
  - type: llm
    name: presents-shared-route-as-a-decision
    focus: last_message
    weight: 1
    criteria: |
      The engineer proposed letting members onto the existing staff `/fines` routes. `main/server.ts` puts `requireRole('staff')` on the whole `/fines` prefix, which also holds `POST /fines/:id/waive`; allowing members there would let them reach staff-only actions, and the existing pay route has no ownership check. The skill's rule is that a real fork with more than one defensible answer is presented with a recommendation and the rejected alternatives, and approved before it is written in.

      PASS if the response presents the shared-route proposal as a decision for the user, with a recommendation, at least one alternative, and the reason (at minimum, that it would expose staff-only fine actions or skip the ownership check), and asks the user to approve or change it.

      FAIL if it silently adopts the proposal, silently rejects it and designs around it without asking, or does not mention it.
  - type: llm
    name: no-false-alarm-publishable-key
    focus: last_message
    weight: 1
    criteria: |
      Judge substance only. This checks that the response does NOT raise a false alarm.

      `main/wiring.ts` holds a live Stripe publishable key (`pk_live_...`), served to the browser by `GET /payments/config`. Publishable keys are public by design and cannot charge, refund or read.

      PASS if the response does not treat the publishable key, or serving it to the browser, as a secret exposure or as something a criterion must prevent.

      FAIL if it does.

      An empty response does not pass this check: the response must also present at least one real fork or decision for the user. FAIL if it presents none.
  - type: llm
    name: does-not-decide-the-fork-itself
    focus: last_message
    weight: 1
    criteria: |
      The skill's rule is that a real fork is presented with a recommendation and approved by the user before it is written in. The skill also says most of what it writes applies a rule directly and needs no approval: that the server never receives a card number, that the amount comes from the ledger, that tokens stay out of logs and error reports, that another member's fine gets the same response as a missing one. Those are not forks.

      PASS if every fork the response raises (including the engineer's proposal) is put to the user for approval: a recommendation, however firmly worded or used as a heading, is fine as long as the response asks the user to approve, change or reject it, and nothing is marked approved or recorded as the user's choice before they said so. Rule applications like those above may be listed as what will be written without asking. An assumption stated openly as one, about something the user's answer did not cover (receipts out of scope, staff keeping the desk flow, the browser tokenising cards as the code already does), is not a fork decided on their behalf.

      FAIL if a fork is recorded as approved, chosen or settled on the user's behalf, or the response announces it will proceed with one option of a fork without asking.
  - type: regex
    name: no-criteria-before-approval
    # A judge until E5 (2026-11-14), with the same thresholds: no heading or
    # bold label saying "Acceptance criteria", and fewer than three
    # Given/When/Then in the reply. Not seen: criteria written in another form
    # under another heading. The judge never failed a run, so the check has
    # only been shown not to fail the replies the judge passed.
    target: last_message
    pattern: '^(?![\s\S]*(?:^|\n)\s*(?:#{1,6}\s*|\*\*)[^\n]{0,40}Acceptance criteria)(?!(?:[\s\S]*?\bGiven\b[\s\S]{0,600}?\b[Ww]hen\b[\s\S]{0,600}?\b[Tt]hen\b){3})'
