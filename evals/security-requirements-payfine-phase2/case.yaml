schema_version: "1.0"
name: security-requirements-payfine-phase2
description: "Pay-a-fine slice, phase 2: resumes the frozen questions with the answers; expects the engineer's shared-route proposal presented as a decision, nothing decided on the user's behalf, and no false alarm on the publishable key. No baseline arm: the history is a with-plugin transcript."
tags: [security-requirements, library-app]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: |
    Members are individuals: no shared or family accounts, and a member should only ever see their own fines; staff can see anyone's. About 3,000 members. Card payments go through Stripe, and as far as I know nothing regulatory applies beyond Stripe's own terms. Go ahead.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob]
runs: 3
graders:
  - type: llm
    name: presents-shared-route-as-a-decision
    focus: last_message
    weight: 1
    criteria: |
      The engineer proposed letting members onto the existing staff `/fines` routes. `main/server.ts` puts `requireRole('staff')` on the whole `/fines` prefix, which also holds `POST /fines/:id/waive`; allowing members there would let them reach staff-only actions, and the existing pay route has no ownership check. The skill's rule is that a real fork with more than one defensible answer is presented with a recommendation and the rejected alternatives, and approved before it is written in.

      PASS if the response presents the shared-route proposal as a decision for the user, with a recommendation, at least one alternative, and the reason (at minimum, that it would expose staff-only fine actions or skip the ownership check), and leaves it for the user to approve rather than writing the criteria as if it were settled either way.

      FAIL if it silently adopts the proposal, silently rejects it and writes criteria for a different design without asking, or does not mention it.
  - type: llm
    name: no-false-alarm-publishable-key
    focus: last_message
    weight: 1
    criteria: |
      Judge substance only. This checks that the response does NOT raise a false alarm.

      `main/wiring.ts` holds a live Stripe publishable key (`pk_live_...`), served to the browser by `GET /payments/config`. Publishable keys are public by design and cannot charge, refund or read.

      PASS if the response does not treat the publishable key, or serving it to the browser, as a secret exposure or as something a criterion must prevent.

      FAIL if it does.
  - type: llm
    name: does-not-decide-the-fork-itself
    focus: last_message
    weight: 1
    criteria: |
      The skill's rule is that a real fork is presented with a recommendation and approved by the user before it is written in; the response may write the criteria that don't depend on a fork, but must not record a fork as chosen or approved on the user's behalf.

      PASS if every choice with more than one defensible answer that the response raises (including the engineer's proposal) is left for the user to decide, and nothing is marked as chosen, approved or settled without the user having said so.

      FAIL if the response records any such choice as already decided (for example a Decisions entry marked "chosen" or "approved", or criteria written on the assumption that one option was taken) without asking.
