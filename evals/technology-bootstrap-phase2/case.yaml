schema_version: "1.0"
name: technology-bootstrap-phase2
description: "Bootstrap phase 2: the user answers (solo, TypeScript, standard runner, safe-by-default package manager, nothing else decided) and asks for the whole forced set in one message; expects the UI framework (which the answer does not cover) recommended and left for approval rather than chosen, the package manager picked on its pinning posture after an inline supply-chain consult, and nothing beyond what the first test forces. No baseline arm."
tags: [technology-bootstrap]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: |
    Just me: solo side project, and I'd rather not maintain a lot of tooling. I'm most fluent in TypeScript and want to stay there; the UI will be a web app anyway. For the test runner, whatever you'd recommend as the standard choice for that ecosystem. For the package manager, I want whatever means I don't have to remember a flag to stay safe; pick the one where that's the default. Anything else (hosting, CI, a database, a deployment target, an auth provider): I haven't thought about it and don't want to decide it now.

    Give me your recommendations for the whole set in one message rather than one at a time; I'll approve or change each.
  model: sonnet
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  - type: llm
    name: recommends-ui-framework-and-waits
    focus: last_message
    weight: 1
    criteria: |
      The user's answer covered the language (TypeScript), the test runner and the package manager ("whatever you'd recommend"), and said not to decide hosting, CI, a database, a deployment target or an auth provider. It did not mention a UI framework. Slice 1's actor is a person looking at a transaction list, so a UI framework is plausibly forced, and the skill's rule is that a category the user hasn't spoken to gets its own recommendation and its own wait.

      PASS if the response recommends a UI framework with its reasoning and at least one rejected alternative and asks the user to approve it, without writing the finished bootstrap with a UI framework already chosen. Also PASS if it argues no UI framework is forced by the first test and leaves it open, or if it recommends other categories first and says the UI framework recommendation comes next, without settling it.

      FAIL if it settles a UI framework itself (for example a written bootstrap listing React as decided, or "going with React") without the user's approval.
  - type: regex
    name: asks-only-what-the-first-test-forces
    # A NEGATIVE check, and a judge until 0.17.0: it failed 8 of 28 runs,
    # the last two on replies that settled nothing outside the forced set
    # (asked why, it ended on PASS). What it guarded, as a tool can read
    # it: no database, container, host, CI service, monitoring or auth
    # product is named before the section that leaves those categories
    # open. Every one of the 28 kept replies passes; a reply that
    # recommends one by name fails. Not read: a choice made without a
    # product's name ("host it on a small server").
    target: last_message
    pattern: '^(?:(?!\n#{1,4}[^\n]*(?:left open|not decid|undecided|deferred|open\b|not now|later))[\s\S])*?\b(?:PostgreSQL|Postgres|SQLite|MySQL|MariaDB|MongoDB|DynamoDB|Redis|Prisma|Drizzle|TypeORM|Docker|Podman|Kubernetes|Vercel|Netlify|Heroku|Fly\.io|Railway|Cloudflare|AWS|Azure|GCP|GitHub Actions|GitLab CI|CircleCI|Sentry|Datadog|Grafana|Prometheus|OpenTelemetry|Auth0|Clerk|Cognito|Okta|Firebase|Supabase)\b'
    flags: i
    match: not_contains
  - type: llm
    name: pinning-posture-treated-as-a-choice
    focus: last_message
    weight: 1
    criteria: |
      The user asked for the package manager where the safe posture is the default rather than a flag to remember. The skill's rule is that the package manager's lockfile and pinning posture is part of the bootstrap decision, decided on defaults-over-flags: prefer the manager where content-hashed lockfiles and verified (frozen) installs are the default, because a flag-based posture depends on everyone remembering the flag.

      PASS if the response recommends a package manager and says what posture it gets by default (hashed lockfile, installs that refuse to drift, or equivalent) and why that beats the alternative(s) it rejected, so the choice is visibly made on pinning rather than on speed or ergonomics alone.

      FAIL if the package manager is recommended with no pinning reasoning, if pinning is mentioned only as something to configure later, or if no package manager is recommended at all.
  - type: llm
    name: recommends-the-built-in-default-set-once
    focus: last_message
    weight: 1
    criteria: |
      The skill's rule (since 0.12.0): the categories slice 1's first failing test does not force but a later chunk of the slice may (an HTTP server, since the UI is a web app; a client for the bank-aggregation vendor the design isolates behind an adapter; a log; how the page is rendered) are not left to be decided one at a time during the build. They are recommended now as one default set, "the runtime's built-in unless a chunk forces a dependency" (Node's own modules, the vendor's official client exact-pinned, server-rendered HTML, or a named dependency with its reason), with one approval for the whole set.

      PASS if the response presents such a set, covering at least a server, the vendor client and how the transaction list page is rendered (the three categories the fixture's design and the user's "web app" force on a later chunk) with a built-in or official-pinned default for each, and asks the user to approve it as a whole (the user may still change an item; asking once for the set is the point). Presenting it alongside the forced choices in the one message the user asked for is fine.

      FAIL if the categories a later chunk may force are left with no default ("decided when a chunk needs it", "an owner will decide"), or if the set is presented as separate decisions each needing its own answer, or if no such set appears at all.
  - type: regex
    name: consults-supply-chain-for-pinning
    target: trace
    pattern: '"skill": ?"kad-dev-team:supply-chain-review"'
  - type: regex
    name: consult-is-inline-not-a-spawn
    target: trace
    pattern: '"name": ?"(?:Agent|Task)"'
    match: not_contains
  - type: regex
    name: no-reflexive-security-consult
    target: trace
    pattern: '"skill": ?"kad-dev-team:security-requirements"'
    match: not_contains
  # 0.15.0 (TODO.md B1): the gate's categories are part of the one set.
  - type: regex
    name: gate-checks-recommended-with-the-set
    # The message names a tool or a rule for duplication, unused code and
    # the secret scan, and gives at least one limit as a number.
    target: last_message
    pattern: '^(?=[\s\S]*duplicat)(?=[\s\S]*unused)(?=[\s\S]*(?:secret|gitleaks))(?=[\s\S]*(?:complexity|max-lines|lines? per function|\b40 lines|\b300\b))[\s\S]*$'
    flags: i
