schema_version: "1.0"
name: reliability-requirements-payfine-phase2
description: "Pay-a-fine slice, phase 2: resumes the frozen questions with the answers; expects the forks presented for approval, the engineer's timeout proposal among them, nothing decided on the user's behalf, no criteria written yet, and no endorsement of retrying declines. No baseline arm: the history is a with-plugin transcript."
tags: [reliability-requirements, library-app]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: |
    If the portal can't take payments for an hour, members pay at the desk on their next visit: annoying, nobody loses money. No hard target, but a payment should finish within a few seconds or tell the member what happened. I'm the only developer; I hear about problems from the desk, from a member, or from the error reporter that's already wired in. About 3,000 members. Go ahead.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob]
runs: 3
graders:
  - type: llm
    name: presents-timeout-proposal-as-a-decision
    focus: last_message
    weight: 1
    criteria: |
      The engineer proposed showing "payment failed, please try again" when Stripe takes longer than 10 seconds. After a timeout the charge may in fact have succeeded, so a retry can charge the member twice. There is more than one defensible way to handle that: change what the member is told (pending / could not confirm, and no new attempt until confirmed), make a retry safe (one charge per fine however many attempts, for example with an idempotency key), or accept occasional duplicates and refund them by hand. The skill's rule is that such a fork is presented with a recommendation and the rejected alternative, and left for the user to approve.

      PASS if the response points out that a timed-out charge may have gone through so a retry risks a duplicate charge, and leaves how to handle that as a decision for the user (recommendation plus at least one alternative, not yet approved), whichever of those framings it uses.

      FAIL if it adopts "payment failed, please try again" without addressing the duplicate-charge risk, or settles how to handle the risk itself without leaving it for approval.
  - type: llm
    name: no-retry-of-declines
    focus: last_message
    weight: 1
    criteria: |
      Judge substance only. This checks that the response does NOT propose something harmful.

      Declined, expired-card and insufficient-funds results are the provider's deterministic answers; retrying them cannot succeed and looks like card testing. (The existing `CollectFine` retries every failure up to three times.)

      PASS if nothing in the response (a recommendation, a proposed behaviour, a criterion) requires or endorses automatically retrying a declined, expired or insufficient-funds charge. Recommending that declines are not retried, allowing a retry only for transient faults, or not mentioning retries at all, all pass.

      FAIL if it calls for retrying declines.

      An empty response does not pass this check: the response must also present at least one real fork or decision for the user. FAIL if it presents none.
  - type: llm
    name: does-not-decide-the-fork-itself
    focus: last_message
    weight: 1
    criteria: |
      The skill's rule is that a real fork is presented with a recommendation and approved by the user before it is written in. The skill also says most of what it writes applies a rule directly and needs no approval: that a decline gets its own message and is not retried, that unexpected faults reach the error reporter and look different from a decline, that one identifier ties a payment's records together, that tokens stay out of logs. Those are not forks.

      PASS if every fork the response raises (including the engineer's proposal) is put to the user for approval: a recommendation, however firmly worded or used as a heading, is fine as long as the response asks the user to approve, change or reject it, and nothing is marked approved or recorded as the user's choice before they said so. Rule applications like those above may be listed as what will be written without asking. An assumption stated openly as one, about something the user's answer did not cover (how many payments a day, whether staff can see the Stripe dashboard), is not a fork decided on their behalf.

      FAIL if a fork is recorded as approved, chosen or settled on the user's behalf, or the response announces it will proceed with one option of a fork without asking.
  - type: llm
    name: no-criteria-before-approval
    focus: last_message
    weight: 1
    criteria: |
      The skill's rule: once the questions are answered, the next response is the forks, presented for approval, and the acceptance-criteria document is written only after the approvals, complete. This checks that the response stopped at the forks.

      PASS if the response contains no acceptance-criteria document: no "Acceptance criteria" section and no set of Given/When/Then criteria. Describing a fork's options, what each would have to guarantee (for example "the member is never charged twice"), a list of failure modes found in the code, and a single illustrative criterion are all fine.

      FAIL if it writes the criteria now (an acceptance-criteria section, or three or more Given/When/Then criteria), whether or not it also asks for approval.
