schema_version: "1.0"
name: orchestrator-readiness-open-item
description: "The readiness gate's ninth check (handoff-slice2 P3.3): the cancel-hold slice is fully planned but its slice file carries an open item marked as a blocker (a member who cancels by mistake has no way back). readiness_check.py fails open-items-triaged with a route to the owner; the orchestrator writes the entry, puts the blocker to the owner as one question with three answers (decide it now, cut it into its own slice first, the slice is usable without it), launches no planner, no runner and no builder, and stops at that question."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory, a git repository with its remote set up; the planning documents for the desk hold-cancel feature are in `docs/cancel-hold/`. What's next? Decisions that come up during the build may be settled with the owning persona without asking me, logged and committed under the persona's name. If the sandbox check fails here, write no settings and continue unsandboxed. No autopilot: put every stop to me. I'll answer questions about scope myself. On this machine the GitHub CLI is the wrapper at `tools/gh` (nothing is open there).
  model: sonnet
  max_turns: 50
  timeout_seconds: 2400
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: readiness-gate-run-by-the-script
    tool: Bash
    input_match: 'readiness_check\.py'
    min: 1
  - type: tool_used
    name: nothing-launched-while-blocked
    tool: Agent
    min: 0
    max: 0
  - type: regex
    name: blocker-named-in-the-log
    target:
      source: file
      path: docs/cancel-hold/orchestrator-log.md
    pattern: 'open-items-triaged|[Bb]locker'
  - type: regex
    name: slice-file-not-edited-by-the-orchestrator
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"[^"]*docs/cancel-hold/slice-001\.md"'
    match: not_contains
  - type: llm
    name: puts-the-blocker-to-the-owner
    focus: last_message
    weight: 1
    criteria: |
      The design-readiness gate's `open-items-triaged` check fails on a slice-file item marked `Blocker` (a member who cancels a hold by mistake has no way back), and a blocker is the one readiness failure that goes to the owner, not a persona: one question per blocking item, the item quoted, with three answers: decide it now (the answer becomes a backward route to the document that owns it), cut it into its own slice first, or the slice is usable without it (the owner's words recorded on the item). No builder, planner or chunk runner is launched while it stands.

      PASS if the reply reports the readiness gate's result naming the blocking item, and ends with one question to the owner about it offering those three choices (in words to that effect), with nothing built and no agent launched. The sandbox result and the other checks may be reported before it.

      FAIL if it decides the item itself, hands it to a persona or a fixer, launches a planner, builder or runner, or asks something else instead.
