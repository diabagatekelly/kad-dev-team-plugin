schema_version: "1.0"
name: tdd-implementation-lite-rename-fix
description: "A named fix that is a rename across four files, applied with tdd-implementation-lite: one Edit per occurrence and never a shell substitution (run 3's fixer mangled a seam test's name and a function body with one sed -i), the old name grepped away before the commit, the suite run, and the report saying `renamed <old> → <new>, <n> sites`."
tags: [tdd-implementation-lite, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. `code-review` handed back this finding — apply the fix with the `kad-dev-team:tdd-implementation-lite` skill. I won't be around to answer questions while you work.

    > **`loanStore()` reads as a getter for a cached value.** `main/wiring.ts` exports `loanStore()`, which opens the loan store adapter; the name says "the loan store" and callers read it as a cached handle. Rename it `openLoanStore()` at every call site (`main/wiring.ts`, `main/server.ts`, `main/jobs.ts`, `lending/return-book.ts`) and nowhere else. Behaviour must not change.

    Save your final report as `docs/reports/tdd-implementation-lite-rename-fix.md`.
  model: sonnet
  max_turns: 50
  timeout_seconds: 1200
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: file_exists
    name: report-written
    path: docs/reports/tdd-implementation-lite-rename-fix.md
  - type: tool_used
    name: skill-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:tdd-implementation-lite"'
    min: 1
  - type: regex
    name: no-shell-writes-into-the-tree
    target: trace
    pattern: '"name":"Bash","input":\{[^{}]*"command":"(?:[^"\\]|\\.)*?(?:(?<![0-9&>])>{1,2}|\btee\b|\bsed\s+-i|\bgsed\b|\bperl\s+-[a-z]*[pi]|\bawk\s+-i|\b(?:cp|mv|rm)\b|\b(?:python3?|node|perl|ruby|php)\s+(?:-[ce]\b|<<))(?:[^|;&"\\]|\\.)*?(?<![\w./-])(?:\./)?(?:catalog|members|lending|fines|notifications|reporting|services|utils|infra|main|test|docs)/'
    match: not_contains
  - type: tool_used
    name: edits-each-site-with-the-edit-tool
    tool: Edit
    input_match: 'openLoanStore'
    min: 4
  - type: regex
    name: old-name-gone-from-wiring
    target:
      source: file
      path: main/wiring.ts
    pattern: '\bloanStore\('
    match: not_contains
  - type: regex
    name: new-name-in-wiring
    target:
      source: file
      path: main/wiring.ts
    pattern: 'export function openLoanStore\('
  - type: regex
    name: old-name-gone-from-server
    target:
      source: file
      path: main/server.ts
    pattern: '\bloanStore\('
    match: not_contains
  - type: regex
    name: old-name-gone-from-jobs
    target:
      source: file
      path: main/jobs.ts
    pattern: '\bloanStore\('
    match: not_contains
  - type: regex
    name: old-name-gone-from-return-book
    target:
      source: file
      path: lending/return-book.ts
    pattern: '\bloanStore\('
    match: not_contains
  - type: regex
    name: new-name-in-every-caller
    target:
      source: file
      path: main/jobs.ts
    pattern: 'openLoanStore\('
  - type: tool_used
    name: runs-the-tests
    tool: Bash
    input_match: 'npm (run )?test|node .*--test'
    min: 1
  - type: regex
    name: a-green-run-happened
    target: trace
    pattern: 'ℹ fail 0'
  - type: regex
    name: last-test-run-green
    target: trace
    pattern: 'ℹ fail [1-9](?![\s\S]*ℹ fail \d)'
    match: not_contains
  - type: regex
    name: report-names-the-rename-and-its-sites
    target:
      source: file
      path: docs/reports/tdd-implementation-lite-rename-fix.md
    pattern: 'renamed[^\n]*loanStore[^\n]*openLoanStore[^\n]*\d+ sites'
    # case ignored since 0.17.0: a run wrote the line as a sentence of its
    # report, `Renamed `loanStore` → `openLoanStore`, 6 sites.`
    flags: i
