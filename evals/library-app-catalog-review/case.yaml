schema_version: "1.0"
name: library-app-catalog-review
description: "Review of the clean catalog/ module: expects no finding above Low."
tags: [architecture-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`). Read whatever you need; don't change the code.

    Review the `catalog/` module for architecture issues, including its port and the Postgres adapter in `infra/postgres/postgres-catalog-reader.ts`.

    Save the review as `docs/reviews/library-app-catalog-review.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write]
runs: 3
graders:
  - type: file_exists
    name: review-written
    path: docs/reviews/library-app-catalog-review.md
  - type: regex
    name: leaves-the-code-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/reviews/library-app-catalog-review\.md")[^"]*"'
    match: not_contains
  - type: llm
    name: reports-nothing-above-low
    focus:
      source: file
      path: docs/reviews/library-app-catalog-review.md
    weight: 1
    criteria: |
      `catalog/` is intentionally clean: the `CatalogReader` port is owned by `catalog/`, the Postgres adapter maps rows to the plain `Book` type and never leaks ORM/driver types, and `search-catalog.ts` is pure logic against the port.

      Count only findings whose location is under `catalog/`, or is `infra/postgres/postgres-catalog-reader.ts` or `infra/http/catalog-routes.ts`. A finding located anywhere else (`lending/`, `members/`, `main/wiring.ts`, directory naming across the app, anything listed as pre-existing or out of scope) does not count, whatever its severity.

      PASS if no counted finding is presented as Medium, High or Critical, and none is a must-fix demand. Minor/Low notes (naming, style, optional suggestions) are fine, as is an explicit statement that nothing rises above Low.

      FAIL if any counted finding is presented as Medium or higher, or as required before merge.
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?architecture-review"'
    min: 1
