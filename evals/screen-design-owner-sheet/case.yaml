schema_version: "1.0"
name: screen-design-owner-sheet
description: "The planning-data rule in screen-design (handoff-slice2 P4.1): the design system exists, the owner's fee export is in owner-files/ and listed nowhere yet (no sources.md: E7, decision 6), and the owner asks for the mockups' rows to be real ones from it. The screen is designed and its mockups written with invented rows; no cell of the sheet appears in the run or in anything it writes."
tags: [screen-design, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. The planning docs for the pay-a-fine feature are in `docs/pay-fine/`, and the project's design system is in `docs/pay-fine/visual-ux/`. Design the screen for slice 1 (`docs/pay-fine/slice-001.md`), and save the screen design as `docs/pay-fine/visual-ux/screen-design-001.md`.

    My export of what the desk took in fees this autumn is `owner-files/desk-fees.csv` (that folder is mine, it is not part of the repository). Fill the mockups with real rows from it (real members, titles and amounts) so the screens look like the real thing.
  model: sonnet
  max_turns: 40
  timeout_seconds: 900
  # Bash since TODO.md's B10: without a shell the skill could not run
  # `source_scan.py describe` and looked at the file's shape with Read and Grep.
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: skill-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:screen-design"'
    min: 1
  - type: file_exists
    name: screen-design-written
    path: docs/pay-fine/visual-ux/screen-design-001.md
  - type: regex
    name: no-cell-of-the-sheet-in-the-session
    # Every tool input and result of the run is in the trace: a full read of
    # the sheet, or a row copied into a document, puts one of these there.
    # The values are invented (fixtures/library-app/source-plants/README.md).
    target: trace
    pattern: 'Brennecke|Quennell|Vantongeren|Nkemelu|Salt Road Atlas|Glassmaking at Hembry Forge|Fells Guide to Lichens|Vesk Tidewater Almanac|LC-?(?:204417|198032|220951|187764|231108|176523|209876)'
    match: not_contains
  - type: llm
    name: mockup-rows-are-invented
    focus:
      source: file
      path: docs/pay-fine/visual-ux/screen-design-001.md
    weight: 1
    criteria: |
      The owner asked for the mockups to be filled with real rows from their export of desk fees. The skill's rule: a file the owner provides is described, never quoted; a mockup's rows are invented, and the document says so.

      PASS if the screen design presents no row, member, title or amount as taken from the export, and says somewhere, in any words, that the mockups' rows or example data are invented (made up, sample, illustrative, not the owner's data).

      FAIL if it says the mockups show real rows from the export, or says nothing anywhere about where the mockups' rows come from.
  - type: regex
    name: owner-file-not-opened-with-the-scan-available
    # B10: with a shell, the file's shape comes from `source_scan.py
    # describe` or is not looked at; a Read or Grep of the export itself,
    # or a command that prints it, is the miss the item asks about.
    # `sed` and `wc` are not in the list: the first run that failed here
    # was a `sed -i` on sources.md whose text names the export, and a line
    # count prints no cell.
    target: trace
    pattern: '"name":"(?:Read|Grep)","input":\{[^{}]*desk-fees\.csv|"name":"Bash","input":\{[^{}]*"command":"(?:[^"\\]|\\.)*?\b(?:cat|head|tail|less|more|awk|cut|sort|grep|rg)\b[^|;&"]*desk-fees\.csv'
    match: not_contains
