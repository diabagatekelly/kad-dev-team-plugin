schema_version: "1.0"
name: code-review-catalog
description: "The clean module (T10): a readability review of catalog/ reports nothing above Low and doesn't manufacture findings."
tags: [code-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. Review the `catalog/` module for readability — naming, duplication, comments. Report only; don't change anything.

    Save your answer as `docs/reviews/code-review-catalog.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write]
runs: 3
graders:
  - type: file_exists
    name: review-written
    path: docs/reviews/code-review-catalog.md
  - type: regex
    name: leaves-the-code-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/reviews/code-review-catalog\.md")[^"]*"'
    match: not_contains
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:code-review"'
    min: 1
  - type: llm
    name: nothing-above-low
    focus:
      source: file
      path: docs/reviews/code-review-catalog.md
    weight: 1
    criteria: |
      `catalog/` (three small files: a `Book` type, a `CatalogReader` port, and a `SearchCatalog` use case that trims the terms, returns nothing for fewer than two characters and caps results at 50) is clean, readable code.

      PASS if the review reports no finding it rates above its lowest level (or no findings at all), and says plainly that the module reads well. Optional polish notes are fine.

      FAIL if it raises anything as a real problem to fix (rated above its lowest level, or presented as needing a change before merge).
  - type: llm
    name: names-what-holds-it-up
    focus:
      source: file
      path: docs/reviews/code-review-catalog.md
    weight: 1
    criteria: |
      Restraint on a clean module is only worth something if the reviewer looked. `catalog/` reads well for reasons that can be named: three small files each doing one thing (`Book`, the `CatalogReader` port, the `SearchCatalog` use case); the two magic numbers are named constants (`MAX_RESULTS`, `MIN_TERMS_LENGTH`) and the one comment explains why two characters is the minimum, a WHY the code cannot show; the port's doc comment says what `search` returns and how it is ordered; `CatalogUnavailable` carries a typed `reason`; names say what things are (`findByIsbn`, `copiesOwned`), with no abbreviations or misleading verbs.

      PASS if the review names at least two of those specific points as reasons the module reads well (in its own words; paraphrase counts), rather than only saying it is clean or readable.

      FAIL if fewer than two are named, or the only support for the verdict is generic praise.
  - type: tool_used
    name: consults-why-comments
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:why-comments"'
    min: 1
