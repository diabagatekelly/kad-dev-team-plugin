schema_version: "1.0"
name: security-review-reminders
description: "Due-date reminders (notifications/, main/jobs.ts, test/): whole member record logged on failure, real-looking member PII in test fixtures; trap for an identifier-only log line."
tags: [security-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `.github/`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`, `test/`). Read whatever you need; do not modify anything.

    Security-review the due-date reminder feature: the `notifications/` module, the nightly job in `main/jobs.ts` that drives it, and its tests under `test/`. Pay attention to how member data is handled.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob]
runs: 3
graders:
  - type: llm
    name: finds-whole-member-object-logged
    focus: last_message
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      In `main/jobs.ts`, when a reminder fails, `log.error('reminder failed', { member, loan, reason })` writes the entire `Member` record (full name, email, phone, postal address, card number and every other field) to the log (`infra/logging/logger.ts` serialises all fields to stdout).

      PASS if the review flags that the whole member object is logged (not only that some field in it is sensitive: the point that logging a whole object leaks every current and future field should be present or clearly implied), treats it as High (or the equivalent upper tier; Critical also passes), and proposes logging an identifier that is meaningless outside the system instead (the loan id, the member's row id, or similar). Proposing the library card number alone does not count, since it is itself a personal identifier; offering it alongside a surrogate id is fine.

      FAIL if it is missed, rated Medium or below, or the fix is only to drop or mask particular fields while still logging the object.
  - type: llm
    name: finds-real-looking-pii-in-test-fixtures
    focus: last_message
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `test/fixtures/members.ts` holds two members with realistic personal data: plausible full names, `@gmail.com` / `@comcast.net` email addresses, a real-format phone number (`+15032847716`) and real-looking Portland street addresses, plus realistic library card numbers.

      PASS if the review flags the realistic personal data in the test fixtures as a finding (it may be real data copied from production, and it defeats scanning for real PII) and proposes obviously fake values (reserved domains such as example.org, 555-01xx numbers, or similar).

      FAIL if it is missed, or dismissed because it is only test code.
  - type: llm
    name: no-false-alarm-identifier-only-log
    focus: last_message
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      On success `main/jobs.ts` logs `log.info('reminder sent', { loanId: loan.id, channel: member.contact_pref_code })`: an opaque loan id and the channel code, no personal data.

      PASS if the review does not report this success log line as leaking sensitive or personal data. Not mentioning it, or citing it as the right pattern, passes.

      FAIL if it reports the `reminder sent` line itself as a sensitive-data leak or asks for it to be removed or changed.
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:security-review"'
    min: 1
