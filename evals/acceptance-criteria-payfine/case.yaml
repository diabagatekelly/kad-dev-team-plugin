schema_version: "1.0"
name: acceptance-criteria-payfine
description: "Pay-a-fine slice exists: asked whether an engineer's 'paying a fine is quick' criterion can go in, acceptance-criteria fires, rejects it as untestable, rewrites it as Given/When/Then, and flags the undecided time bound instead of deciding it."
tags: [acceptance-criteria, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory, and the planning docs for the fine-payment feature are in `docs/pay-fine/`. The engineer picking up `docs/pay-fine/slice-001.md` wants to add this acceptance criterion to it:

    "Paying a fine is quick; the member isn't left waiting."

    Is it good to go in?
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob]
runs: 3
graders:
  # E7 (TODO.md, decision 8, 2026-11-15): cut as judges that passed three
  # runs of three with and without the plugin in E6: `rejects-and-rewrites`.
  # What they graded is still in the fixture. `flags-undecided-target` is
  # the judge kept on the case's most important planted problem.
  - type: tool_used
    name: skill-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:acceptance-criteria"'
    min: 1
  - type: llm
    name: flags-undecided-target
    focus: last_message
    weight: 1
    criteria: |
      No document in `docs/pay-fine/` sets a time bound for any step of paying a fine, and the slice carries a reliability placeholder for criteria of that kind (what the slice is held to, and what it does when the payment provider is slow).

      PASS if every rewrite that states a bound flags it as a decision for the user (options are fine) or routes it to the slice's reliability placeholder, or the response leaves the bound out and says who decides it.

      FAIL if it writes a specific bound (for example "the fine shows as paid within 2 seconds") and presents it as decided, without flagging it.
