schema_version: "1.0"
name: reliability-review-fine-payment
description: "Fine payment (fines/collect-fine.ts, the Stripe adapter, the pay route): charge-then-settle with no idempotency, retrying declines in the use case, a route that hides unexpected failures; trap for the settled-fine guard."
tags: [reliability-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `.github/`, `ops/`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`, `test/`). Read whatever you need; don't change the code.

    Review fine payment for production-readiness: `fines/collect-fine.ts`, the payment adapter it uses under `infra/payments/`, and the `POST /fines/:id/pay` route in `infra/http/fines-routes.ts`. What happens when the payment provider or the database misbehaves?

    Save the review as `docs/reviews/reliability-review-fine-payment.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write]
runs: 3
graders:
  - type: file_exists
    name: review-written
    path: docs/reviews/reliability-review-fine-payment.md
  - type: regex
    name: leaves-the-code-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/reviews/reliability-review-fine-payment\.md")[^"]*"'
    match: not_contains
  - type: llm
    name: finds-charge-then-settle-without-idempotency
    focus:
      source: file
      path: docs/reviews/reliability-review-fine-payment.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `fines/collect-fine.ts` charges the card and then, as a separate step, calls `ledger.settle(...)`. There is no idempotency key on the charge and nothing records the attempt first. If `settle` fails or the process dies after a successful charge, the member has paid but the fine remains outstanding, and paying again charges the card a second time.

      PASS if the review identifies this partial-completion window (charged but not settled) and its consequence (a stuck payment and/or a double charge on retry), rates it Critical or High (or the top two tiers of whatever scale it uses), and proposes a fix such as an idempotency key derived from the fine id, recording the attempt before charging, or reconciliation.

      FAIL if it is missed or rated Medium or lower.
  - type: llm
    name: finds-retrying-declines-in-use-case
    focus:
      source: file
      path: docs/reviews/reliability-review-fine-payment.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `fines/collect-fine.ts` re-charges up to three times whenever the outcome is `!ok`. Those outcomes are the provider's deterministic answers (card declined, expired card, insufficient funds), so a declined card is charged three times for nothing; the transient failures (network errors, timeouts) are thrown by `StripeFinePayments` and are not retried at all. The retry also sits in the use case rather than in the payment adapter.

      PASS if the review flags that the retry repeats non-transient failures (declines) and proposes not retrying them. Mentioning that the retry belongs in the adapter, or that a payment retry needs an idempotency key, strengthens it but is not required.

      FAIL if it is missed, or if the review accepts the retry as reasonable resilience.
  - type: llm
    name: finds-pay-route-hides-unexpected-failures
    focus:
      source: file
      path: docs/reviews/reliability-review-fine-payment.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `POST /fines/:id/pay` in `infra/http/fines-routes.ts` catches every error, answers 402 with the error message, and neither logs nor reports anything. A database failure or a payment-provider outage therefore looks like a declined card to the desk and is invisible to whoever runs the service.

      PASS if the review flags that unexpected failures on the pay route are indistinguishable from payment declines and/or go unrecorded, and proposes separating expected payment outcomes from unexpected errors (different status, and logging/reporting the unexpected ones).

      FAIL if it is missed.
  - type: llm
    name: no-false-alarm-settled-fine-guard
    focus:
      source: file
      path: docs/reviews/reliability-review-fine-payment.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      `CollectFine.run` returns without charging when the fine is already settled or waived.

      PASS if the review does not report this early return as silently swallowing a failure or as a defect. Not mentioning it, or noting it as a correct idempotency guard, passes.

      FAIL if it asks for this case to throw or reports it as hiding an error, at Medium or above.
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:reliability-review"'
    min: 1
