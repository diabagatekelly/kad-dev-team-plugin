schema_version: "1.0"
name: orchestrator-route-slicing
description: "Routing, one row of the orchestrator's table: problem plus an Active requirements doc, no slice: routes to vertical-slicing."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. We're planning a new feature for it, and the planning documents so far are in `docs/pay-fine/`. What's next?
  model: sonnet
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 2
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: routes-to-vertical-slicing
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:vertical-slicing"'
    min: 1
  - type: tool_used
    name: not-requirements-refinement
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:requirements-refinement"'
    min: 0
    max: 0
  - type: tool_used
    name: not-architecture-design
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:architecture-design"'
    min: 0
    max: 0
  - type: file_exists
    name: log-written
    path: docs/pay-fine/orchestrator-log.md
  - type: llm
    name: log-names-row-and-artifact
    focus:
      source: file
      path: docs/pay-fine/orchestrator-log.md
    weight: 1
    criteria: |
      The orchestrator appends one entry to `orchestrator-log.md` in the target directory each time it routes, before invoking the routed skill. Each entry names the detected state that matched, where it routed, and the path the routed step will save to.

      Here the state is: the problem has an Active requirements doc and no slice yet. The right destination is `product-slicer` (`vertical-slicing`, with `acceptance-criteria`).

      PASS if the log has an entry whose detected state is that one (in its own words or the table's; it need not list every element of the row), whose destination is vertical-slicing, and whose artifact line names a path under `docs/pay-fine/` (the slice file). A later entry correcting an earlier one is fine.

      FAIL if there is no entry, the entry routes somewhere else, the detected state it names is a different row, or no artifact path under `docs/pay-fine/` is given.
  - type: llm
    name: stops-after-the-routed-step
    focus: last_message
    weight: 1
    criteria: |
      The orchestrator executes one routed step at a time: it reports what it detected, where it routed and what was produced, then continues to the next row in the same conversation, and asks the owner only when the next row needs an owner decision to start or a routed skill has a question of its own. Here the first routed step is `product-slicer` (`vertical-slicing`, with `acceptance-criteria`); the next row is `docs-writer:user-story-writeup`, whose first move is to ask the owner whether the slice becomes a filed issue and in which system.

      PASS if the response ends in one of these ways: with vertical-slicing's own questions to the user (the routed skill stopping to ask, its artifact to come in a later turn); with the slice reported and the flow stopped there asking whether to go on; or with the slice reported and user-story-writeup started and stopped at its own question to the owner (whether to file, where), each step reported in its own words. A skill that delivers its artifact without needing to ask, making its own judgment calls or stating assumptions inside that work, is doing its job; that is not the orchestrator answering its questions. Either way no user story has been written without the owner's answer, and nothing from a later stage (a design doc) has been produced.

      FAIL if the response writes the user story or a design doc without the owner's answers, settles a question the routed skill was meant to ask the owner (where the project tracks work) from the repository and carries on past it, or routes to something other than vertical-slicing first.
