schema_version: "1.0"
name: orchestrator-gap-without-delegation
description: "The chunk loop's C.5 step, the second half of design §11 case 2: chunk 1's review rates one finding needs-decision (devsecops-engineer:reliability-requirements) and the owner wrote no delegation file. The orchestrator records round 0, launches the owning persona once, gets a recommendation back with nothing written, puts `needs-decision devsecops-engineer: <path>` on the C line, launches no fixer, and stops the flow for the owner."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory, a git repository on the branch `slice-001-cancel-hold`; the planning documents are in `docs/cancel-hold/`. The build of slice 001 was handed off at the end of the previous session: `docs/cancel-hold/implementation/handoff-slice-001.md` says where it stopped. Keep going.
  model: sonnet
  max_turns: 50
  timeout_seconds: 2400
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: round-recorded-by-the-script
    tool: Bash
    input_match: 'rounds_record\.py'
    min: 1
  - type: tool_used
    name: owning-persona-launched-once
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:kad-dev-team:)?devsecops-engineer'
    min: 1
    max: 1
  - type: tool_used
    name: no-fixer
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:kad-dev-team:)?tdd-coach'
    min: 0
    max: 0
  - type: tool_used
    name: no-second-reviewer
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:kad-dev-team:)?code-reviewer'
    min: 0
    max: 0
  - type: regex
    name: needs-decision-on-the-c-line
    target:
      source: file
      path: docs/cancel-hold/orchestrator-log.md
    pattern: 'needs-decision[^\n]*devsecops-engineer'
  - type: regex
    name: no-planning-document-written
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"[^"]*docs/cancel-hold/(?:slice-001|reliability-slice-001|design-001|requirements-001|security-slice-001)\.md"'
    match: not_contains
  - type: llm
    name: stops-for-the-owner-with-the-recommendation
    focus: last_message
    weight: 1
    criteria: |
      Without a delegation file the owning persona hands back a recommendation and writes nothing; the orchestrator writes the C line with `needs-decision <persona>: <path>` and stops the flow for the owner, whose answer resumes it at this round. Nothing else goes to a persona, no decision is made by the orchestrator, and no fixer runs before the decision.

      PASS if the reply presents the persona's recommendation on the undecided question (what shape an unreachable-queue failure takes, and whether a failure after removal counts as removed), says the flow is stopped for the owner's answer, and launches no fixer. The recommendation saved to a file in the records directory (the orchestrator's own record of the hand-back, which the C line names) is expected, not a planning edit.

      FAIL if the orchestrator decides the question itself, has the persona or itself edit a planning document (the slice, the requirements, the design, the reliability or security document), launches the fixer anyway, or continues to the next chunk.
