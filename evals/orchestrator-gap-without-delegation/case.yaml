schema_version: "1.0"
name: orchestrator-gap-without-delegation
description: "The chunk loop's C.5 step, the second half of design §11 case 2, with the chunk runner in between: chunk 1's runner handed back a line ending in needs-decision (devsecops-engineer:reliability-requirements), round 0 already recorded, and the owner wrote no delegation file. The orchestrator launches the owning persona once, gets a recommendation back with nothing written, saves it to its own records file, puts `needs-decision devsecops-engineer: <path>` on the C line, launches no fixer and no runner, and stops the flow for the owner."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory, a git repository on the branch `slice-001-cancel-hold`; the planning documents are in `docs/cancel-hold/`. The build of slice 001 was handed off at the end of the previous session: `docs/cancel-hold/implementation/handoff-slice-001.md` says where it stopped. Keep going.
  model: sonnet
  max_turns: 50
  timeout_seconds: 2400
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: owning-persona-launched-once
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:kad-dev-team:)?devsecops-engineer'
    min: 1
    max: 1
  - type: tool_used
    name: no-fixer-no-runner
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:kad-dev-team:)?(?:tdd-coach|chunk-runner)'
    min: 0
    max: 0
  - type: tool_used
    name: no-second-reviewer
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:kad-dev-team:)?code-reviewer'
    min: 0
    max: 0
  - type: regex
    name: round-zero-not-recorded-again
    target: trace
    pattern: 'rounds_record\.py[^"]*--round 0'
    match: not_contains
  - type: regex
    name: needs-decision-on-the-c-line
    target:
      source: file
      path: docs/cancel-hold/orchestrator-log.md
    pattern: 'needs-decision[^\n]*devsecops-engineer'
  - type: regex
    name: no-planning-document-written
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"[^"]*docs/cancel-hold/(?:slice-001|reliability-slice-001|design-001|requirements-001|security-slice-001)\.md"'
    match: not_contains
  - type: llm
    name: stops-for-the-owner-with-the-recommendation
    focus: last_message
    weight: 1
    criteria: |
      The chunk runner handed back a needs-decision; without a delegation file the owning persona hands back a recommendation and writes nothing; the orchestrator writes the C line with `needs-decision <persona>: <path>` and stops the flow for the owner, whose answer resumes it at this round (a runner relaunched for the fix round). Nothing else goes to a persona, no decision is made by the orchestrator, and no fixer or runner runs before the decision.

      PASS if the reply presents the persona's recommendation on the undecided question (what shape an unreachable-queue failure takes, and whether a failure after removal counts as removed), says the flow is stopped for the owner's answer, and launches no fixer and no runner. The recommendation saved to a file in the records directory (the orchestrator's own record of the hand-back, which the C line names) is expected, not a planning edit.

      FAIL if the orchestrator decides the question itself, has the persona or itself edit a planning document, launches the fixer or a runner anyway, or continues to the next chunk.
