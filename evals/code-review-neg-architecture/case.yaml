schema_version: "1.0"
name: code-review-neg-architecture
description: "Negative trigger: a dependency-direction question about lending/ must not fire code-review."
tags: [code-review, negative, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. Does `lending/` depend on the right things? I'm worried business rules are reaching into infrastructure. Report only; don't change anything.
  model: sonnet
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob]
runs: 3
graders:
  - type: tool_used
    name: does-not-fire-code-review
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:code-review"'
    min: 0
    max: 0
    arm: both
