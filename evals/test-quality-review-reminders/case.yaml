schema_version: "1.0"
name: test-quality-review-reminders
description: "The app's existing test/send-due-reminder.test.ts, a sound file with a coverage gap: flags the untested email channel, doesn't call the inline constructor-injected fakes a mocking problem, doesn't call the tests invalid (QT3)."
tags: [test-quality-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. Can you check the tests in `test/send-due-reminder.test.ts`? I want to know if they're any good. Report only; don't change anything.

    Save your answer as `docs/reviews/test-quality-review-reminders.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write]
runs: 3
graders:
  - type: file_exists
    name: review-written
    path: docs/reviews/test-quality-review-reminders.md
  - type: regex
    name: leaves-the-code-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/reviews/test-quality-review-reminders\.md")[^"]*"'
    match: not_contains
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:test-quality-review"'
    min: 1
  - type: llm
    name: finds-untested-email-channel
    focus:
      source: file
      path: docs/reviews/test-quality-review-reminders.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `SendDueReminder.run` picks one of three channels from the member's contact preference: email, SMS or post. The test file covers SMS and post only.

      PASS if the review says the email path is untested and proposes a test for it.

      FAIL if it doesn't mention the email path.
  - type: llm
    name: no-false-alarm-inline-fakes
    focus:
      source: file
      path: docs/reviews/test-quality-review-reminders.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      The tests pass small hand-written gateways (`{ send: async () => {} }`, a `sendText` that pushes to an array, a `queue` that pushes to an array) into the reminder classes' constructors, and assert on what was captured.

      PASS if the review does not present these as a mocking problem (over-mocking, mocking the subject, mocks that intercept nothing). Suggesting a named fake or a shared helper is fine as a minor note. Saying, inside the finding that the email path is untested, that the email fake's `send` discards what it is given and should capture it so an email test can assert on it, is part of that coverage finding, not a mocking alarm.

      FAIL if it reports them as a real problem with the tests.
  - type: llm
    name: keeps-proportion
    focus:
      source: file
      path: docs/reviews/test-quality-review-reminders.md
    weight: 1
    criteria: |
      The two tests exercise the real SendDueReminder with constructor-injected fakes and assert exact output; the file's real weakness is what it doesn't cover.

      PASS if the review's overall verdict is that the existing tests are sound but incomplete (gaps in coverage), not that they are invalid or can't fail.

      FAIL if it says either existing test can't fail, proves nothing, or tests a stand-in instead of the real code.
