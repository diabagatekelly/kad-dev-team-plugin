schema_version: "1.0"
name: test-quality-review-neg-code-review
description: "Negative trigger: a readability review of reporting/export-report.ts must not fire test-quality-review."
tags: [test-quality-review, negative, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. Is `reporting/export-report.ts` readable? Review it for naming, duplication and comments. Report only; don't change anything.
  model: sonnet
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob]
runs: 3
graders:
  - type: tool_used
    name: does-not-fire-test-quality-review
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-quality-review"'
    min: 0
    max: 0
    arm: both
