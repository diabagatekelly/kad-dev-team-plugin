schema_version: "1.0"
name: library-app-structure-review
description: "Review of the whole app's layout and third-party usage: technical-role directories, an SDK used outside its adapter; traps for bootstrap files, a near-miss name, a low-risk date library."
tags: [architecture-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`). Read whatever you need; don't change the code.

    Review the overall structure of the library-lending app: its directory layout and how third-party libraries are used across it. You don't need to review every module's internals in depth; focus on structure and boundaries.

    Save the review as `docs/reviews/library-app-structure-review.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write]
runs: 3
graders:
  # E7 (TODO.md, decision 8, 2026-11-15): cut as judges that passed three
  # runs of three with and without the plugin in E6:
  # `finds-payment-sdk-outside-its-adapter`. What they graded is still in
  # the fixture. `finds-technical-role-directories` is the judge kept on the
  # case's most important planted problem.
  - type: file_exists
    name: review-written
    path: docs/reviews/library-app-structure-review.md
  - type: regex
    name: leaves-the-code-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/reviews/library-app-structure-review\.md")[^"]*"'
    match: not_contains
  - type: llm
    name: finds-technical-role-directories
    focus:
      source: file
      path: docs/reviews/library-app-structure-review.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `services/payment-service.ts` and `utils/date-utils.ts` sit in directories named purely by technical role, with no business concept left once the suffix is stripped.

      PASS if the review flags at least `services/` as a naming/structure problem of this kind (ideally `utils/` too) and suggests where the code belongs instead (refunds with fines; the date helpers with their callers or a business-named module).

      FAIL if neither directory is raised.
  # Added in E7 (TODO.md, decision 9). In E6 both arms scored 1.00 here and
  # the paired reviews read 3 to 0 for the plugin: every plugin review had
  # this cycle and no bare review did (one named another, through
  # `main/wiring`). No grader read it. The request is for structure and
  # boundaries, not each module's internals, so the criterion asks that the
  # cycle is seen as a load problem and to be fixed, not for a rank.
  - type: llm
    name: finds-runtime-import-cycle
    focus:
      source: file
      path: docs/reviews/library-app-structure-review.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `lending/loan.ts` and `lending/loan-policy.ts` import each other as values, and both construct the other class in a static field initializer (`Loan.policy = new LoanPolicy()`, `LoanPolicy.sample = new Loan(...)`). Loading either module throws at startup. A review of the app's structure and boundaries that traces the import graph meets it.

      PASS if the review names the mutual import between `lending/loan.ts` and `lending/loan-policy.ts` (the files, or the `Loan` and `LoanPolicy` classes) as a real cycle at runtime or module load, not a type-only one, as a finding to be fixed, and says how the cycle is broken (drop the static sample, inject the policy, or similar).

      FAIL if this cycle is not in the review, is dismissed as harmless or type-only, or is treated as optional cleanup. A different cycle (for example one through `main/wiring.ts`) does not count.
  - type: llm
    name: no-false-alarm-bootstrap-and-near-miss-names
    focus:
      source: file
      path: docs/reviews/library-app-structure-review.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      `main/server.ts` and `main/wiring.ts` are the app's entry point and composition root; they hold framework imports and construction but no business logic. `reporting/report-processor.ts` carries a `processor` name, which this persona's rules treat as a near-miss worth a second look, not an automatic violation.

      PASS if `main/server.ts` and `main/wiring.ts` are not reported as a naming or structure violation for being the entry point and composition root (framework imports, construction, knowing both sides), and `report-processor.ts` is at most noted as worth reconsidering rather than listed as a definite violation.

      Findings that only involve `main/` do not count against this: another module importing from `main/wiring.ts` (for example `lending/return-book.ts`) is a finding about that module; business sequencing living in `main/jobs.ts` is a separate question about that file; secrets hardcoded in `main/wiring.ts` are a security note. None of these is "main/ reported as a violation".

      FAIL if `main/server.ts` or `main/wiring.ts` is reported as a violation for holding framework imports or construction, or `report-processor.ts` is reported as a definite naming violation.

      An empty or findings-free review does not pass this check: the review must also report at least one real finding of its own (a problem it asks to be fixed, at any severity). FAIL if it reports none.
  - type: llm
    name: no-false-alarm-date-library-tier
    focus:
      source: file
      path: docs/reviews/library-app-structure-review.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      `date-fns-lite` is used directly in `utils/date-utils.ts`, `members/register-member.ts` and `lending/loan-policy.ts`. A date library is lower lock-in than an ORM or SDK.

      PASS if this is not reported as a blocking / High-severity Invasive Species finding. Not mentioning it, or a Low note, both pass.

      FAIL if it is treated as a violation requiring an adapter before merge.

      An empty or findings-free review does not pass this check: the review must also report at least one real finding of its own (a problem it asks to be fixed, at any severity). FAIL if it reports none.
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?architecture-review"'
    min: 1
  - type: regex
    name: key-in-source-handed-on-in-one-line
    # TODO.md's B8: `main/wiring.ts` falls back to a mail provider key written in the source (S8), which is security-review's.
    # One bullet under `## Handed on`, above the findings, that names the
    # problem, a severity it appears to have and the review that owns it.
    target:
      source: file
      path: docs/reviews/library-app-structure-review.md
    pattern: '##\s*Handed on\b(?:(?!\n##\s)[\s\S])*?\n\s*[-*]\s(?=[^\n]*(?:key|secret|credential|SendGrid))(?=[^\n]*\b(?:Critical|High)\b)(?=[^\n]*security-review)[^\n]*(?=[\s\S]*\n##\s*Findings\b)'
    flags: i
  - type: regex
    name: key-in-source-not-a-ranked-finding
    # Never ranked among the review's own findings: no finding's heading
    # is about it. Its limit: a finding that makes the complaint under
    # another heading passes.
    target:
      source: file
      path: docs/reviews/library-app-structure-review.md
    # ("Secrets and configuration read in several places" is this review's
    # own finding, about where configuration is read: the first form of
    # this check failed it.)
    pattern: '(?:^|\n)###[^\n]*(?:hard-?coded|api key|SendGrid key|key (?:in|committed)|committed (?:key|secret|credential))'
    flags: i
    match: not_contains
