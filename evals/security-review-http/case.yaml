schema_version: "1.0"
name: security-review-http
description: "HTTP surface (infra/http/, main/server.ts): unauthenticated refund route, internal error text returned to callers, request headers and bodies sent to error monitoring; traps for prefix-mounted auth and the public catalog search."
tags: [security-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `.github/`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`, `test/`). Read whatever you need; don't change the code.

    Do a security review of the HTTP layer: everything under `infra/http/` and how `main/server.ts` wires it up. Follow whatever it calls into as far as you need to judge it.

    Save the review as `docs/reviews/security-review-http.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write]
runs: 3
graders:
  - type: file_exists
    name: review-written
    path: docs/reviews/security-review-http.md
  - type: regex
    name: leaves-the-code-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"file_path":"(?![^"]*docs/reviews/security-review-http\.md")[^"]*"'
    match: not_contains
  - type: llm
    name: finds-unauthenticated-refund-route
    focus:
      source: file
      path: docs/reviews/security-review-http.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `main/server.ts` puts staff authentication (`requireRole('staff', ...)`) in front of the `/loans`, `/holds` and `/fines` prefixes and member authentication in front of `/portal`. `infra/http/fines-routes.ts` registers `POST /charges/:id/refund`, which matches none of those prefixes, so anyone who can reach the service can refund any charge id through `PaymentService.refund` (real Stripe refunds).

      PASS if the review flags that the refund route is reachable without authentication (or without any staff check), treats it as one of its most severe findings (Critical or High, or the equivalent top tier), and proposes putting it behind staff authentication/authorization (move it under a protected prefix, add the middleware, or equivalent).

      FAIL if it is missed, or rated Medium/Low, or the review claims the route is already protected.
  - type: llm
    name: finds-internal-error-text-returned-to-caller
    focus:
      source: file
      path: docs/reviews/security-review-http.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `infra/http/respond.ts` catches every error thrown by a use case or adapter and returns `error.message` to the caller with status 400; the fine payment route in `fines-routes.ts` does the same with 402. Domain errors are meant for the caller, but unexpected errors (a database/driver error, a Stripe SDK error, anything from an adapter) reach the caller verbatim too,.

      PASS if the review flags that internal/unexpected error detail can reach callers through these catch-alls and proposes separating expected domain errors from unexpected ones (generic message for the latter, detail kept server-side, or equivalent). The review does not need to name every affected route or both catch-alls; flagging the pattern in `respond.ts` with that fix is enough, at any severity.

      FAIL if it is missed, or treated purely as an ergonomics/code-quality point with no information-disclosure concern.
  - type: llm
    name: finds-request-headers-sent-to-monitoring
    focus:
      source: file
      path: docs/reviews/security-review-http.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `createResponder` in `infra/http/respond.ts` sends `{ path, headers: req.headers, body: req.body }` to a third-party error-monitoring service (`MonitorErrorReporter`, `monitor-sdk`) for every failed request. The headers include the `Authorization: Bearer` session token of the staff member or library member making the request, and bodies can carry card numbers and payment tokens.

      PASS if the review flags that session tokens and/or request bodies with personal or payment data are shipped to the monitoring/telemetry service, and proposes sending only a safe allow-list (path, an error id, opaque identifiers) instead of whole headers/bodies.

      FAIL if it is missed.
  - type: llm
    name: no-false-alarm-prefix-mounted-auth
    focus:
      source: file
      path: docs/reviews/security-review-http.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      The handlers in `infra/http/lending-routes.ts` and the `/fines/...` handlers in `infra/http/fines-routes.ts` contain no authentication check of their own. They don't need one: `main/server.ts` mounts `requireRole('staff', sessions)` on the `/loans`, `/holds` and `/fines` prefixes, and `requireRole` rejects requests without a valid staff session. (`/charges/:id/refund` and `/payments/config` are not covered; they are not part of this check.)

      PASS if the review does not claim that the loan, hold or fine routes are unauthenticated or missing an authentication check. Recommending defense in depth as a Low/optional note passes.

      FAIL if it reports any of those routes as reachable without authentication, or asks for an authentication check to be added to them as a required fix.
  - type: llm
    name: no-false-alarm-public-catalog-search
    focus:
      source: file
      path: docs/reviews/security-review-http.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      `GET /books/search/:terms` (`infra/http/catalog-routes.ts`) has no authentication. It is a community library's public catalog search over titles and authors; it returns only book data (isbn, title, author, copies owned), and the query is parameterized.

      PASS if the review does not present the lack of authentication on the catalog search as a Critical/High/Medium finding or a required fix. Not mentioning it, saying it is public by design, or a Low note (for example about rate limiting) all pass.

      FAIL if it is reported at Medium or above, or as something that must be fixed.
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:security-review"'
    min: 1
