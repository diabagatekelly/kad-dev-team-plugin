schema_version: "1.0"
name: technology-bootstrap-phase3
description: "Bootstrap phase 3: the user approves the whole recommended set, deferring the UI framework included; expects the bootstrap written to the given path and nothing else, covering only forced choices, each recorded as set, delegated or approved by the user with its rejected alternatives, and the unforced categories left open with owners. Graded on the saved file; what phase 2 already said (the recommendations and their reasoning) is not re-graded here. No baseline arm."
tags: [technology-bootstrap]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: |
    All fine as you recommend, deferring the UI framework included. Go ahead and write it up, and save it as `docs/technology-bootstrap-001.md`.
  model: sonnet
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  - type: file_exists
    name: bootstrap-written
    path: docs/technology-bootstrap-001.md
  - type: regex
    name: writes-nothing-else
    target: trace
    # The document is the output; scaffolding (package.json, configs) is
    # tdd-implementation's job once the choices are recorded.
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/technology-bootstrap-001\.md")[^"]*"'
    match: not_contains
  - type: llm
    name: asks-only-what-the-first-test-forces
    focus:
      source: file
      path: docs/technology-bootstrap-001.md
    weight: 1
    criteria: |
      This is a NEGATIVE grader — what the output declines to decide matters more
      than what it decides.

      The output must NOT ask the user to choose, or itself choose, any of:
      a CI/CD pipeline or build automation; a hosting, deployment or cloud
      target; a container runtime; a database or persistence technology; an
      observability/monitoring stack; an auth provider. None of these is forced
      by writing slice 1's first failing test.

      Score 0 if the output solicits a decision on, or settles, ANY of the above
      as part of the bootstrap set. Merely listing one as deliberately-not-decided
      (with an owner) is correct and does not count as deciding it.

      Score 1 if the categories it treats as forced stay within: language and
      runtime, test runner, package manager (with its lockfile/pinning posture),
      and — if the first test drives a UI or crosses HTTP — a UI or HTTP
      framework. A brief mention that some other category will be needed
      eventually is fine; asking the user to settle it now is not.
  - type: llm
    name: recommends-rather-than-decides
    focus:
      source: file
      path: docs/technology-bootstrap-001.md
    weight: 1
    criteria: |
      This is the written bootstrap, after the user answered: they set TypeScript themselves, delegated the test runner ("whatever you'd recommend as the standard choice for that ecosystem"), set a criterion for the package manager ("whatever means I don't have to remember a flag to stay safe; pick the one where that's the default"), and approved the skill's recommendation to defer the UI framework because the first test does not drive a screen. Their last turn ("all fine as you recommend") approves the whole recommended set, so an entry that says the user approved it, delegated it, or asked for the property it was picked on, is recording that accurately. A "Decided" section is expected now; what matters is how each entry got there.

      PASS if every decided category (language and runtime, test runner, package manager) records the recommendation with its reasoning, the alternative(s) considered and rejected, and that the user set or approved it (or delegated it); the UI framework appears as deliberately not decided with the reason; and the weight of the set suits a solo maintainer who wants little tooling.

      FAIL if any decided category reads as chosen by the skill with no approval or delegation recorded, carries no rejected alternative, if a UI framework is recorded as decided, or the set recommends team-scale tooling with no acknowledgement of the solo situation.
  - type: llm
    name: records-non-choices-and-open-categories
    focus:
      source: file
      path: docs/technology-bootstrap-001.md
    weight: 1
    criteria: |
      The output must do both of the following.

      (1) Record what was REJECTED, per decided category — the options declined
      and a concrete reason each. A decided category with no rejected
      alternatives named is a fail. "Too heavy for a solo project" and "YAGNI"
      are complete reasons.

      (2) Name the categories this slice did NOT force as explicitly
      not-yet-decided, each with an owner or a trigger for when it will be
      decided — rather than omitting them. At minimum, persistence technology
      and hosting/deployment should appear here, and persistence must carry
      the reason it can wait: slice 1's transactions need only last for the
      session, so an in-memory implementation behind the design's persistence
      boundary satisfies every test the slice has.

      Score 0 if rejected options go unrecorded, if unforced categories are
      silently absent rather than listed as open, or if persistence is deferred
      with no reason (or chosen). Score 1 if all of it holds.
