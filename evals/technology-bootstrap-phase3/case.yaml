schema_version: "1.0"
name: technology-bootstrap-phase3
description: "Bootstrap phase 3: the user approves the whole recommended set, deferring the UI framework included; expects the bootstrap written to the given path and nothing else, covering only forced choices, each recorded as set, delegated or approved by the user with its rejected alternatives, and the unforced categories left open with owners. Graded on the saved file; what phase 2 already said (the recommendations and their reasoning) is not re-graded here. No baseline arm."
tags: [technology-bootstrap]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: |
    All fine as you recommend, deferring the UI framework included. Go ahead and write it up, and save it as `docs/technology-bootstrap-001.md`.
  model: sonnet
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  - type: file_exists
    name: bootstrap-written
    path: docs/technology-bootstrap-001.md
  - type: regex
    name: writes-nothing-else
    target: trace
    # The document is the output; scaffolding (package.json, configs) is
    # tdd-implementation's job once the choices are recorded.
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/technology-bootstrap-001\.md")[^"]*"'
    match: not_contains
  - type: llm
    name: records-the-built-in-default-set
    focus:
      source: file
      path: docs/technology-bootstrap-001.md
    weight: 1
    criteria: |
      The skill's rule (since 0.12.0): the categories slice 1's first failing test does not force but a later chunk of the slice may (an HTTP server, since the UI is a web app; a client for the bank-aggregation vendor; a log; how the page is rendered) are recorded as one default set, "the runtime's built-in unless a chunk forces a dependency", approved once as a whole, so the build re-enters the bootstrap only when a chunk forces a dependency the set excluded. The user's "all fine as you recommend" approves that set along with the rest.

      PASS if the document records such a set under its own heading or list: at least a server, the vendor client and how the transaction list page is rendered (the three categories the fixture's design and the user's "web app" force on a later chunk), each with its default (Node's own module, the vendor's official client exact-pinned, server-rendered HTML, or a named dependency with its reason), and the set recorded as approved by the user (one line for the whole set is enough; a row marked provisional for a detail the user has not supplied, such as which vendor, is still approved). Saying that a chunk inside the set re-enters nothing while a dependency outside it is the one re-entry is a plus, not required.

      FAIL if those categories appear only as not-yet-decided with an owner and no default, if the set is recorded as pending or as separate open decisions, or if no such set appears.
  - type: llm
    name: asks-only-what-the-first-test-forces
    focus:
      source: file
      path: docs/technology-bootstrap-001.md
    weight: 1
    criteria: |
      This is a NEGATIVE grader: what the output declines to decide matters more
      than what it decides.

      Score 0 if the output asks the user to choose, or itself settles, any of
      these: a CI/CD pipeline or build automation; a hosting, deployment or
      cloud target; a container runtime; a database engine or product
      (Postgres, SQLite, DynamoDB, an ORM, or any named store on disk); a
      monitoring or observability vendor or stack; an auth provider. None of
      these is forced by writing slice 1's first failing test.

      Score 1 otherwise: the categories treated as forced stay within language
      and runtime, test runner, package manager (with its lockfile and pinning
      posture), and, if the first test drives a UI or crosses HTTP, a UI or
      HTTP framework.

      Two things do not count against this check. (1) A category listed as
      deliberately not decided, with an owner. (2) The skill's default set for
      what a later chunk of the slice may force, "the runtime's built-in unless
      a chunk forces a dependency", approved once as a whole: an in-memory
      store behind the persistence interface (a real implementation, not a
      database), the runtime's own HTTP, crypto and file modules,
      server-rendered HTML with no framework, the vendor's official client
      exact-pinned (or plain fetch), a small log writer to stdout, credentials
      read from the environment, a linter and formatter. Those are defaults
      for the build, not choices from the list above, however they are laid
      out (a table, a list, a section of their own).
  - type: llm
    name: recommends-rather-than-decides
    focus:
      source: file
      path: docs/technology-bootstrap-001.md
    weight: 1
    criteria: |
      This is the written bootstrap, after the user answered: they set TypeScript themselves, delegated the test runner ("whatever you'd recommend as the standard choice for that ecosystem"), set a criterion for the package manager ("whatever means I don't have to remember a flag to stay safe; pick the one where that's the default"), and approved the skill's recommendation to defer the UI framework because the first test does not drive a screen. Their last turn ("all fine as you recommend") approves the whole recommended set, so an entry that says the user approved it, delegated it, or asked for the property it was picked on, is recording that accurately. A "Decided" section is expected now; what matters is how each entry got there.

      The skill's template puts the rejected options in their own "Considered and rejected" section, so they need not sit inside each entry; and one statement that covers every entry ("all approved as recommended", "chosen for the user's fluency") is a record of how it was settled.

      PASS if each decided category (language and runtime, test runner, package manager) records the choice, why the slice forced it and its reasoning; how it was settled is recorded (set by the user, delegated, or approved as recommended, per entry or in one statement for all); each decided category has at least one rejected alternative somewhere in the document; the UI framework appears as deliberately not decided with the reason; and the weight of the set suits a solo maintainer who wants little tooling.

      FAIL if a decided category reads as chosen by the skill with no approval or delegation recorded anywhere, has no rejected alternative anywhere in the document, if a UI framework is recorded as decided, or the set recommends team-scale tooling with no acknowledgement of the solo situation.
  - type: llm
    name: records-non-choices-and-open-categories
    focus:
      source: file
      path: docs/technology-bootstrap-001.md
    weight: 1
    criteria: |
      The output must do both of the following.

      (1) Record what was REJECTED for each of the three forced categories
      (language and runtime, test runner, package manager): the options
      declined and a concrete reason each. One of those three with no rejected
      alternative named anywhere in the document is a fail. "Too heavy for a
      solo project" and "YAGNI" are complete reasons. This part is about those
      three only: a type checker or compiler listed alongside them needs no
      rejected alternative, and the rows of the built-in default set (a
      server, page rendering, persistence, a vendor client, crypto, logging,
      credentials, a linter) record what each default gives up instead of
      options declined, which is their form of the record and is not a fail.

      (2) Name the categories this slice did NOT force as explicitly
      not-yet-decided, each with an owner or a trigger for when it will be
      decided — rather than omitting them. At minimum, persistence technology
      and hosting/deployment should appear here, and persistence must carry
      the reason it can wait: slice 1's transactions need only last for the
      session, so an in-memory implementation behind the design's persistence
      boundary satisfies every test the slice has. Persistence may instead sit
      in the built-in default set ("a file through the runtime's own module if
      a chunk ever needs data to outlive a restart") with that same reason; what
      fails is a chosen engine, or no reason.

      Score 0 if rejected options go unrecorded, if unforced categories are
      silently absent rather than listed as open, or if persistence is deferred
      with no reason (or chosen). Score 1 if all of it holds.
