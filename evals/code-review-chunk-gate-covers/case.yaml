schema_version: "1.0"
name: code-review-chunk-gate-covers
description: "TODO.md's B2 (0.15.0): the chunk reviewer reports what the gate does not hold. Chunk 1's in-memory queue writes the ISBN's normalisation out in each of its four methods, a line that is reasonable once (short of what the project's duplication check counts, so the gate passes and its output lists duplication among what it covers) and finds a hold by the start of its card number, so a cancel for card 100 removes card 1001's hold. The combined review reports the wrong match as a finding and raises no finding on the repeated lines."
tags: [code-review, library-app, regression]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    You are the one reviewer the chunk runner launched for chunk 1 of 3 of slice 001 of the library-lending app, which is in your current working directory (a git repository on the branch `slice-001-cancel-hold`). Invoke the skill `kad-dev-team:code-review` first and follow its "Cold pass first" and then its "Combined chunk review".

    You are handed five things and nothing else: the project root (the current directory); the documented test command, `npm test`; the chunk's commit range, from the commit `Plan: slice 001 in 3 chunks` to the commit `Cancel a member's hold on a title` (`git log --oneline` has both); the report path, `docs/cancel-hold/implementation/chunk-1-r0-review.md`; and the path of this chunk's last gate output, `docs/cancel-hold/implementation/gate-chunk-1-r0.txt`. Hand back the counts and the path.
  model: sonnet
  max_turns: 50
  timeout_seconds: 1500
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write]
runs: 3
graders:
  - type: tool_used
    name: code-review-invoked-first
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:code-review"'
    min: 1
  - type: file_exists
    name: report-written
    path: docs/cancel-hold/implementation/chunk-1-r0-review.md
  - type: regex
    name: gate-output-read
    # The line that says what the gate holds is in the gate's output file;
    # a review that never opened it cannot know what to leave out.
    target: trace
    pattern: 'gate-chunk-1-r0\.txt'
  - type: regex
    name: wrong-match-is-a-finding
    # A finding block (a ### heading with its Severity line, Critical to
    # Medium) that speaks of the prefix match before the next heading.
    target:
      source: file
      path: docs/cancel-hold/implementation/chunk-1-r0-review.md
    pattern: '(?:^|\n)###[^\n]*\n\s*(?:[-*]\s*)?\*\*Severity:?\*\*:?\s*(?:Critical|High|Medium)(?:(?!\n###)[\s\S])*?(?:startsWith|prefix|starts? with|begins? with|beginning of)'
    flags: i
  - type: regex
    name: duplication-left-to-the-gate
    # No finding on the slice's source (a Location under infra/ or
    # lending/) whose title says the code is repeated or duplicated, or
    # whose Category is duplication. A sentence that says duplication is
    # the gate's passes: it is not a finding. A test-quality finding on
    # two tests that assert the same thing is the test lens's own subject
    # (its Location is under test/) and passes. Until 0.15.1 the planted
    # block was needless in itself as well as repeated ("a ternary that
    # does nothing ... in every method"), so a title could not be read
    # for "repeated"; the block is now one line that is reasonable once
    # (the ISBN's normalisation), and the only thing to say about it is
    # that it is written four times.
    target:
      source: file
      path: docs/cancel-hold/implementation/chunk-1-r0-review.md
    pattern: '(?:^|\n)###(?=(?:(?!\n###)[\s\S])*?\*\*Location:?\*\*:?\s*`?(?:infra|lending)/)(?:[^\n]*(?:duplicat|repeat|copy-?past|\bDRY\b|(?:four|4|every|each)\s+(?:times|methods?|places))|(?:(?!\n###)[\s\S])*?\*\*Category:?\*\*:?[^\n]*duplicat)'
    flags: i
    match: not_contains
  - type: regex
    name: no-low-per-chunk
    target:
      source: file
      path: docs/cancel-hold/implementation/chunk-1-r0-review.md
    pattern: '\*\*Severity:?\*\*:?\s*Low\b'
    match: not_contains
  - type: regex
    name: writes-only-the-report
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/cancel-hold/implementation/chunk-1-r0-review\.md")(?![^"]*(?:/tmp/|/T/|scratch|probe))'
    match: not_contains
