schema_version: "1.0"
name: orchestrator-route-accessibility
description: "Routing, one row of the orchestrator's table: a screen design exists and the accessibility criteria are a placeholder: routes to accessibility-review."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. We're planning a new feature for it, and the planning documents so far are in `docs/pay-fine/`. What's next?
  model: sonnet
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 2
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: routes-to-accessibility-review
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:accessibility-review"'
    min: 1
  - type: regex
    name: screen-design-only-after-the-review
    target: trace
    pattern: '"skill"\s*:\s*"kad-dev-team:screen-design"[\s\S]*"skill"\s*:\s*"kad-dev-team:accessibility-review"'
    match: not_contains
  - type: tool_used
    name: not-technology-bootstrap
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:technology-bootstrap"'
    min: 0
    max: 0
  - type: tool_used
    name: not-tdd-implementation
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:tdd-implementation"'
    min: 0
    max: 0
  - type: file_exists
    name: log-written
    path: docs/pay-fine/orchestrator-log.md
  - type: llm
    name: log-names-row-and-artifact
    focus:
      source: file
      path: docs/pay-fine/orchestrator-log.md
    weight: 1
    criteria: |
      The orchestrator appends one entry to `orchestrator-log.md` in the target directory each time it routes, before invoking the routed skill. Each entry names the detected state that matched, where it routed, and the path the routed step will save to.

      Here the state is: the slice has a screen design and its accessibility criteria are still a placeholder. The right destination is `accessibility-engineer:accessibility-review`.

      PASS if the log has an entry whose detected state is that one (in its own words or the table's; it need not list every element of the row), whose destination is accessibility-review, and whose artifact line names a path under `docs/pay-fine/` (the review, or the slice whose placeholder it fills). A later entry correcting an earlier one is fine.

      FAIL if there is no entry, the entry routes somewhere else, the detected state it names is a different row, or no artifact path under `docs/pay-fine/` is given.
  - type: llm
    name: stops-after-the-routed-step
    focus: last_message
    weight: 1
    criteria: |
      The orchestrator executes one routed step at a time: it reports what it detected, where it routed and what was produced, then continues to the next row in the same conversation, and asks the owner only when the next row needs an owner decision or a routed skill has a question of its own. Here the routed step is `accessibility-engineer:accessibility-review` on the screen mockup; when it raises a Critical or High, the next step is a backward route to `ux-designer:screen-design` to revise the mockup, which may run in the same conversation, reported as its own step.

      PASS if the response ends in one of these ways: with accessibility-review's own questions to the user; with the review's result reported (its document written, the slice's placeholder pointed at it) and the flow stopped or asking whether to go on; or with that result reported and the backward route to screen-design taken and reported in its own words, the revised mockup or screen-design's question to the owner ending the turn. Nothing from a later forward stage (a build, a technology bootstrap) has been produced.

      FAIL if the response goes forward to a build or a technology bootstrap, answers a routed skill's question itself from the repository and carries on past it, or routes first to something other than accessibility-review.
