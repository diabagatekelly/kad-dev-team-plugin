schema_version: "1.0"
name: orchestrator-route-implementation-prenamed
description: "Routing with the stage pre-named: the same cancel-hold slice in the library app, but the prompt says 'if the next step is the implementation, go ahead'. Naming the stage in passing is not naming a skill: the orchestrator still routes, writes its log entry, and the implementation row still goes through the chunk loop (sandbox check, policy question; not launchable past that here), never straight to tdd-implementation inline in the real tree. From H6's second session, where exactly that prompt made the main agent skip the orchestrator and the sandbox check."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. We're planning a new feature for it, and the planning documents so far are in `docs/cancel-hold/`. If the next step is the implementation, go ahead with it.
  model: sonnet
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: not-tdd-implementation-inline
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:tdd-implementation-lite"'
    min: 0
    max: 0
  - type: file_exists
    name: log-written
    path: docs/cancel-hold/orchestrator-log.md
  - type: llm
    name: routes-to-tdd-implementation
    focus:
      source: file
      path: docs/cancel-hold/orchestrator-log.md
    weight: 1
    criteria: |
      The cancel-hold slice is fully specified (design approved, security and reliability criteria filled, not UI-touching) and the library app already has a stack, so the next step is `tdd-coach:tdd-implementation`. The orchestrator reaches it only through its chunk loop (a sandbox check, a policy question, a delegation question, a slice branch, a design-readiness gate, then one implementer per chunk with a gate, one combined reviewer and a smoke run per commit).

      PASS if the log routes this slice to tdd-implementation-lite (the chunk loop), directly or as "chunk loop", and the entry has an artifact line: a path under `docs/cancel-hold/` or the project's source, or the template's own "see sub-entries below". "Routed to: chunk loop" is that route whether or not the entry names tdd-implementation, since the chunk loop is the orchestrator's procedure for that one row; the entry's heading may be the template's "slice ready for implementation" or the row's own description in the orchestrator's words (a design doc, runtime-safety criteria filled, a stack, not yet implemented), and either heading is correct. The entry is written before the routed step runs, so when the run stops at the sandbox check or the policy question, the sub-entries are not there yet and "see sub-entries below" on its own is the correct line; if the loop got further, its A line (sandbox, policy, delegation, budget, branch, base, records, readiness) follows, and a failed readiness check adds a backward-route entry of its own. An entry with a heading and a destination but no artifact line at all fails.

      FAIL if it routes to technology-bootstrap or anything else, or the log has no routing entry.
  - type: llm
    name: stops-after-the-routed-step
    focus: last_message
    weight: 1
    criteria: |
      The orchestrator executes exactly one routed step per invocation and never chains, and its `tdd-coach:tdd-implementation-lite` row runs the chunk loop (a sandbox check first, a delegation question, a slice branch, the design-readiness gate, then one implementer agent per chunk behind a gate, one combined reviewer and a smoke run), never an inline build in the real tree. This session grants no `Agent` tool and no shell, so the loop cannot be launched here.

      PASS if the response, having routed there, ends with a stop: it reports that the sandbox check or the loop could not be run here and what would be needed (a shell, the `Agent` tool, a sandboxed session, or the like), or asks whether to continue unsandboxed, or asks whether build-time decisions may be delegated to the owning personas, or reports the design-readiness gate's result (PASS, or the backward route a failed check took), or reports the loop's outcome. In every case no slice code is written and no other stage's work is produced.

      FAIL if it writes the slice's code itself inline instead of the loop, routes to technology-bootstrap or another stage, or moves on to the next scope-map step.
