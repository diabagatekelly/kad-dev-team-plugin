schema_version: "1.0"
name: orchestrator-route-implementation-prenamed
description: "Routing with the stage pre-named: the same cancel-hold slice in the library app, but the prompt says 'if the next step is the implementation and its quarantine flow, go ahead'. Naming the stage in passing is not naming a skill: the orchestrator still routes, writes its log entry, and the implementation row still goes through the quarantine flow (not launchable here), never straight to tdd-implementation inline in the real tree. From H6's second session, where exactly that prompt made the main agent skip the orchestrator and the sandbox check."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. We're planning a new feature for it, and the planning documents so far are in `docs/cancel-hold/`. If the next step is the implementation and its quarantine flow, go ahead with it.
  model: sonnet
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: not-tdd-implementation-inline
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:tdd-implementation"'
    min: 0
    max: 0
  - type: file_exists
    name: log-written
    path: docs/cancel-hold/orchestrator-log.md
  - type: llm
    name: routes-to-tdd-implementation
    focus:
      source: file
      path: docs/cancel-hold/orchestrator-log.md
    weight: 1
    criteria: |
      The cancel-hold slice is fully specified (design approved, security and reliability criteria filled, not UI-touching) and the library app already has a stack, so the next step is `tdd-coach:tdd-implementation`. The orchestrator reaches it either directly or through its quarantine flow (candidates built in worktrees, then graded and combined).

      PASS if the log routes this slice to tdd-implementation, directly or through the quarantine flow (the orchestrator's template for that route is an entry headed "slice ready for implementation" with "Routed to: quarantine flow"), and the entry has an artifact line: a path under `docs/cancel-hold/` or the project's source, or the template's own "see sub-entries below". The entry is written before the routed step runs, so when the run stops because the flow cannot be launched here, the sub-entries are not there yet and "see sub-entries below" on its own is the correct line; if the flow did run, its sub-entries (quarantine, grade, combine, finalize, re-grade) follow. An entry with a heading and a destination but no artifact line at all fails.

      FAIL if it routes to technology-bootstrap or anything else, or the log has no routing entry.
  - type: llm
    name: stops-after-the-routed-step
    focus: last_message
    weight: 1
    criteria: |
      The orchestrator executes exactly one routed step per invocation and never chains, and its `tdd-coach:tdd-implementation` row runs the quarantine flow (two candidates built by async agents in worktrees, after a sandbox check), never an inline build in the real tree. This session grants no `Agent` tool and no shell, so the flow cannot be launched here.

      PASS if the response, having routed there, ends with a stop: it reports that the flow could not be launched here and what would be needed (the `Agent` tool, a sandboxed session, or the like), or asks whether to go ahead with the flow, or reports the flow's outcome. In every case no slice code is written and no other stage's work is produced.

      FAIL if it writes the slice's code itself inline instead of the flow, routes to technology-bootstrap or another stage, or moves on to the next scope-map step.
