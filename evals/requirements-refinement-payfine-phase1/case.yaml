schema_version: "1.0"
name: requirements-refinement-payfine-phase1
description: "Pay-a-fine problem doc only, no scope map: a plain 'work out what we want built' fires requirements-refinement, which asks the user what they want before writing, and doesn't ask what the problem doc or code answers."
tags: [requirements-refinement, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. We're planning a new feature for it; the problem doc is in `docs/pay-fine/problem.md`. It's small enough that we're skipping a scope map. Before anyone cuts a slice, let's work out exactly what we want built for it.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob]
runs: 3
graders:
  # E7 (TODO.md, decision 8, 2026-11-15): cut as judges that passed three
  # runs of three with and without the plugin in E6: `asks-before-writing`.
  # What they graded is still in the fixture. No planted-problem judge is
  # kept beside the graders that differed: this case plants none.
  - type: tool_used
    name: skill-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:requirements-refinement"'
    min: 1
  - type: llm
    name: asks-trade-off-and-alternatives
    focus: last_message
    weight: 1
    criteria: |
      The skill's question list includes two things no document answers: whether there is a priority or trade-off the user cares about for this piece (why this, why now; for example wanting the riskier version because that is the whole point), and whether they considered and rejected other approaches, and why. Engineering heuristics (smallest first, least risk) are not allowed to stand in for the user's answer to either.

      PASS if the response asks the user both: about a priority or trade-off they care about (or why this, why now), and about alternatives they considered or rejected. Wording does not matter; both must be asked, not assumed.

      FAIL if either is not asked, or is replaced by the skill's own assumption (for example proposing the smallest version as the obvious choice instead of asking what trade-off the user wants).
  - type: llm
    name: does-not-ask-what-the-sources-answer
    focus: last_message
    weight: 1
    criteria: |
      The sources already settle several things. The problem doc: about 3,000 members at one branch, fines are assessed by a nightly job, staff take payments at two desks, card payments already go through Stripe and that does not change, one developer maintains the service. The code: members sign in and use a portal (`/portal`, member role) where they can see and renew loans; fine collection exists as a staff-only `/fines` route.

      PASS if the response does not ask the user any of these as if unknown (for example "which payment provider do you use?", "how many members are there?", "do members have accounts or a portal?", "who maintains this?"). Stating what it read, or asking the user to confirm a specific reading, passes.

      FAIL if it asks the user to supply any of those facts as an open question.
  - type: llm
    name: stays-on-the-what
    focus: last_message
    weight: 1
    criteria: |
      This step decides WHAT the user wants built, not how to build or slice it.

      PASS if the response contains no thin path, no Given/When/Then acceptance criteria, and no technical design (routes, modules, data model) presented as decided. Mentioning what exists in the code as context is fine.

      FAIL if it writes any of those as its output.
