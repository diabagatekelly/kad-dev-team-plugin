schema_version: "1.0"
name: technology-bootstrap-phase3-reject
description: "Bootstrap phase 3, rejecting answer: the user overrules the test-runner and package-manager recommendations (npm and Jest, because they know them) and accepts the rest, deferring the UI framework included; expects the bootstrap written with the user's choices recorded as decided and the recommendations as rejected, the pinning posture restated for the manager the user chose rather than dropped, no re-arguing, and still only what the first test forces. Same frozen phase 2 as technology-bootstrap-phase3. Graded on the saved file. No baseline arm."
tags: [technology-bootstrap]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: |
    No on two of those. I'll take npm and Jest: I already know both and I don't want to learn new tools for a side project. The rest is fine as you recommend, deferring the UI framework included. Write it up that way and save it as `docs/technology-bootstrap-001.md`.
  model: sonnet
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  - type: file_exists
    name: bootstrap-written
    path: docs/technology-bootstrap-001.md
  - type: regex
    name: writes-nothing-else
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/technology-bootstrap-001\.md")[^"]*"'
    match: not_contains
  - type: llm
    name: records-the-users-choices-as-decided
    focus:
      source: file
      path: docs/technology-bootstrap-001.md
    weight: 1
    criteria: |
      The skill recommends and the user decides. The user rejected two recommendations and chose npm as the package manager and Jest as the test runner, because they already know both and don't want to learn new tools for a side project; they approved the rest as recommended, including deferring the UI framework.

      PASS if the document records npm and Jest as the decided choices, made by the user, with the user's reason (familiarity, no new tools), and records the skill's own recommendations (pnpm, Vitest) for those two categories as the alternatives the user declined, so the next person can tell it was a considered overrule, not an oversight. Keeping the recommendation's own reasoning readable is a plus, not required.

      FAIL if the document records the skill's recommendations as decided anyway, drops the user's reason, presents the user's choice as the skill's own recommendation, or leaves the declined recommendations out of the record.
  - type: llm
    name: does-not-relitigate
    focus:
      source: file
      path: docs/technology-bootstrap-001.md
    weight: 1
    criteria: |
      The user overruled two recommendations and said to write it up that way.

      PASS if the document proceeds with the user's choices: it may state once, as a recorded consequence, what the choice gives up (for example that npm's verified install is a separate command), but it does not argue the user should reconsider, does not mark npm or Jest themselves as provisional or pending, and does not ask for the same decision again. A new sub-choice that follows from the user's choice (a committed `.npmrc` to recover part of the posture, which Jest transform to use) may be proposed and left for the user; that is not re-asking the decision.

      FAIL if it re-argues for pnpm or Vitest, labels the user's choices as mistakes or as pending reconsideration, or asks the user to confirm npm or Jest again.
  - type: llm
    name: pinning-posture-restated-for-npm
    focus:
      source: file
      path: docs/technology-bootstrap-001.md
    weight: 1
    criteria: |
      The skill treats the package manager's lockfile and pinning posture as part of the decision. The user chose npm, where the lockfile carries content hashes but a verified, no-drift install is a separate command (`npm ci`) rather than the default behaviour of `npm install`, and exact versions in the manifest need a setting (`save-exact`) rather than being the default. The user's own criterion was "I don't have to remember a flag to stay safe".

      PASS if the document records the posture under npm honestly: the committed lockfile, how installs are kept from drifting (`npm ci` in CI and scripts, or equivalent), and that this now rests on a remembered command or a committed setting rather than a default — stated as a consequence of the user's choice, without refusing it.

      FAIL if the pinning posture is dropped from the record now that pnpm is out, if it claims npm gives the safe posture by default, or if it only says "pinning to be configured later".
  - type: llm
    name: records-the-built-in-default-set
    focus:
      source: file
      path: docs/technology-bootstrap-001.md
    weight: 1
    criteria: |
      The skill's rule (since 0.12.0): the categories slice 1's first failing test does not force but a later chunk of the slice may (an HTTP server, since the UI is a web app; a client for the bank-aggregation vendor; a log; how the page is rendered) are recorded as one default set, "the runtime's built-in unless a chunk forces a dependency", approved once as a whole, so the build re-enters the bootstrap only when a chunk forces a dependency the set excluded. The user's "the rest is fine as you recommend" approves that set along with the rest.

      PASS if the document records such a set under its own heading or list: at least a server and the vendor client, each with its default (Node's own module, the vendor's official client exact-pinned, server-rendered HTML, or a named dependency with its reason), and the set recorded as approved by the user (one line for the whole set is enough; a row marked provisional for a detail the user has not supplied, such as which vendor, is still approved). Saying that a chunk inside the set re-enters nothing while a dependency outside it is the one re-entry is a plus, not required.

      FAIL if those categories appear only as not-yet-decided with an owner and no default, if the set is recorded as pending or as separate open decisions, or if no such set appears.
  - type: llm
    name: asks-only-what-the-first-test-forces
    focus:
      source: file
      path: docs/technology-bootstrap-001.md
    weight: 1
    criteria: |
      This is a NEGATIVE grader: what the output declines to decide matters more
      than what it decides.

      Score 0 if the output asks the user to choose, or itself settles, any of
      these: a CI/CD pipeline or build automation; a hosting, deployment or
      cloud target; a container runtime; a database engine or product
      (Postgres, SQLite, DynamoDB, an ORM, or any named store on disk); a
      monitoring or observability vendor or stack; an auth provider. None of
      these is forced by writing slice 1's first failing test.

      Score 1 otherwise: the categories treated as forced stay within language
      and runtime, test runner, package manager (with its lockfile and pinning
      posture), and, if the first test drives a UI or crosses HTTP, a UI or
      HTTP framework.

      Two things do not count against this check. (1) A category listed as
      deliberately not decided, with an owner. (2) The skill's default set for
      what a later chunk of the slice may force, "the runtime's built-in unless
      a chunk forces a dependency", approved once as a whole: an in-memory
      store behind the persistence interface (a real implementation, not a
      database), the runtime's own HTTP, crypto and file modules,
      server-rendered HTML with no framework, the vendor's official client
      exact-pinned (or plain fetch), a small log writer to stdout, credentials
      read from the environment, a linter and formatter. Those are defaults
      for the build, not choices from the list above, however they are laid
      out (a table, a list, a section of their own).
