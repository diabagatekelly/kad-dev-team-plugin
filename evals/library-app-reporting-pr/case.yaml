schema_version: "1.0"
name: library-app-reporting-pr
description: "Boy Scout scoping: a PR adding export to the legacy reporting/ module; the new code's own issue must be flagged, the module's pre-existing issues named as non-blocking."
tags: [architecture-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`). Read whatever you need; do not modify anything.

    Review this PR for architecture issues. The PR adds `reporting/export-report.ts`, `reporting/report-files.port.ts` and `infra/files/local-report-files.ts`, and modifies `reporting/report-processor.ts` (the new `exporter` constructor parameter and the `runAndExport` method). Everything else in `reporting/`, and the rest of the app, is pre-existing and untouched by this PR.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob]
runs: 3
graders:
  - type: llm
    name: finds-new-code-mixing-levels
    focus: last_message
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      New in this PR: `reporting/export-report.ts` decides which report to run and where to write it, and in the same method assembles the CSV character by character (BOM, quoting, CRLF).

      PASS if the review raises this against the PR's new code and proposes extracting the CSV formatting from the orchestration.

      FAIL if not noticed, or if it is folded into remarks about the legacy module.
  - type: llm
    name: scopes-legacy-issues-as-non-blocking
    focus: last_message
    weight: 1
    criteria: |
      Judge substance only. This checks how the review treats problems that predate the PR: they should be named, but kept out of the PR's own findings and not made a condition of merging.

      Pre-existing and untouched by this PR: `reporting/report-queries.port.ts` is an SQL-level port the legacy reports write SQL against, and `reporting/revenue-report.ts` constructs the Stripe SDK directly.

      PASS if the review (a) mentions at least one of these pre-existing problems, (b) marks it as pre-existing / not introduced by this PR / not blocking merge, kept distinct from the findings against the new code, and (c) does not require the PR to fix them or to rewrite `reporting/` before merging.

      FAIL if pre-existing and new findings are not distinguished, or if the review requires cleaning up the pre-existing code as a condition of merging.
  - type: llm
    name: no-false-alarm-report-files-port
    focus: last_message
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      The PR adds `reporting/report-files.port.ts`, an interface with exactly one implementation (`infra/files/local-report-files.ts`) that isolates filesystem I/O. Per this persona's rules an interface the Dependency Rule requires is not premature with one implementation.

      PASS if the review does not flag the new port as premature / unnecessary abstraction. Not mentioning it passes.

      FAIL if it is reported as premature or recommended for removal.
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?architecture-review"'
    min: 1
