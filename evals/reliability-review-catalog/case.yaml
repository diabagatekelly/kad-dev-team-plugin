schema_version: "1.0"
name: reliability-review-catalog
description: "Clean module for reliability: catalog search, its adapter and route; expects nothing above Low."
tags: [reliability-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `.github/`, `ops/`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`, `test/`). Read whatever you need; do not modify anything.

    Review the `catalog/` module, its adapter in `infra/postgres/` and its route in `infra/http/` for production-readiness.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob]
runs: 3
graders:
  - type: llm
    name: reports-nothing-above-low
    focus: last_message
    weight: 1
    criteria: |
      This checks restraint on a module with no real reliability defect.

      `catalog/` searches books. `SearchCatalog` ignores searches shorter than two characters and caps results at 50 rows. `PostgresCatalogReader` runs one bounded, parameterised query. For the public route it runs on its own memoized pool (`publicSearchClient()` in `main/wiring.ts`: 4 connections, `queryTimeoutMs: 2_000`, a client-side timeout that includes waiting for a connection), so search load or a slow database cannot take connections from the 20-connection pool that session checks, checkout and fines share. `main/server.ts` rate-limits `/books` to 120 requests a minute per client, `GET /books/search/:terms` catches any failure, reports the path and a failure reason to monitoring (the adapter translates database errors into a catalog-owned `CatalogUnavailable` with a `reason`; anything else is `unexpected`) and answers 503 with a generic message, and `ops/alerts.yml` carries error-budget burn alerts for it with a runbook.

      PASS if the review reports no finding above Low for this module (Low or informational notes, such as caching, a retry, a correlation id, or a search index for the leading-wildcard `ILIKE`, are fine). `ops/runbooks/catalog-search.md` states the scale: about 60,000 titles, growing by a few hundred a month, 40 ms p95. A search-speed or shared-pool capacity concern that ignores that scale is speculation, not a Medium finding.

      Only findings about the catalog module, its adapter (`infra/postgres/postgres-catalog-reader.ts`) or its route (`infra/http/catalog-routes.ts`) count. Findings about other parts of the service do not affect this check, whatever their severity, even when the review explains them in terms of catalog traffic or catalog errors. In particular, a finding about the `request-errors` alert in `ops/alerts.yml` (it pages on any single error event, service-wide) is about the alert configuration, not the catalog module, and never counts here; neither does anything about the member directory's connection pool.

      FAIL if any finding about the catalog module, its adapter or its route is rated Medium or higher.
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:reliability-review"'
    min: 1
