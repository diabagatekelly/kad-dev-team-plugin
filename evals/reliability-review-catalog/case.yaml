schema_version: "1.0"
name: reliability-review-catalog
description: "Clean module for reliability: catalog search, its adapter and route; expects nothing above Low."
tags: [reliability-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `.github/`, `ops/`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`, `test/`). Read whatever you need; don't change the code.

    Review the `catalog/` module, its adapter in `infra/postgres/` and its route in `infra/http/` for production-readiness.

    Save the review as `docs/reviews/reliability-review-catalog.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write]
runs: 3
graders:
  - type: file_exists
    name: review-written
    path: docs/reviews/reliability-review-catalog.md
  - type: regex
    name: leaves-the-code-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"file_path":"(?![^"]*docs/reviews/reliability-review-catalog\.md")[^"]*"'
    match: not_contains
  - type: llm
    name: reports-nothing-above-low
    focus:
      source: file
      path: docs/reviews/reliability-review-catalog.md
    weight: 1
    criteria: |
      This checks restraint on a module with no real reliability defect.

      Count only findings whose location is under `catalog/`, or is `infra/postgres/postgres-catalog-reader.ts` or `infra/http/catalog-routes.ts`. A finding located anywhere else (`ops/alerts.yml`, `main/wiring.ts`, `main/server.ts`, the member directory's connection pool, anything service-wide) does not count, whatever its severity and however it is explained.

      For context: `SearchCatalog` ignores searches shorter than two characters and caps results at 50 rows; `PostgresCatalogReader` runs one bounded, parameterised query on its own memoized 4-connection pool with a 2-second client-side timeout; the route is rate-limited, catches failures, reports them to monitoring and answers 503 with a generic message; `ops/runbooks/catalog-search.md` records about 60,000 titles and 40 ms p95.

      PASS if no counted finding is rated Medium or higher. Low or informational notes (caching, a retry, a correlation id, a search index for the leading-wildcard `ILIKE`) are fine.

      FAIL if any counted finding is rated Medium or higher.
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:reliability-review"'
    min: 1
