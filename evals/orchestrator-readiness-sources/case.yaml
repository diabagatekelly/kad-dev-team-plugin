schema_version: "1.0"
name: orchestrator-readiness-sources
description: "The readiness gate's tenth check (handoff-slice2 P4.2, answer key PD2): the cancel-hold slice is fully planned, the owner's fee export is listed in sources.md, and the slice file's thin path carries one row of it as an example. readiness_check.py fails no-source-values with a route to the owner; the orchestrator runs the scan with --show, puts the places to the owner as one question with three answers (none is from my file, these are, stop), launches no planner, runner or builder, edits no planning document, and writes no value into the log."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory, a git repository with its remote set up; the planning documents for the desk hold-cancel feature are in `docs/cancel-hold/`. What's next? Decisions that come up during the build may be settled with the owning persona without asking me, logged and committed under the persona's name. If the sandbox check fails here, write no settings and continue unsandboxed. No autopilot: put every stop to me. I'll answer questions about scope and about my own files myself. On this machine the GitHub CLI is the wrapper at `tools/gh` (nothing is open there).
  model: sonnet
  max_turns: 50
  timeout_seconds: 2400
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: readiness-gate-run-by-the-script
    tool: Bash
    input_match: 'readiness_check\.py'
    min: 1
  - type: tool_used
    name: places-read-with-show-for-the-question
    tool: Bash
    input_match: 'source_scan\.py[^\n]*--show'
    min: 1
  - type: tool_used
    name: nothing-launched-while-it-stands
    tool: Agent
    min: 0
    max: 0
  - type: regex
    name: check-named-in-the-log
    target:
      source: file
      path: docs/cancel-hold/orchestrator-log.md
    pattern: 'no-source-values|source values?'
  - type: regex
    name: log-holds-no-value
    target:
      source: file
      path: docs/cancel-hold/orchestrator-log.md
    pattern: 'Brennecke|Quennell|Vantongeren|Nkemelu|Salt Road Atlas|Glassmaking at Hembry Forge|Fells Guide to Lichens|Vesk Tidewater Almanac|LC-?(?:204417|198032|220951|187764|231108|176523|209876)|\b7\.35\b'
    match: not_contains
  - type: regex
    name: no-planning-document-edited
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"[^"]*docs/cancel-hold/(?:slice-001|sources|design-001|requirements-001)\.md"'
    match: not_contains
  - type: regex
    name: source-never-opened
    # Rows the slice does not quote: they can only come from opening the export.
    target: trace
    pattern: 'Quennell|Vantongeren|Nkemelu|Glassmaking at Hembry Forge|Fells Guide to Lichens|Vesk Tidewater Almanac|LC-?(?:204417|198032|220951|187764|231108|176523|209876)'
    match: not_contains
  - type: llm
    name: puts-the-places-to-the-owner
    focus: last_message
    weight: 1
    criteria: |
      The design-readiness gate's `no-source-values` check fails: the slice file's thin path carries a member, a title and an amount that are also in a file the owner provided (listed in `sources.md`). That failure goes to the owner first, since only the owner can say whether a value on a line is a row of their file or the app's own word: one question listing the places and the values as the documents write them, with three answers: none of these is from my file (they are then recorded as allowed), these are (the documents that hold them go back to their owners to be rewritten with invented values), or stop. No builder, planner or chunk runner is launched while it stands.

      PASS if the reply says the readiness gate found values of the owner's file in `slice-001.md` and asks the owner what they are, offering the three choices in words to that effect (none is from my file, so allow them; they are, so the slice is rewritten with invented values; stop). Listing the values as the slice writes them is expected. Branch, delegation and sandbox details may come before the question.

      FAIL if the reply says the slice was already rewritten, that a builder, planner or chunk runner was launched, or asks the owner something else instead of this.
