schema_version: "1.0"
name: reliability-requirements-payfine-phase3
description: "Pay-a-fine slice, phase 3: the user rejects the recommendation and keeps 'show failed on timeout'; expects the finished criteria (charge-then-settle, double submit, declines vs faults) written for that choice, duplicates findable for the manual refund, a recorded decision, and no retry of declines. No baseline arm."
tags: [reliability-requirements, library-app]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: |
    Keep the engineer's version: on a timeout, tell the member it failed and let them try again. If someone gets charged twice I'll refund it by hand. For everything else, go with your recommendations.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob]
runs: 3
graders:
  - type: llm
    name: criteria-make-the-chosen-behaviour-workable
    focus: last_message
    weight: 1
    criteria: |
      Judge substance only: section names, wording and Given/When/Then formatting details do not matter. What matters is whether the response's acceptance criteria (or its decisions, where this criterion says so) require the outcome described, in a form someone could later check.

      The user chose to tell the member a timed-out payment failed and let them retry, accepting occasional duplicate charges that they will refund by hand. A manual refund is only possible if the developer can find the duplicates.

      PASS if the finished criteria are written for the user's choice (a timed-out payment is reported to the member as failed and may be retried) and require that a duplicate or unmatched charge is visible to the developer (for example every charge traceable to its fine, or charges without a settled fine reported), so the refund can happen.

      FAIL if it writes the "pending, confirm before retry" behaviour instead of the user's choice, or covers the user's choice without any way to find duplicates.
  - type: llm
    name: records-the-decision-without-relitigating
    focus: last_message
    weight: 1
    criteria: |
      The skill's rule: present a fork with a recommendation, then write in what the user approves.

      PASS if the response records the decision (what was chosen, what was rejected, and the accepted risk of duplicate charges) and proceeds with the user's choice. Stating the risk once is expected.

      FAIL if it refuses, keeps arguing for its own recommendation as a precondition, asks for approval of the same decision again, or omits the decision entirely.
  - type: llm
    name: criterion-charge-without-settle-is-caught
    focus: last_message
    weight: 1
    criteria: |
      Judge substance only: section names, wording and Given/When/Then formatting details do not matter. What matters is whether the response's acceptance criteria (or its decisions, where this criterion says so) require the outcome described, in a form someone could later check.

      `fines/collect-fine.ts` charges the card and then settles the fine in a separate step. If the settle fails, or the process dies, after a successful charge, the member has paid but the fine still shows outstanding. The user has accepted occasional duplicate charges and will refund them by hand, so preventing a second charge is not required here; noticing this case is.

      PASS if a criterion covers a successful charge whose fine is not then recorded as paid: it is made visible to the developer with what is needed to reconcile it (at least the fine and the charge), rather than passing silently.

      FAIL if the interrupted charge-then-settle case is not covered.
  - type: llm
    name: criterion-double-submit-is-covered
    focus: last_message
    weight: 1
    criteria: |
      Judge substance only: section names, wording and Given/When/Then formatting details do not matter. What matters is whether the response's acceptance criteria (or its decisions, where this criterion says so) require the outcome described, in a form someone could later check.

      Besides a retry after a timeout, a member can submit the same payment twice at nearly the same time (double click, two tabs). The user accepted occasional duplicate charges, refunded by hand.

      PASS if the response covers double or concurrent submission of the same fine explicitly, either with a criterion that it charges at most once, or by naming it as part of the duplicate-charge risk the user accepted (so it is also found and refunded).

      FAIL if double or concurrent submission is not addressed at all (a timeout retry alone does not count).
  - type: llm
    name: separates-declines-from-faults
    focus: last_message
    weight: 1
    criteria: |
      Judge substance only: section names, wording and Given/When/Then formatting details do not matter. What matters is whether the response's acceptance criteria (or its decisions, where this criterion says so) require the outcome described, in a form someone could later check.

      A declined or expired card, or insufficient funds, is an expected outcome: the member should be told what happened and what to do. A payment-provider outage or a database failure is a fault: it must be visible to the developer and must not be presented to the member as a declined card. The existing `POST /fines/:id/pay` turns every error into a 402 and reports nothing.

      PASS if the criteria distinguish the two: declines produce a member-facing message saying what to do, and faults are reported/visible to the developer and shown to the member as something other than a decline.

      FAIL if the two are treated alike or faults are not required to be visible.
  - type: llm
    name: no-retry-of-declines
    focus: last_message
    weight: 1
    criteria: |
      Judge substance only. This checks that the response does NOT require something harmful.

      Declined, expired-card and insufficient-funds results are the provider's deterministic answers; retrying them cannot succeed and looks like card testing. (The existing `CollectFine` retries every failure up to three times.)

      PASS if no criterion requires or endorses automatically retrying a declined, expired or insufficient-funds charge. Requiring that declines are not retried, or allowing a retry only for transient faults, passes.

      FAIL if a criterion calls for retrying declines.
