schema_version: "1.0"
name: reliability-requirements-payfine-phase3
description: "Pay-a-fine slice, phase 3: the user rejects the recommendation and keeps 'show failed on timeout'; expects the finished document saved, with every decision approved, the criteria (charge-then-settle, double submit, declines vs faults) written for that choice, duplicates findable for the manual refund, the decision recorded without re-arguing, and no retry of declines. Graded on the saved file. No baseline arm."
tags: [reliability-requirements, library-app]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: |
    Keep the engineer's version: on a timeout, tell the member it failed and let them try again. If someone gets charged twice I'll refund it by hand. For everything else, go with your recommendations. Save the finished document as `docs/pay-fine/reliability-requirements-001.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write]
runs: 3
graders:
  - type: file_exists
    name: document-written
    path: docs/pay-fine/reliability-requirements-001.md
  - type: regex
    name: leaves-the-code-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/pay-fine/reliability-requirements-001\.md")[^"]*"'
    match: not_contains
  - type: llm
    name: criteria-make-the-chosen-behaviour-workable
    focus:
      source: file
      path: docs/pay-fine/reliability-requirements-001.md
    weight: 1
    criteria: |
      Judge substance only: section names, wording and Given/When/Then formatting details do not matter. What matters is whether the document's acceptance criteria (or its decisions, where this criterion says so) require the outcome described, in a form someone could later check.

      The user chose to tell the member a timed-out payment failed and let them retry, accepting occasional duplicate charges that they will refund by hand. A manual refund is only possible if the developer can find the duplicates.

      PASS if the finished criteria are written for the user's choice (a timed-out payment is reported to the member as failed and may be retried) and require that a duplicate or unmatched charge is visible to the developer (for example every charge traceable to its fine, or charges without a settled fine reported), so the refund can happen.

      FAIL if it writes the "pending, confirm before retry" behaviour instead of the user's choice, or covers the user's choice without any way to find duplicates.
  - type: llm
    name: records-the-decision-without-relitigating
    focus:
      source: file
      path: docs/pay-fine/reliability-requirements-001.md
    weight: 1
    criteria: |
      The skill's rule: present a fork with a recommendation, then write in what the user approves. The user rejected the recommendation and kept the engineer's "failed, try again" on a timeout, accepting duplicate charges refunded by hand.

      PASS if the document records that decision as the user's approved choice, names the recommendation as the rejected alternative, states the accepted risk of duplicate charges once, and proceeds with the user's choice.

      FAIL if it refuses, keeps arguing for its own recommendation as a precondition, asks for approval of the same decision again, leaves the decision marked pending, or omits the decision entirely.
  - type: llm
    name: decisions-all-approved
    focus:
      source: file
      path: docs/pay-fine/reliability-requirements-001.md
    weight: 1
    criteria: |
      The user said "for everything else, go with your recommendations", which approves every other fork the skill presented. The skill's rule: a decision is marked approved only by the user, and a criterion that depends on a pending decision waits for it.

      PASS if every decision the document lists is marked approved (the user's choice for the timeout, the recommendation for the others), no decision is left pending, and no criterion is marked as waiting on a decision. A genuinely new question the user never saw may stay open.

      FAIL if a decision the user approved is still marked pending or presented as needing approval, or a criterion is withheld as waiting on one.
  - type: llm
    name: criterion-charge-without-settle-is-caught
    focus:
      source: file
      path: docs/pay-fine/reliability-requirements-001.md
    weight: 1
    criteria: |
      Judge substance only: section names, wording and Given/When/Then formatting details do not matter. What matters is whether the document's acceptance criteria (or its decisions, where this criterion says so) require the outcome described, in a form someone could later check.

      `fines/collect-fine.ts` charges the card and then settles the fine in a separate step. If the settle fails, or the process dies, after a successful charge, the member has paid but the fine still shows outstanding. The user has accepted occasional duplicate charges and will refund them by hand, so preventing a second charge is not required here; noticing this case is.

      PASS if a criterion covers a successful charge whose fine is not then recorded as paid: it is made visible to the developer with what is needed to reconcile it (at least the fine and the charge), rather than passing silently.

      FAIL if the interrupted charge-then-settle case is not covered.
  - type: llm
    name: criterion-double-submit-is-covered
    focus:
      source: file
      path: docs/pay-fine/reliability-requirements-001.md
    weight: 1
    criteria: |
      Judge substance only: section names, wording and Given/When/Then formatting details do not matter. What matters is whether the document's acceptance criteria (or its decisions, where this criterion says so) require the outcome described, in a form someone could later check.

      Besides a retry after a timeout, a member can submit the same payment twice at nearly the same time (double click, two tabs). The user accepted occasional duplicate charges, refunded by hand.

      PASS if the document covers double or concurrent submission of the same fine explicitly, either with a criterion that it charges at most once, or by naming it as part of the duplicate-charge risk the user accepted (so it is also found and refunded).

      FAIL if double or concurrent submission is not addressed at all (a timeout retry alone does not count).
  - type: llm
    name: separates-declines-from-faults
    focus:
      source: file
      path: docs/pay-fine/reliability-requirements-001.md
    weight: 1
    criteria: |
      Judge substance only: section names, wording and Given/When/Then formatting details do not matter. What matters is whether the document's acceptance criteria (or its decisions, where this criterion says so) require the outcome described, in a form someone could later check.

      A declined or expired card, or insufficient funds, is an expected outcome: the member should be told what happened and what to do. A payment-provider outage or a database failure is a fault: it must be visible to the developer and must not be presented to the member as a declined card. The existing `POST /fines/:id/pay` turns every error into a 402 and reports nothing.

      PASS if the criteria distinguish the two: declines produce a member-facing message saying what to do, and faults are reported/visible to the developer and shown to the member as something other than a decline.

      FAIL if the two are treated alike or faults are not required to be visible.
  - type: llm
    name: no-retry-of-declines
    focus:
      source: file
      path: docs/pay-fine/reliability-requirements-001.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the document does NOT require something harmful.

      Declined, expired-card and insufficient-funds results are the provider's deterministic answers; retrying them cannot succeed and looks like card testing. (The existing `CollectFine` retries every failure up to three times.)

      PASS if no criterion requires or endorses automatically retrying a declined, expired or insufficient-funds charge. Requiring that declines are not retried, or allowing a retry only for transient faults, passes.

      FAIL if a criterion calls for retrying declines.
