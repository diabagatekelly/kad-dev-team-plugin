<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Screen design — Transactions: nothing found</title>
<style>
  :root {
    --navy: #16205C; --accent: #2954E6;
    --bg: #F7F5F1; --surface: #FFFFFF;
    --gray-100: #F1F2F5; --gray-300: #DADCE3; --gray-500: #6B7280; --gray-900: #111827;
    --radius-md: 12px; --radius-full: 999px;
    --shadow-card: 0 1px 2px rgba(16,27,76,0.06), 0 4px 12px rgba(16,27,76,0.08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--gray-900); display: flex; min-height: 100vh; }
  .app-shell { display: flex; flex-direction: column; flex: 1; }
  header.topbar { height: 56px; background: #fff; border-bottom: 1px solid var(--gray-300); display: flex; align-items: center; padding: 0 24px; gap: 8px; font-weight: 700; font-size: 15px; color: var(--navy); }
  header.topbar .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); }
  .body-row { display: flex; flex: 1; }
  nav.rail { width: 68px; background: var(--navy); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 6px; flex-shrink: 0; }
  nav.rail .add-btn { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.5); color: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
  nav.rail .icon { width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.55); }
  nav.rail .icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  nav.rail .icon.active { background: rgba(255,255,255,0.12); color: #fff; }
  nav.rail .icon.disabled { color: rgba(255,255,255,0.25); }
  main { flex: 1; padding: 32px 40px; max-width: 760px; }
  header.page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 26px; font-weight: 700; margin: 0; }
  .btn-outline { font-family: inherit; font-size: 14px; font-weight: 600; height: 44px; padding: 0 18px; border-radius: var(--radius-full); border: 1.5px solid var(--accent); background: #fff; color: var(--accent); cursor: pointer; }
  .card { background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 48px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
  .card .dot { width: 40px; height: 40px; border-radius: 50%; background: var(--gray-100); color: var(--gray-500); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .card strong { font-size: 16px; }
  .card p { margin: 0; font-size: 14px; color: var(--gray-500); max-width: 360px; }
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar"><div class="mark"></div>Ledger</header>
  <div class="body-row">
    <nav class="rail">
      <div class="add-btn"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 5v14M5 12h14"/></svg></div>
      <div class="icon active" title="Accounts"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7"/><path d="M5 9v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V9"/></svg></div>
      <div class="icon disabled"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></div>
      <div class="icon disabled"><svg viewBox="0 0 24 24"><path d="M4 19V9M12 19V4M20 19v-6"/></svg></div>
      <div class="icon disabled"><svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></div>
    </nav>
    <main>
      <header class="page-head">
        <h1>Chase Checking</h1>
        <button class="btn-outline">Reconnect</button>
      </header>
      <div class="card">
        <div class="dot">–</div>
        <strong>No transactions found</strong>
        <p>Chase has finished preparing this account, and there genuinely weren't any transactions for this period.</p>
      </div>
    </main>
  </div>
</div>
</body>
</html>
