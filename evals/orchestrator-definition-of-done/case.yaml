schema_version: "1.0"
name: orchestrator-definition-of-done
description: "The chunk loop's D.2 step (design §11 case 8): three chunks built, no README, a script body inside a template literal in lending/cancel-hold-notice.ts, comment density over the 5% line. done_check.py runs before any reviewer and names three fixes; the orchestrator acts on them in one batch (docs-writer:readme inline, one code-reviewer launch for the comments with why-comments, one Sonnet fixer for the rest and the verdicts), runs the gate and the check again, and hands off before the slice reviewers as told. No slice reviewer is launched."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory, a git repository on the branch `slice-001-cancel-hold`; the planning documents are in `docs/cancel-hold/`. The build of slice 001 was handed off at the end of the previous session: `docs/cancel-hold/implementation/handoff-slice-001.md` says where it stopped. Keep going, and hand off before the slice reviewers are launched (after the Definition of Done has been acted on and checked again).
  model: sonnet
  max_turns: 80
  timeout_seconds: 3000
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: definition-of-done-checked-twice
    tool: Bash
    input_match: 'done_check\.py'
    min: 2
  - type: tool_order
    name: check-before-any-launch
    before: {tool: Bash, input_match: 'done_check\.py'}
    after: Agent
  - type: tool_used
    name: readme-skill-invoked-inline
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:readme"'
    min: 1
  - type: file_exists
    name: readme-written
    path: README.md
  - type: tool_used
    name: one-comments-review
    tool: Agent
    input_match: '(?=[\s\S]*"subagent_type"\s*:\s*"(?:kad-dev-team:)?code-reviewer)(?=[\s\S]*why-comments)'
    min: 1
    max: 1
  - type: tool_used
    name: one-fixer-for-the-batch
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:kad-dev-team:)?tdd-coach'
    min: 1
    max: 1
  - type: tool_used
    name: no-slice-reviewer-yet
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:kad-dev-team:)?(?:software-architect|devsecops-engineer|accessibility-engineer)'
    min: 0
    max: 0
  - type: tool_used
    name: code-reviewer-only-for-the-comments
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:kad-dev-team:)?code-reviewer'
    min: 1
    max: 1
  - type: tool_used
    name: gate-on-the-fix
    tool: Bash
    input_match: 'validation_gate\.py'
    min: 1
  - type: llm
    name: three-named-fixes-in-one-batch
    focus: last_message
    weight: 1
    criteria: |
      The Definition of Done runs before any reviewer at D and names a fix per failing check. Here three checks fail: no README (docs-writer:readme writes it, inline, and commits it), application code inside a string literal (a fixer moves it into a module), and comment density over 5% (a code-review pass on comments only, invoking why-comments, then the fixer acts on its verdicts). Everything goes to one fresh fixer in one batch; then the gate, then the check again. A check still failing after that stands (README, typecheck, lint and code in strings as High, which stops the flow; comment density and the others as Medium for the pull request body).

      PASS if the reply reports those three checks as the ones that failed, the README written by the readme skill, one comments review and one fixer for the batch, the gate and the re-check with its result (passed, or which checks still stand and whether the flow stops), and the handoff before the slice reviewers.

      FAIL if it launches the slice reviewers, fixes the code or writes the README itself, launches a fixer per check, or skips the re-check.
