schema_version: "1.0"
name: orchestrator-superseded-scope-map
description: "Real inspection: scope-map-001 is superseded by scope-map-002, whose step 1 has no requirements doc yet; the Active requirements-001 belongs to the superseded map. Must route to requirements-refinement for scope-map-002 step 1, not to slicing."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. We're planning a new feature for it, and the planning documents so far are in `docs/pay-fine/`. What's next?
  model: sonnet
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: invokes-requirements-refinement
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:requirements-refinement"'
    min: 1
  - type: tool_used
    name: does-not-slice
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:vertical-slicing"'
    min: 0
    max: 0
  - type: tool_used
    name: does-not-hunt-for-agent-files
    tool: Glob
    input_match: 'AGENT|agents/|devsecops-engineer|product-slicer|product-manager'
    min: 0
    max: 0
  - type: llm
    name: routes-to-requirements-for-the-active-map
    focus: last_message
    weight: 1
    criteria: |
      `docs/pay-fine/scope-map-001.md` has `## Status: Superseded by scope-map-002`; `scope-map-002.md` is Active and its step 1 is "See outstanding fines". The only requirements doc, `requirements-001.md`, is for scope-map-001 step 1 (paying a fine), so the current unit — scope-map-002 step 1 — has no requirements doc. The next step is `product-manager:requirements-refinement` for scope-map-002 step 1.

      PASS if the response works on (or routes to) requirements refinement for scope-map-002 step 1 (seeing outstanding fines).

      FAIL if it treats scope-map-001 or requirements-001 as current (for example routes to slicing "paying a fine online"), or routes anywhere else.
  - type: file_exists
    name: log-written
    path: docs/pay-fine/orchestrator-log.md
