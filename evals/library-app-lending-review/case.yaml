schema_version: "1.0"
name: library-app-lending-review
description: "Review of lending/: ORM in a use case, a real runtime import cycle, a framework request type crossing into a use case, a use case reaching into the composition root; trap for a type-only cycle."
tags: [architecture-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`). Read whatever you need; don't change the code.

    Review the `lending/` module for architecture issues. Read its ports, the adapters under `infra/` that implement them, and `main/` as needed to judge it.

    Save the review as `docs/reviews/library-app-lending-review.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write]
runs: 3
graders:
  # E7 (TODO.md, decision 8, 2026-11-15): cut as judges that passed three
  # runs of three with and without the plugin in E6:
  # `finds-http-request-in-place-hold`,
  # `finds-use-case-reaching-into-wiring`. What they graded is still in the
  # fixture. `finds-runtime-import-cycle` is the judge kept on the case's
  # most important planted problem.
  - type: file_exists
    name: review-written
    path: docs/reviews/library-app-lending-review.md
  - type: regex
    name: leaves-the-code-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/reviews/library-app-lending-review\.md")[^"]*"'
    match: not_contains
  # Reworded in E7 (TODO.md, decision 9): "a must-fix / top-tier finding"
  # was read as the highest severity in the review, and the judge failed,
  # three votes of three, a review that had the finding at High with the
  # fix the criterion asks for, second to the Critical cycle (E6; five
  # earlier runs failed too). `library-app-lending-review-via-agent`
  # carries the old wording still: it was not in E7.
  - type: llm
    name: finds-orm-inside-checkout-use-case
    focus:
      source: file
      path: docs/reviews/library-app-lending-review.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `lending/checkout-book.ts` imports `OrmRepository`, `OrmRow` and `PgClient` from `pg-orm`, declares its own ORM row class, runs its queries through the ORM, and `run()` returns the ORM row. A `LoanStore` port (`lending/loan-store.port.ts`) already exists with a Postgres adapter and is not used here.

      PASS if the review flags business logic depending directly on the ORM in this file, rates it High or Critical (or, where it uses no such words, calls it something that must be fixed), and proposes moving persistence behind the existing `LoanStore` port or an equivalent interface. The module also holds a runtime import cycle that a review rightly rates above everything else: the ORM finding rated High, one step below a Critical cycle and listed second, passes. The review need not spell out why the class is built around the ORM (constructor, field, query, return type), as long as the finding is about the use case depending on it.

      FAIL if it is missed, rated Medium or Low, or presented as minor or optional.
  - type: llm
    name: finds-runtime-import-cycle
    focus:
      source: file
      path: docs/reviews/library-app-lending-review.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `lending/loan.ts` and `lending/loan-policy.ts` import each other as values, and both construct the other class in a static field initializer (`Loan.policy = new LoanPolicy()`, `LoanPolicy.sample = new Loan(...)`). Loading either module throws at startup.

      PASS if the review identifies this mutual import as a real module-load problem caused by the static initializers (not merely a stylistic or type-level cycle), treats it as must-fix at the highest severity it uses, and proposes a fix that breaks the cycle (drop `LoanPolicy.sample`, inject the policy, or similar).

      FAIL if missed, dismissed as harmless or type-only, or treated as optional cleanup.
  - type: llm
    name: no-false-alarm-type-only-cycle
    focus:
      source: file
      path: docs/reviews/library-app-lending-review.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      `lending/hold.ts` and `lending/hold-queue.ts` reference each other, but both use `import type`, so nothing exists at runtime and there is no load-order problem.

      PASS if the review does not present this pair as a real/runtime/build-breaking circular dependency or as a must-fix. Not mentioning it, or noting it is type-only and harmless, or a Low-severity style note, all pass.

      FAIL if it is reported as a genuine circular dependency problem or asked to be fixed before merge.

      An empty or findings-free review does not pass this check: the review must also report at least one real finding of its own (a problem it asks to be fixed, at any severity). FAIL if it reports none.
  - type: llm
    name: states-assumed-importance-ordering
    focus:
      source: file
      path: docs/reviews/library-app-lending-review.md
    weight: 0.5
    criteria: |
      The reviewer is expected to say, explicitly, which parts of this module it treats as more important (the lending rules and policy) versus less important (Postgres persistence, HTTP, third-party libraries) and that findings are judged against that ordering, rather than leaving the ordering implicit.

      PASS if the review states the ordering it assumes, in at least a sentence, anywhere in the response. FAIL if no such statement appears.
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?architecture-review"'
    min: 1
