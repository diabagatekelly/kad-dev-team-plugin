schema_version: "1.0"
name: technology-bootstrap-phase1
description: "Empty repo with slice 1's agreed artifacts in docs/: the skill must ask or recommend before settling the starting stack, and only for what the first test forces."
tags: [technology-bootstrap]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    This repository is empty apart from `docs/`, which holds slice 1's agreed artifacts: the slice, its design, and its security criteria. Work out what has to be set up before the first failing test for slice 1 can be written.
  model: sonnet
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  - type: llm
    name: asks-before-settling
    focus: last_message
    weight: 1
    criteria: |
      The skill's rule: technology choices are the user's; it recommends and records them. The starting set covers only what slice 1's first failing test forces.

      PASS if the response asks the user something before settling the starting stack (who builds and maintains it, a language preference, or approval of a first recommendation) and has not delivered a finished bootstrap with choices made on the user's behalf.

      FAIL if it delivers finished stack choices without asking.
  - type: llm
    name: asks-only-what-the-first-test-forces
    focus: last_message
    weight: 1
    criteria: |
      This is a NEGATIVE grader: what the output declines to decide matters more
      than what it decides.

      Score 0 if the output asks the user to choose, or itself settles, any of
      these: a CI/CD pipeline or build automation; a hosting, deployment or
      cloud target; a container runtime; a database engine or product
      (Postgres, SQLite, DynamoDB, an ORM, or any named store on disk); a
      monitoring or observability vendor or stack; an auth provider. None of
      these is forced by writing slice 1's first failing test.

      Score 1 otherwise: the categories treated as forced stay within language
      and runtime, test runner, package manager (with its lockfile and pinning
      posture), and, if the first test drives a UI or crosses HTTP, a UI or
      HTTP framework.

      Two things do not count against this check. (1) A category listed as
      deliberately not decided, with an owner. (2) The skill's default set for
      what a later chunk of the slice may force, "the runtime's built-in unless
      a chunk forces a dependency", approved once as a whole: an in-memory
      store behind the persistence interface (a real implementation, not a
      database), the runtime's own HTTP, crypto and file modules,
      server-rendered HTML with no framework, the vendor's official client
      exact-pinned (or plain fetch), a small log writer to stdout, credentials
      read from the environment, a linter and formatter. Those are defaults
      for the build, not choices from the list above, however they are laid
      out (a table, a list, a section of their own).
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:technology-bootstrap"'
    min: 1
