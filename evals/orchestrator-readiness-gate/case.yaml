schema_version: "1.0"
name: orchestrator-readiness-gate
description: "The chunk loop's A step with its design-readiness gate (design §11 case 1): a fully planned UI slice whose reliability document says \"retries the cancel a few times\" and whose screen design has no mockup for the unreachable-queue state the reliability document names. The orchestrator reaches the chunk loop, runs readiness_check.py before any builder, logs one backward route per failed check (reliability-requirements, screen-design), runs the first routed skill inline with the check named, and launches no builder while the gate fails. Since H3.2 the design homes both failure paths under `### Strategic` and `### Tactical` only (its Decisions are one line each), the headings the check reads by name: no route to architecture-design for failure paths."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory, a git repository with its remote set up; the planning documents for the desk hold-cancel feature are in `docs/cancel-hold/`. What's next? Decisions that come up during the build may be settled with the owning persona without asking me, logged and committed under the persona's name. If the sandbox check fails here, write no settings and continue unsandboxed; I won't be around to answer questions while you work. Hand off as soon as the chunk loop's A line is written (write the handoff file and stop; don't start B in this session). No autopilot: put every stop to me. No browser answers here: continue with every screen check owed.
  model: sonnet
  max_turns: 60
  timeout_seconds: 2400
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: readiness-gate-run-by-the-script
    tool: Bash
    input_match: 'readiness_check\.py'
    min: 1
  - type: tool_used
    name: no-builder-while-the-gate-fails
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:kad-dev-team:)?tdd-coach'
    min: 0
    max: 0
  - type: tool_used
    name: first-failed-check-routed-inline
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:(?:reliability-requirements|screen-design)"'
    min: 1
  - type: tool_order
    name: gate-before-the-routed-skill
    before: {tool: Bash, input_match: 'readiness_check\.py'}
    after: {tool: Skill, input_match: 'kad-dev-team:(?:reliability-requirements|screen-design)'}
  - type: llm
    name: backward-routes-name-the-checks
    focus:
      source: file
      path: docs/cancel-hold/orchestrator-log.md
    weight: 1
    criteria: |
      The chunk loop's A step runs the design-readiness gate after the branch and before any builder. On FAIL, each failed check is a backward route with its own log entry naming the check and the document to revise in place, routed to the persona the check names; the chunk-loop entry stays open meanwhile and its A line is written only once the gate passes. Here two checks fail: the reliability document names a retry with no number (`numbers-on-waits`, to `devsecops-engineer:reliability-requirements`, document `reliability-slice-001.md`), and the screen design has no mockup for the unreachable-queue state (`states-have-mockups`, to `ux-designer:screen-design`, the screen design under `visual-ux/`).

      PASS if the log has the chunk-loop entry (routed to the chunk loop, artifact "see sub-entries below") and at least one backward-route entry after it that names a failed readiness check (the retry with no number, or the missing mockup, in the check's name or in words) and routes to the matching persona or skill (reliability-requirements or screen-design) naming the document to revise. The second backward entry may be missing when the first routed skill stopped to ask the owner.

      FAIL if no backward entry exists, if a backward entry routes to the builder or to a persona the check does not name, or if the chunk-loop entry's A line reports readiness as PASS without any backward route.
  - type: regex
    name: a-line-carries-session-and-audit
    target:
      source: file
      path: docs/cancel-hold/orchestrator-log.md
    pattern: '\*\*A\. Start:\*\*[^\n]*\bsession\b[^\n]*\baudit\b[^\n]*(off|not configured|audit clone)[^\n]*\btranscript\b[^\n]*(kept|MISSING|not checked)'
  - type: regex
    name: no-failure-paths-route
    # The design's failure paths live under `### Strategic` and `### Tactical`
    # (H3.2): the check reads those headings by name, so the gate never routes
    # back to architecture-design for them.
    target:
      source: file
      path: docs/cancel-hold/orchestrator-log.md
    pattern: 'failure-paths-homed'
    match: not_contains
  - type: llm
    name: stops-at-the-routed-skill-or-reports-the-route
    focus: last_message
    weight: 1
    criteria: |
      The chunk loop's A step runs the readiness gate before any builder; on FAIL each failed check is a backward route whose skill runs inline and revises its document, then the gate runs again, until it passes. The owner asked for a hand-off as soon as the A line is written, so nothing past A happens in this session.

      PASS if the reply reports the readiness gate's failed checks (the retry with no number, the missing mockup) and the backward routes taken (to reliability-requirements and screen-design), and ends either with the gate passing and the handoff written before B, or with a routed skill's question to the owner (a number for the retry, or the state to design); in every case nothing has been built and no chunk builder or planner has been launched. The routed skills run inline, in the orchestrator's own turn, so a reply saying the orchestrator revised the documents, settled the numbers under the delegation or committed under the persona's name describes the route taken, not a decision it took on its own.

      FAIL if it launches the chunk 1 builder or the planner while a check still fails or starts B, or skips the gate.
