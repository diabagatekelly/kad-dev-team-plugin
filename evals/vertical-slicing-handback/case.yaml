schema_version: "1.0"
name: vertical-slicing-handback
description: "Pay-a-fine planning folder where the security pass handed back a blocking scope change (members have no refund path): vertical-slicing fires, owns the decision, works the ranked order instead of growing slice 1, and names what the choice needs repaired."
tags: [vertical-slicing, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory, and the planning docs for the fine-payment feature are in `docs/pay-fine/`. The security pass handed something back to slicing at the end of `docs/pay-fine/security-requirements-001.md`. Sort it out.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: skill-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:vertical-slicing"'
    min: 1
  - type: llm
    name: owns-the-decision
    focus: last_message
    weight: 1
    criteria: |
      The security pass found that members have no way to get a refund and handed the scope decision to slicing. Being handed the finding is being handed the call.

      PASS if the response states which resolution it chose and why. Asking the user to confirm a specific choice it has made is fine.

      FAIL if it lays the options out and asks the user to pick without choosing one itself.
  - type: llm
    name: does-not-grow-casually
    focus: last_message
    weight: 1
    criteria: |
      The ranked order for a scope change is: a new slice delivering the missing capability on its own; otherwise narrowing the current slice so the need stops applying; growing the current slice only as a last resort.

      PASS if it chooses a new slice for the refund path (ahead of slice 1, or one that must ship before slice 1 is released), or narrows slice 1 with a concrete reason the need stops applying, or chooses growth after rejecting both other options with a concrete reason each and saying slice 1 is now larger than what was cut.

      FAIL if it grows slice 1 without a concrete reason against each of the other two options, or presents growth as one neutral choice among equals.
  - type: llm
    name: leaves-the-what-to-requirements
    focus: last_message
    weight: 1
    criteria: |
      Nobody has asked the user what a member refund path should be. Whatever the scope decision, that WHAT belongs to a requirements pass with the user, and the documents other stages own (requirements, design, security criteria) are theirs to revise.

      PASS if the response sends the refund capability to a requirements pass before it is specified, and does not report having written it into the requirements doc, the design, or the security criteria itself. Saying which documents the choice invalidates and who revises them is the expected shape.

      A one-line provisional name or shape for the new slice, marked as waiting on that requirements pass, is fine, and so is a separate note of the scope decision.

      FAIL if it reports any of: adding the refund capability to the requirements doc, writing a thin path or acceptance criteria for it, or editing the design or the security criteria.
  - type: llm
    name: security-criteria-untouched
    focus:
      source: file
      path: docs/pay-fine/security-requirements-001.md
    weight: 1
    criteria: |
      This is the security pass's document. It ends with a section "Handed back to product-slicer — blocking" about members having no refund path.

      PASS if the document has no acceptance criteria about refunds.

      FAIL if it contains acceptance criteria about refunds or refund requests.
