schema_version: "1.0"
name: orchestrator-session-setup
description: "Step 0 of the orchestrator since 0.14.0: a session that is fenced by something other than the launcher (this harness fences its runs) is told so in one line and asked nothing: no audit-mode, audit-repository, extra-domain, install or restart question, no `kad --prepare` or `--relaunch` (both gone). The flow goes straight on to the target (given) and routes to problem-framing-doc for the new, empty planning folder. Before 0.14.0 this case expected the questions; the owner's decision of 2026-11-08 (handoff-slice2 P1) is that the launcher is the one way in and the session asks nothing it cannot act on."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. We're starting to plan a new feature for it: members can only pay their fines at the desk. Its planning documents go in `docs/pay-fine/`, which is new and empty so far. What's next?
  model: sonnet
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 2
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: checks-the-session
    tool: Bash
    input_match: 'SANDBOX_RUNTIME'
    min: 1
  - type: tool_used
    name: no-launcher-run-from-the-session
    tool: Bash
    input_match: 'bin/kad'
    min: 0
    max: 0
  - type: tool_used
    name: routes-to-problem-framing-doc
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:problem-framing-doc"'
    min: 1
  - type: llm
    name: asks-nothing-about-the-session
    focus: last_message
    weight: 1
    criteria: |
      The orchestrator's step 0, session setup, runs once per session before anything else. Since 0.14.0 it decides nothing and asks nothing: the launcher `bin/kad` is the one way a flow runs (it fences the session, turns audit mode on and approves the permission set once per project), a plain `claude` session is told the one command to type and stopped, and a session that is already fenced by something other than the launcher (this harness fences its runs) is told so in one line and the flow goes on to the target and the routing. The old questions (audit mode on or off, which audit repository, which extra domains, whether to install the sandbox runtime, whether to restart in the fence or continue here) and the old commands (`kad --prepare`, `kad --relaunch`) no longer exist.

      Here the target is given (`docs/pay-fine/`, new and empty), so the orchestrator routes to problem-framing-doc, which asks its own questions about the problem; the reply may end on one of those.

      PASS if the reply never puts a session-setup question to the owner (audit mode, audit repository, extra domains, installing the runtime, restarting or continuing), at most states in one line how the session runs (fenced without the launcher, audit on or off), and goes on to route to problem-framing-doc (its questions about the problem, or its document, may follow).

      FAIL if it asks any of the session-setup questions, tells the owner to restart or relaunch, runs or recommends `kad --prepare` or `kad --relaunch`, or stops after the session line without routing anywhere.
