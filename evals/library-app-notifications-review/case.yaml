schema_version: "1.0"
name: library-app-notifications-review
description: "Review of notifications/: three channels with no shared interface, a port parked on the implementer's side; trap for a one-implementation port over real I/O."
tags: [architecture-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`). Read whatever you need; don't change the code.

    Review the `notifications/` module for architecture issues. Read its ports, the adapters under `infra/` that implement them, and anything else you need.

    Save the review as `docs/reviews/library-app-notifications-review.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write]
runs: 3
graders:
  - type: file_exists
    name: review-written
    path: docs/reviews/library-app-notifications-review.md
  - type: regex
    name: leaves-the-code-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/reviews/library-app-notifications-review\.md")[^"]*"'
    match: not_contains
  - type: llm
    name: finds-missing-channel-abstraction
    focus:
      source: file
      path: docs/reviews/library-app-notifications-review.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `notifications/send-due-reminder.ts` chooses between `EmailReminder.deliver`, `SmsReminder.text` and `PostalReminder.queueLetter` with an if/else chain on `contact_pref_code`. Three concrete channels exist today with different method names and no shared interface.

      PASS if the review flags this as a missing abstraction with a real, already-present axis of change (three implementations now, not hypothetical) and proposes a reminder-channel interface with the choice made outside the use case (a map, or wiring).

      FAIL if missed, or described as fine / premature to abstract.
  - type: llm
    name: finds-port-on-implementer-side
    focus:
      source: file
      path: docs/reviews/library-app-notifications-review.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `notifications/sms-reminder.ts` imports the `SmsGateway` interface from `infra/sms/sms-gateway.port.ts`: the interface lives next to its implementation in `infra/` rather than with the caller in `notifications/`.

      PASS if the review flags the interface being owned by the wrong side and proposes moving it into `notifications/` (with the adapter implementing it from there).

      FAIL if missed.
  - type: llm
    name: no-false-alarm-single-impl-mailer-port
    focus:
      source: file
      path: docs/reviews/library-app-notifications-review.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      `notifications/mailer.port.ts` declares a `Mailer` interface with exactly one implementation (`infra/email/sendgrid-mailer.ts`). It isolates a real external email service; per this persona's rules an interface required by the Dependency Rule is not premature just because it has one implementation.

      PASS if the review does not flag `Mailer` as premature abstraction / over-engineering or recommend removing it. Not mentioning it passes.

      FAIL if it is reported as premature or unnecessary.
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?architecture-review"'
    min: 1
