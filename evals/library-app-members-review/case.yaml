schema_version: "1.0"
name: library-app-members-review
description: "Review of members/: a port file contaminated by a driver type (backward check), a domain type shaped by the table with no import; trap for a low-risk date library."
tags: [architecture-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`). Read whatever you need; don't change the code.

    Review the `members/` module for architecture issues. Read its port, the Postgres adapter under `infra/postgres/` that implements it, and anything else you need.

    Save the review as `docs/reviews/library-app-members-review.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write]
runs: 3
graders:
  - type: file_exists
    name: review-written
    path: docs/reviews/library-app-members-review.md
  - type: regex
    name: leaves-the-code-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/reviews/library-app-members-review\.md")[^"]*"'
    match: not_contains
  - type: llm
    name: locates-driver-type-in-port-file
    focus:
      source: file
      path: docs/reviews/library-app-members-review.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `members/member-directory.port.ts` imports `PgClientOptions` from `pg-orm` and exposes `readonly connection: PgClientOptions` on the `MemberDirectory` interface. `register-member.ts` and `suspend-member.ts` import only that interface and look clean, yet every importer now depends on the Postgres driver's types.

      PASS if the review locates the problem in the port/types file itself (not only in the use cases that import it), explains that importers inherit the dependency through the interface, and recommends removing `connection` from the interface (connection configuration belongs to the Postgres adapter or the wiring).

      FAIL if missed, or if the finding is attributed only to the use cases.
  - type: llm
    name: finds-table-shaped-domain-type
    focus:
      source: file
      path: docs/reviews/library-app-members-review.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `members/member.ts` has no imports, but its `Member` type is shaped by the database table: persistence bookkeeping fields (`member_row_id`, `row_version`, `created_at_utc`, `updated_at_utc`) and single-letter storage codes (`status_code: 'A' | 'S' | 'L'`, `contact_pref_code: 'E' | 'S' | 'P'`) that the business logic then decodes.

      PASS if the review flags the domain model mirroring the database schema (any wording: design shaped by persistence, leaky storage representation, DB codes in the domain) and proposes domain-named fields/enums with the mapping done in the Postgres adapter.

      FAIL if this is not noticed.
  - type: llm
    name: no-false-alarm-date-library
    focus:
      source: file
      path: docs/reviews/library-app-members-review.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      `members/register-member.ts` imports `addDays` from `date-fns-lite`, a date utility library. Per this persona's Invasive Species tiers, a date library is lower lock-in than an ORM/SDK: worth a note at most, not a blocking finding.

      PASS if the review does not treat this import as a must-fix or High-severity violation requiring an adapter. Not mentioning it, or a Low note, both pass.

      FAIL if it is reported as a blocking Invasive Species / Dependency Rule violation.
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?architecture-review"'
    min: 1
