schema_version: "1.0"
name: architecture-design-scope-consequence
description: "A design consequence that changes a confirmed requirement (design §11 case 12, last part): the cancel-hold slice carries a criterion that a cancelled hold stays gone across a restart of the service, while the Active requirements confirm out keeping holds across restarts and forbid a new table or migration. architecture-design says so and hands it back to product-manager:requirements-refinement before approving anything, instead of designing persistence around it or presenting it as the one catch inside a design approval."
tags: [architecture-design, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Invoke the skill `kad-dev-team:architecture-design` first. The library-lending app is in your current working directory. Design slice 001 of the hold-cancelling feature: the slice is `docs/cancel-hold/slice-001.md`, the requirements `docs/cancel-hold/requirements-001.md`, the story `docs/cancel-hold/user-story-001.md`, the problem `docs/cancel-hold/problem.md`. Save the design as `docs/cancel-hold/design-001.md`. For the design's own decisions go with your recommendations; I'll read the result. Any question you have for me, ask in plain text.
  model: sonnet
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: skill-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:architecture-design"'
    min: 1
  - type: regex
    name: slice-and-requirements-untouched
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"[^"]*docs/cancel-hold/(?:slice-001|requirements-001)\.md"'
    match: not_contains
  - type: llm
    name: hands-back-to-the-requirements-owner
    focus: last_message
    weight: 1
    criteria: |
      The slice's third acceptance criterion needs the other members' holds to survive a service restart; the Active requirements confirm out keeping holds across a restart and forbid a new table or migration. A design cannot meet both. The rule for the architect: say so, and present it as a hand-back to the stage that owns the document being changed (product-manager or requirements-refinement for the requirement, product-slicer for the criterion), the design decision that depends on it waiting. Saying which way it leans ("I'd drop the restart clause") is allowed and is NOT resolving it: resolving it would be editing the criterion or the requirement, or designing persistence, a table or a migration. Asking the owner to settle it, or to take it to that stage, is the hand-back in this session, where no other persona can be reached.

      PASS if the reply names the conflict between the restart criterion and the confirmed-out line (or the no-new-table constraint), says it is not the design's to settle (a requirements or slice question, for the owner, requirements-refinement, product-manager or product-slicer), and leaves the restart part undecided in the design, whatever recommendation it offers.

      FAIL only if the reply does not name the conflict, or says the architect settled it (the criterion reworded or dropped by the architect, persistence designed in, a table or migration added), or treats the criterion as satisfied by the in-memory queue.
  - type: llm
    name: does-not-approve-around-it
    focus: last_message
    weight: 1
    criteria: |
      While the restart conflict is handed back, nothing is approved around it. The skill may write no design at all (it stops at the first decision, and since 0.12.0 the usual run writes nothing), or it may leave a draft whose independent parts (the cancel use case, the port's removal operation, the in-memory adapter, the outcome shapes) are designed while the restart question stays open; what it may not do is settle persistence across a restart either way.

      PASS if the reply reports that no design was written, or that a draft was saved with the restart conflict recorded as open (a hand-back, a question for the owner, who settles it) and no decision on persistence across a restart. Decisions on the independent parts, and a draft calling itself a design, do not count against it.

      FAIL if the reply presents persistence across a restart as decided (a persistent queue designed, a table or migration, the criterion declared satisfied by the in-memory queue), or says a design was saved without the conflict in it.
