schema_version: "1.0"
name: accessibility-review-payfine-subtle
description: "Pay-a-fine card-error mockup built on the design system, with four defects found only by following the cascade or the state (A5-A8) and three correct look-alikes (AT4-AT6): a component rule that removes the Pay button's focus ring, a link that fails contrast on hover, an error tied to a misspelled id, and a name field whose only label is display:none."
tags: [accessibility-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. The planning docs for the pay-a-fine feature are in `docs/pay-fine/`. Screen design has produced the mockup for slice 1's card-error state: `docs/pay-fine/visual-ux/pay-fine-card-error.html`. Check it for accessibility and fill in the slice's accessibility placeholder. Save the review as `docs/pay-fine/accessibility-review-001.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: skill-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:accessibility-review"'
    min: 1
  - type: file_exists
    name: review-written
    path: docs/pay-fine/accessibility-review-001.md
  - type: regex
    name: leaves-the-mockup-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"[^"]*\.html"'
    match: not_contains
  - type: llm
    name: finds-pay-button-focus-removed
    focus:
      source: file
      path: docs/pay-fine/accessibility-review-001.md
    weight: 1
    criteria: |
      Judge substance only. The page declares a global `:focus-visible` outline, but a later rule `.btn-primary:focus { outline: none; }` is more specific and removes it from the Pay button, with nothing in its place. A keyboard user can't see when the Pay button has focus.

      PASS if the review flags that the Pay button has no visible focus indicator because of that rule.

      FAIL if it is missed, or the review says every control gets the global focus ring.
  - type: llm
    name: finds-hover-contrast
    focus:
      source: file
      path: docs/pay-fine/accessibility-review-001.md
    weight: 1
    criteria: |
      Judge substance only. "Back to my account" is `--brand` (#1F5F5B) normally, but `.actions a:hover` changes it to `--link-hover` (#4F8F8A), about 3.7:1 on the white panel, below the 4.5:1 its 16px text needs.

      PASS if the review flags the link's hover colour as failing contrast.

      FAIL if it is missed or the hover state is called passing.
  - type: llm
    name: finds-broken-error-link
    focus:
      source: file
      path: docs/pay-fine/accessibility-review-001.md
    weight: 1
    criteria: |
      Judge substance only. The card number input has `aria-describedby="card-eror"`, but the error paragraph's id is `card-error`. The reference points at nothing, so a screen reader announces the field as invalid without the message saying what's wrong.

      PASS if the review flags that the error message isn't associated with the field because the id reference doesn't match.

      FAIL if it is missed, or the error is called correctly associated.
  - type: llm
    name: finds-no-visible-name-label
    focus:
      source: file
      path: docs/pay-fine/accessibility-review-001.md
    weight: 1
    criteria: |
      Judge substance only. The "Name on card" label has class `visually-hidden`, which this page defines as `display: none`, so sighted users see only the placeholder, which disappears once they type. (The page's `.sr-only` class is the correct pattern; `.visually-hidden` is not.)

      PASS if the review flags that the name field has no visible label, or that its label is hidden with `display: none`, and proposes a visible label or the `.sr-only` pattern at least.

      FAIL if it is missed, or the field is called correctly labelled.
  - type: llm
    name: no-false-alarm-input-focus-ring
    focus:
      source: file
      path: docs/pay-fine/accessibility-review-001.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm. The text inputs replace the focus outline with `outline: 3px solid transparent; box-shadow: 0 0 0 3px #1F5F5B`, a 3px ring at over 7:1 on white that also survives forced-colours mode through the transparent outline.

      PASS if the review does not report the text inputs as lacking a visible focus indicator.

      FAIL if it does.

      An empty or findings-free review does not pass this check: the review must also report at least one real finding of its own (a problem it asks to be fixed, at any severity). FAIL if it reports none.
  - type: llm
    name: no-false-alarm-card-number-label
    focus:
      source: file
      path: docs/pay-fine/accessibility-review-001.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm. The card number field has a visible `<label for="card">Card number</label>` with an extra hint in a `.sr-only` span (clip pattern, still read by screen readers).

      PASS if the review does not report the card number field as unlabelled or its hint as hidden from assistive technology. Pointing out the broken `aria-describedby` on the same field is a different, correct finding.

      FAIL if it reports the card number label or hint as hidden or missing.

      An empty or findings-free review does not pass this check: the review must also report at least one real finding of its own (a problem it asks to be fixed, at any severity). FAIL if it reports none.
  - type: llm
    name: no-false-alarm-fine-choice
    focus:
      source: file
      path: docs/pay-fine/accessibility-review-001.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm. Choosing a fine is a native radio group inside a `fieldset` with a `legend`, each card a `<label>`, and the chosen card shows a "Selected" text as well as a thicker border.

      PASS if the review does not report the fine choice as unreachable by keyboard, unlabelled, or shown by colour alone.

      FAIL if it does.

      An empty or findings-free review does not pass this check: the review must also report at least one real finding of its own (a problem it asks to be fixed, at any severity). FAIL if it reports none.
  - type: llm
    name: says-it-read-the-markup
    focus:
      source: file
      path: docs/pay-fine/accessibility-review-001.md
    weight: 1
    criteria: |
      This session has no browser, so the mockup could only be read as markup and CSS.

      PASS if the review says the check was a read of the markup without loading it in a browser, and does not claim to have tabbed through the page, rendered it or measured it in a browser.

      FAIL if it claims a live or browser-driven check, or doesn't say how the check was done.
  - type: llm
    name: criteria-split-now-and-later
    focus:
      source: file
      path: docs/pay-fine/accessibility-review-001.md
    weight: 1
    criteria: |
      PASS if the review contains accessibility acceptance criteria in Given/When/Then form that cover at least a visible focus indicator on the Pay button (and every other control) and the card error message being associated with its field so a screen reader announces it, and keeps criteria checkable against this mockup now apart from those that can only be checked once real code exists (for example focus moving to the error after a real submit, an announcement actually firing).

      FAIL if there are no Given/When/Then criteria, or nothing distinguishes checkable-now from needs-real-code.
  - type: regex
    name: slice-placeholder-filled
    # A judge until E5. The pattern is the fixture's slice-001.md with the
    # placeholder line open to a pointer or the criteria, every other line as
    # it was; tools/fixture_patterns.py writes it and --check holds it. The
    # judge failed eight slices that were exactly that.
    target:
      source: file
      path: docs/pay-fine/slice-001.md
    pattern: '^\s*#\s+Slice\s+1:\s+A\s+member\s+pays\s+an\s+outstanding\s+fine\s+from\s+the\s+portal\s+##\s+Thin\s+path\s+A\s+signed-in\s+member\s+opens\s+the\s+portal,\s+sees\s+their\s+outstanding\s+fines,\s+picks\s+one\s+and\s+pays\s+it\s+by\s+card\.\s+The\s+fine\s+then\s+shows\s+as\s+paid\.\s+##\s+Acceptance\s+criteria\s+-\s+Given\s+a\s+signed-in\s+member\s+with\s+outstanding\s+fines,\s+when\s+they\s+open\s+their\s+fines\s+in\s+the\s+portal,\s+they\s+see\s+each\s+one\s+and\s+its\s+amount\.\s+-\s+Given\s+the\s+member\s+pays\s+a\s+fine\s+and\s+the\s+payment\s+succeeds,\s+the\s+fine\s+shows\s+as\s+paid\.\s+-\s+Given\s+the\s+payment\s+is\s+declined,\s+the\s+fine\s+stays\s+outstanding\s+and\s+the\s+member\s+is\s+told\.\s+-\s+Security:\s+given\s+a\s+signed-in\s+member,\s+when\s+they\s+open\s+their\s+fines\s+or\s+pay\s+one,\s+only\s+their\s+own\s+fines\s+are\s+shown\s+or\s+payable;\s+a\s+fine\s+belonging\s+to\s+another\s+member\s+is\s+refused\.\s+-\s+Security:\s+given\s+the\s+member\s+enters\s+their\s+card,\s+the\s+card\s+number\s+goes\s+straight\s+to\s+the\s+payment\s+provider''s\s+field\s+and\s+never\s+reaches\s+the\s+library''s\s+server\s+or\s+its\s+logs\.\s+-\s+Reliability:\s+given\s+the\s+member\s+submits\s+payment\s+for\s+the\s+same\s+fine\s+twice\s+\(a\s+double\s+click,\s+a\s+retry\s+after\s+a\s+slow\s+response\),\s+the\s+card\s+is\s+charged\s+at\s+most\s+once\.\s+(?![\s\S]*ACCESSIBILITY — placeholder)[-*] (?=[\s\S]{0,400}?(?:[Aa]ccessib|\.md\b))\S[\s\S]{1,6000}?\s*$'
  - type: regex
    name: writes-only-review-and-slice
    target: trace
    # The two files this case may write, as the exact relative path or the
    # sandbox's absolute one (.../cwd/docs/...); a path that merely ends in
    # one of them (backup/docs/pay-fine/slice-001.md) is still a stray write.
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?!(?:[^"]*/cwd/)?docs/pay-fine/(?:accessibility-review-001|slice-001)\.md")[^"]*"'
    match: not_contains
