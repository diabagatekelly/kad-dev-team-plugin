<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading room: design system sample</title>
<style>
  :root {
    --paper: #FAF7F2; --surface: #FFFFFF; --ink: #1F2A33; --muted: #9AA3AA;
    --border: #8A8178; --brand: #1F5F5B; --brand-hover: #174845;
    --success: #2E6B3A; --success-bg: #E6F2E8; --danger: #A3302A; --danger-bg: #FBEAE8;
    --radius-sm: 6px; --radius-md: 8px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/24px system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  header a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; color: var(--brand); }
  header .home { font-weight: 700; color: var(--ink); text-decoration: none; }
  nav a[aria-current="page"] { font-weight: 600; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 28px; line-height: 36px; margin: 0 0 24px; }
  h2 { font-size: 20px; line-height: 28px; margin: 32px 0 12px; }
  .muted { color: var(--muted); font-size: 14px; line-height: 20px; }
  .notice { display: flex; gap: 12px; padding: 16px; border-left: 4px solid; border-radius: var(--radius-sm); }
  .notice h2 { margin: 0 0 4px; font-size: 16px; line-height: 24px; }
  .notice p { margin: 0; }
  .notice-success { background: var(--success-bg); border-color: var(--success); }
  .notice-error { background: var(--danger-bg); border-color: var(--danger); }
  fieldset { border: 0; padding: 0; margin: 0; }
  legend { font-weight: 600; margin-bottom: 8px; }
  .card { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 16px; margin-bottom: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; }
  .card:has(input:checked) { border: 2px solid var(--brand); padding: 15px; }
  .card .selected { display: none; font-size: 14px; font-weight: 600; color: var(--brand); }
  .card:has(input:checked) .selected { display: inline; }
  .card input { width: 20px; height: 20px; accent-color: var(--brand); }
  .card .what { flex: 1; }
  .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
  label.field { display: block; font-weight: 600; margin: 16px 0 4px; }
  input[type="text"] { width: 100%; min-height: 44px; padding: 0 12px; font: inherit; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); }
  .btn { min-height: 44px; padding: 0 20px; font: 600 16px/24px system-ui, sans-serif; border-radius: var(--radius-sm); cursor: pointer; transition: background-color 120ms ease-out; }
  .btn-primary { background: var(--brand); color: #fff; border: 0; }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-secondary { background: var(--surface); color: var(--brand); border: 1px solid var(--brand); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
</style>
</head>
<body>
  <header>
    <a class="home" href="#">Riverside Library</a>
    <nav aria-label="Your account"><a href="#">My loans</a> <a href="#" aria-current="page">My fines</a></nav>
  </header>
  <main>
    <h1>Page heading</h1>
    <div class="notice notice-success" role="status">
      <svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2E6B3A" stroke-width="2"><path d="M5 12l5 5 9-10"/></svg>
      <div><h2>Notice heading</h2><p>One sentence saying what happens next.</p></div>
    </div>
    <h2>Section heading</h2>
    <p class="muted">Secondary text, 14/20 on paper.</p>
    <fieldset>
      <legend>Choose one</legend>
      <label class="card"><input type="radio" name="pick" checked><span class="what">Choosable card</span><span class="selected">Selected</span><span class="amount">$3.00</span></label>
      <label class="card"><input type="radio" name="pick"><span class="what">Another card</span><span class="selected">Selected</span><span class="amount">$1.25</span></label>
    </fieldset>
    <label class="field" for="sample">Field label</label>
    <input type="text" id="sample" aria-describedby="sample-help">
    <p class="muted" id="sample-help">Help text below the field.</p>
    <div class="row">
      <button class="btn btn-primary" type="button">Primary action</button>
      <button class="btn btn-secondary" type="button">Secondary action</button>
    </div>
  </main>
</body>
</html>
