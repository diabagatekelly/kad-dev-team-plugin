schema_version: "1.0"
name: orchestrator-delivery-foreground
description: "The chunk loop's E step (design §11 case 10): resumed after D with two standing Mediums and three Lows, a local bare origin and a recording stand-in for the GitHub CLI at tools/gh. The orchestrator runs delivery inline: the branch is pushed, the pull request opened with pr-writeup's body, one issue filed per standing Medium and none for a Low, the body edited to link them, the cost script run, the E line written, all in the foreground and in the turn that reports. Since 0.17.0 (TODO.md's C6): the E line is written before the last push, so the log the remote holds has it (the scaffold's receive hook copies the pushed branch's log to `tools/pushed-log.txt`), and the tree is checked clean before the report."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory, a git repository on the branch `slice-001-cancel-hold`; the planning documents are in `docs/cancel-hold/`. The build of slice 001 was handed off at the end of the previous session: `docs/cancel-hold/implementation/handoff-slice-001.md` says where it stopped. Keep going. On this machine the GitHub CLI is the wrapper at `tools/gh` (call it by that path, or put `tools/` on the PATH for the command); the remote is already set up.
  model: sonnet
  max_turns: 70
  timeout_seconds: 2400
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: delivery-skill-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:delivery"'
    min: 1
  - type: tool_used
    name: pr-writeup-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:pr-writeup"'
    min: 1
  - type: tool_used
    name: cost-script-run
    tool: Bash
    input_match: 'cost_by_role\.py[^\n]*--sidecar'
    min: 1
  - type: regex
    name: nothing-in-the-background
    target: trace
    pattern: '"run_in_background"\s*:\s*true'
    match: not_contains
  - type: regex
    name: e-line-written
    target:
      source: file
      path: docs/cancel-hold/orchestrator-log.md
    pattern: '- \*\*E\. Delivery:\*\*[^\n]*PR[^\n]*7'
  - type: regex
    name: pull-request-then-issues-then-body-edit
    target:
      source: file
      path: tools/gh-calls.log
    pattern: 'pr create[\s\S]*issue create[\s\S]*issue create[\s\S]*pr edit'
  - type: regex
    name: one-issue-per-standing-medium-none-for-a-low
    # A judge until E5: one `pr create`, exactly two `issue create` lines, one
    # naming the optional reason and another the card-number mask, none carrying a
    # Low's words, a `pr edit` after them. A title paraphrased past those
    # words fails; none of 61 passed runs was.
    target:
      source: file
      path: tools/gh-calls.log
    pattern: '^(?=[\s\S]*(?:^|\n)pr create\b)(?!(?:[\s\S]*?(?:^|\n)pr create\b){2})(?=(?:[\s\S]*?(?:^|\n)issue create\b){2})(?!(?:[\s\S]*?(?:^|\n)issue create\b){3})(?=[\s\S]*(?:(?:^|\n)issue create\b[^\n]*reason[^\n]*\n(?:[^\n]*\n)*?issue create\b[^\n]*(?:slice\(-4\)|card[- ]number|\bmask)|(?:^|\n)issue create\b[^\n]*(?:slice\(-4\)|card[- ]number|\bmask)[^\n]*\n(?:[^\n]*\n)*?issue create\b[^\n]*reason))(?![\s\S]*(?:^|\n)issue create\b[^\n]*(?:queueWith|fixed date|same date|fixed string|not cancelled|heading))(?=[\s\S]*(?:^|\n)issue create\b[\s\S]*\npr edit\b)'
    flags: i
  - type: llm
    name: reports-the-delivery-in-the-same-turn
    focus: last_message
    weight: 1
    criteria: |
      The E step ends in the same turn that finishes its last action: the report names the pull request and issue numbers, the Lows left in the body, the standing findings, the external-review result (no comments arrived from the stand-in), the cost line (`not measured`, or a figure, since this session's own transcript is the one the sidecar and `--session` name) and the audit field (`off` or `not configured`: audit mode is not on in this session).

      PASS if the reply reports pull request #7 and two issue numbers, says the Lows stayed in the body, and gives the cost outcome (`not measured` with a reason, or a figure); the audit field is `off` in this session and may go unmentioned in the reply; a note that the external reviewer left nothing passes, and so does a note that the stand-in's `pr view` could not show the edited body.

      FAIL if it asks whether to push or open the pull request, reports the issues as filed in the background or still to be linked, or omits the pull request number.
  # 0.15.0 (TODO.md B5): the slice's deferrals are listed once, by the
  # script, and its section is a part of the pull request's body.
  - type: tool_used
    name: deferrals-listed-by-the-script
    tool: Bash
    input_match: 'deferrals\.py[^\n]*--slice-file[^\n]*slice-001\.md'
    min: 1
  - type: tool_used
    name: body-carries-the-deferrals-section
    # The command that builds the body splices the script's file into it
    # (`cat "$TMPDIR/kad-pr-deferred.md" >> body`, between the Standing and
    # the Known Lows parts), which is what all three first runs did, or
    # writes the section's heading itself. A first form looked for the
    # heading only and failed the three bodies that carried the file.
    tool: Bash
    input_match: '(?=[\s\S]*deferred[\w.-]*\.md)(?=[\s\S]*(?:Known Lows|What was built))|Deferred with this slice'
    min: 1
  - type: regex
    name: review-history-asked-before-any-wait
    # F6 (0.15.1): delivery waits for an external review only where a bot
    # has reviewed before, and asks the repository's own history first.
    # The stand-in answers every `gh api` list with `[]`: no bot.
    target:
      source: file
      path: tools/gh-calls.log
    pattern: '(?:^|\n)api [^\n]*(?:pulls|issues)/comments'
  - type: tool_used
    name: no-wait-for-a-bot-that-never-reviewed
    tool: Bash
    input_match: '\bsleep\s+(?:[6-9]\d|\d{3,})\b'
    min: 0
    max: 0
  # 0.17.0 (TODO.md C6): the log's last lines are in the last pushed
  # commit. `tools/pushed-log.txt` is the log as the remote's slice
  # branch holds it after the last push (written by the origin's receive
  # hook; `tools/` is not in the tree).
  - type: regex
    name: e-line-in-the-pushed-log
    target:
      source: file
      path: tools/pushed-log.txt
    pattern: '- \*\*E\. Delivery:\*\*[^\n]*PR[^\n]*7'
  - type: tool_used
    name: tree-checked-clean-before-the-report
    tool: Bash
    input_match: 'git status\b[^\n"]*(?:--short|--porcelain|-s\b)'
    min: 1
