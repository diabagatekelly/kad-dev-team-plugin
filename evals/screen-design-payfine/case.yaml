schema_version: "1.0"
name: screen-design-payfine
description: "Pay-a-fine slice with a binding design system in visual-ux/: screen-design fires (design-system doesn't), asks nothing the docs answer, writes one HTML mockup per state the criteria name, reuses the system's patterns, adds nothing out of scope, claims no screenshot and carries the accessibility placeholder forward."
tags: [screen-design, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. The planning docs for the pay-a-fine feature are in `docs/pay-fine/`, and the project's design system is in `docs/pay-fine/visual-ux/`. Design the screen for slice 1 (`docs/pay-fine/slice-001.md`), and save the screen design as `docs/pay-fine/visual-ux/screen-design-001.md`.
  model: sonnet
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  # E7 (TODO.md, decision 8, 2026-11-15): cut as judges that passed three
  # runs of three with and without the plugin in E6: `copy-rules`. What they
  # graded is still in the fixture. No planted-problem judge is kept beside
  # the graders that differed: this case plants none.
  - type: tool_used
    name: skill-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:screen-design"'
    min: 1
  - type: tool_used
    name: does-not-fire-design-system
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?design-system"'
    min: 0
    max: 0
    arm: both
  - type: file_exists
    name: screen-design-written
    path: docs/pay-fine/visual-ux/screen-design-001.md
  - type: regex
    name: three-mockups-in-visual-ux
    target: trace
    pattern: '(?:"name":"Write","input":\{[^{}]*"(?:file_path|path)":"[^"]*visual-ux/[^"]*\.html"[\s\S]*){3}'
  - type: regex
    name: each-mockup-styled
    target: trace
    # Each of the three mockups written to visual-ux/ either carries the
    # brand value itself or links a stylesheet (`<link rel="stylesheet"`),
    # the shared-.css form one run used; the grader above checks the
    # value is in some file under visual-ux/, this one that every mockup
    # is styled from it rather than one of them.
    pattern: '(?:"name":"Write","input":\{(?:"(?:file_path|path)":"[^"]*visual-ux/[^"]*\.html","content":"(?:[^"\\]|\\.)*(?:#1[Ff]5[Ff]5[Bb]|<link(?:[^"\\]|\\.)*?stylesheet)|"content":"(?:[^"\\]|\\.)*(?:#1[Ff]5[Ff]5[Bb]|<link(?:[^"\\]|\\.)*?stylesheet)(?:[^"\\]|\\.)*","(?:file_path|path)":"[^"]*visual-ux/[^"]*\.html")[\s\S]*?){3}'
  - type: llm
    name: one-mockup-per-state
    focus:
      source: file
      path: docs/pay-fine/visual-ux/screen-design-001.md
    weight: 1
    criteria: |
      The slice's criteria name three states a member sees: their outstanding fines with amounts, a fine shown as paid after a successful payment, and a declined payment with the fine still outstanding.

      PASS if each of the three has its own HTML mockup file in `visual-ux/` referenced from the document. The outstanding-fines state may be the screen's default view, with the card form on the same page (a "choose and pay" mockup counts as it). Extra mockups (for example a payment in progress, or an empty state) are fine.

      FAIL if any of the three has no mockup of its own, or two of them share one file with the difference only described in prose.
  - type: llm
    name: reuses-the-system
    focus:
      source: file
      path: docs/pay-fine/visual-ux/screen-design-001.md
    weight: 1
    criteria: |
      The design system declares a page shell, Button (with a busy state), choosable Card (a radio group with a visible "Selected" label), Form field, Notice (success `role="status"`, error `role="alert"`) and Amount.

      PASS if the document says which of these patterns each state uses, uses the Notice pattern for the declined and paid messages, and either needs nothing new or lists what it needs under a "new patterns" heading for the design system to adopt. Saying nothing new is needed and then, under that heading, offering small additions the system may want to absorb (a non-choosable card for a paid row, styling notes for a provider-hosted field) is the second form, not a contradiction: what matters is that anything beyond the declared patterns is named there.

      FAIL if it composes the states from treatments the system doesn't have without flagging them as new, or changes a declared token or pattern for this screen.
  - type: llm
    name: nothing-out-of-scope
    focus:
      source: file
      path: docs/pay-fine/visual-ux/screen-design-001.md
    weight: 1
    criteria: |
      The requirements put paying several fines in one payment and saved cards out of scope, and nothing in the slice asks for search, filtering, sorting, payment history or receipts.

      PASS if the design adds none of these. Mentioning one as out of scope or as an open question is fine. Showing the fine that was just paid as paid (a "Paid" tag, or a paid group on the same page) is the slice's own criterion, not payment history; payment history means a record of earlier payments (dates, amounts, a statement) beyond the fine paid in this flow.

      FAIL if any of them is designed in (for example a "pay all" button, a "save this card" checkbox, a filter, or a receipt download).
  - type: llm
    name: placeholder-carried-forward
    focus:
      source: file
      path: docs/pay-fine/visual-ux/screen-design-001.md
    weight: 1
    criteria: |
      The slice still has an unfilled accessibility placeholder for `accessibility-engineer`.

      PASS if the document's open questions (or equivalent section) carry it forward as still open, with accessibility-engineer (or its accessibility review) as the next step, and the document does not claim the screen has been verified accessible or WCAG-conformant.

      FAIL if the placeholder isn't mentioned as open, or the document claims verified conformance.
  - type: llm
    name: no-screenshot-claimed
    focus:
      source: file
      path: docs/pay-fine/visual-ux/screen-design-001.md
    weight: 1
    criteria: |
      This session has no browser or screenshot tool, so the mockups can be written but not viewed.

      PASS if the document does not reference a screenshot as if one was saved, and does not claim the mockups were opened or looked at in a browser. Saying they couldn't be viewed, or saying nothing about viewing, is fine.

      FAIL if it references a screenshot file as existing, or claims the mockups were viewed.
  - type: llm
    name: asks-nothing-the-docs-answer
    focus: last_message
    weight: 1
    criteria: |
      The slice names every state and the design system covers every pattern the screen needs, so nothing about states, density or which interactions to include is left to ask.

      PASS if the response delivers the design without asking the user about states, density or interactions. A question about something genuinely unresolved (for example what a member with no outstanding fines should see) is fine if the design is delivered anyway.

      FAIL if it stops to ask about something the slice or design system already answers.
  - type: regex
    name: mockups-carry-the-system-brand-token
    target: trace
    # The mockups written to visual-ux/ must carry the design system's brand
    # value (#1F5F5B, `--brand`) in markup of their own: the skill says
    # mockups are styled with the system's actual token values, and
    # reuses-the-system otherwise judges that from prose alone. One run put
    # every rule in a shared visual-ux/*.css the mockups link, which is the
    # same thing, so one Write of an .html or .css under visual-ux/ holding
    # the value is enough; three-mockups-in-visual-ux counts the files. The
    # HTML is a JSON string in the trace, so its content is matched as one.
    pattern: '"name":"Write","input":\{(?:"(?:file_path|path)":"[^"]*visual-ux/[^"]*\.(?:html|css)","content":"(?:[^"\\]|\\.)*#1[Ff]5[Ff]5[Bb]|"content":"(?:[^"\\]|\\.)*#1[Ff]5[Ff]5[Bb](?:[^"\\]|\\.)*","(?:file_path|path)":"[^"]*visual-ux/[^"]*\.(?:html|css)")'
  # 0.16.0 (C1): the screen design lists the states the slice changes,
  # each by its mockup's file stem; the screen-change check reads the list
  # at delivery. All three states of this slice are new.
  - type: regex
    name: changed-states-section-lists-three-states
    target:
      source: file
      path: docs/pay-fine/visual-ux/screen-design-001.md
    pattern: '(?:^|\n)#{2,3}\s+States this slice changes\s*\n(?:(?!\n#{1,3}\s)[\s\S])*?(?:[-*]\s+`?[a-z0-9][a-z0-9._-]*`?\s*(?::|—|–|-)\s*\**(?:new|changed)\b(?:(?!\n#{1,3}\s)[\s\S])*?){3}'
  - type: regex
    name: a-listed-state-is-named-as-its-mockup-file
    # A name on the list is the stem of a mockup the document references
    # (`visual-ux/<name>.html`). One is enough here; the readiness gate's
    # check holds every line (tools/readiness_check_test.py).
    target:
      source: file
      path: docs/pay-fine/visual-ux/screen-design-001.md
    pattern: '(?:^|[/`(\s])([a-z0-9][a-z0-9._-]*)\.html[\s\S]*\n#{2,3}\s+States this slice changes\s*\n(?:(?!\n#{1,3}\s)[\s\S])*?[-*]\s+`?\1`?\s*(?::|—|–|-)\s*\**(?:new|changed)\b|\n#{2,3}\s+States this slice changes\s*\n(?:(?!\n#{1,3}\s)[\s\S])*?[-*]\s+`?([a-z0-9][a-z0-9._-]*)`?\s*(?::|—|–|-)\s*\**(?:new|changed)\b[\s\S]*(?:^|[/`(\s])\2\.html'
