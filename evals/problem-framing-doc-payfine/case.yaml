schema_version: "1.0"
name: problem-framing-doc-payfine
description: "No planning docs yet: asked to capture a problem the user describes (with a solution idea mixed in) as docs/pay-fine/problem.md, problem-framing-doc fires and writes a problem doc with constraints and open questions, and no solution."
tags: [problem-framing-doc, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. Something keeps coming up at the desk and I'd like to do something about it eventually.

    Members can only pay their fines in person, at one of our two desks. We have about 3,000 members at one branch. The nightly job assesses the fines, and members can already see and renew their loans in the portal, but they still have to come in just to pay — and the desk staff spend part of every shift taking small card payments. We take cards through Stripe already and I don't want to change that. I'm the only developer on this. I guess we'd just add a pay button to the portal?

    Before we do anything about it, capture the problem and save it as `docs/pay-fine/problem.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: skill-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:problem-framing-doc"'
    min: 1
  - type: file_exists
    name: problem-doc-written
    path: docs/pay-fine/problem.md
  - type: llm
    name: no-solution-designed
    focus:
      source: file
      path: docs/pay-fine/problem.md
    weight: 1
    criteria: |
      A problem framing doc captures the problem before anything is decided about how to solve it. The user floated "add a pay button to the portal".

      PASS if the document describes the problem (members can only pay at the desk; the cost to members and staff) and does not present a solution as decided: no pay button, portal page, route, endpoint, module or data model stated as the plan. Recording the user's idea as an open question, or a constraint the user stated (Stripe stays), is fine.

      FAIL if the document contains a design or presents the pay-button idea as the way forward.
  - type: llm
    name: constraints-as-constraints
    focus:
      source: file
      path: docs/pay-fine/problem.md
    weight: 1
    criteria: |
      The user stated two hard limits: card payments keep going through Stripe, and one developer maintains the service.

      PASS if both appear as constraints on the solution space.

      Further constraints are fine if they are limits on the solution, not designs.

      FAIL if either is missing, or a constraint names a design the user did not choose (a particular route, page, module, library or architecture).
  - type: llm
    name: assumptions-stay-open
    focus:
      source: file
      path: docs/pay-fine/problem.md
    weight: 1
    criteria: |
      A constraint is something the user stated or the situation makes binding; a limit the writer is only assuming belongs in the open questions.

      PASS if no item appears both as a settled constraint and, elsewhere in the document, as an open question (for example "desk payment must keep working" as a constraint while an open question asks whether desk payment stays available).

      FAIL if the document contradicts itself that way.
