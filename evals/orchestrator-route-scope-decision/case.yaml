schema_version: "1.0"
name: orchestrator-route-scope-decision
description: "Routing, one row of the orchestrator's table: a problem doc and nothing else: routes to docs-writer's scope-map, which decides whether a map is needed."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. We're planning a new feature for it, and the planning documents so far are in `docs/pay-fine/`. What's next?
  model: sonnet
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 2
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: routes-to-scope-map
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:scope-map"'
    min: 1
  - type: tool_used
    name: not-vertical-slicing
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:vertical-slicing"'
    min: 0
    max: 0
  - type: file_exists
    name: log-written
    path: docs/pay-fine/orchestrator-log.md
  - type: llm
    name: log-names-row-and-artifact
    focus:
      source: file
      path: docs/pay-fine/orchestrator-log.md
    weight: 1
    criteria: |
      The orchestrator appends one entry to `orchestrator-log.md` in the target directory each time it routes, before invoking the routed skill. Each entry names the detected state that matched, where it routed, and the path the routed step will save to.

      Here the state is: a problem doc exists and nothing else (no scope map, no requirements doc, no slice). The right destination is `docs-writer`, which decides by `scope-map`'s own criteria whether this problem needs a scope map.

      PASS if the log has an entry whose detected state is that one (in its own words or the table's; it need not list every element of the row), whose destination is scope-map, and whose artifact line names a path under `docs/pay-fine/` (the scope map, or the record that none is needed). A later entry correcting an earlier one is fine.

      FAIL if there is no entry, the entry routes somewhere else, the detected state it names is a different row, or no artifact path under `docs/pay-fine/` is given.
  - type: llm
    name: stops-after-the-routed-step
    focus: last_message
    weight: 1
    criteria: |
      The orchestrator executes one routed step at a time: it reports what it detected, where it routed and what was produced, then continues to the next row in the same conversation, and asks the owner only when the next row needs an owner decision to start or a routed skill has a question of its own. Here the first routed step is `docs-writer:scope-map`, which decides by its own criteria whether this problem needs a scope map; for a one-unit problem it records that none is needed and the next row is requirements refinement, whose first move is its questions to the owner.

      PASS if the response ends in one of these ways: with scope-map's own questions to the owner (the routed skill stopping to ask); with the scope-map step's result reported (a map, or the decision that none is needed) and the flow stopped there asking whether to go on; or with that result reported and requirements refinement started and stopped at its questions to the owner, each step reported in its own words. Nothing from a later stage (a requirements document written without the owner's answers, a slice) has been produced. Requirements refinement's own rule is to read the problem doc and the code first so its questions are sharp and don't ask what the code already answers: a response that says what it read and found (an existing route, a use case) and then asks its questions is following that rule, not answering them from the repository. The scope-map step may be reported briefly (that no map is needed and the unit is the whole problem), as long as the response says so somewhere.

      FAIL if the response writes a requirements document or a slice without the owner's answers, settles a question the routed skill was meant to ask the owner (who benefits, what they want, why) from the repository and carries on past it, or routes to something other than scope-map first.
