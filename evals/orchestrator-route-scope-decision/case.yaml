schema_version: "1.0"
name: orchestrator-route-scope-decision
description: "Routing, one row of the orchestrator's table: a problem doc and nothing else: routes to docs-writer's scope-map, which decides whether a map is needed."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. We're planning a new feature for it, and the planning documents so far are in `docs/pay-fine/`. What's next?
  model: sonnet
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 2
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: routes-to-scope-map
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:scope-map"'
    min: 1
  - type: tool_used
    name: not-requirements-refinement
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:requirements-refinement"'
    min: 0
    max: 0
  - type: tool_used
    name: not-vertical-slicing
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:vertical-slicing"'
    min: 0
    max: 0
  - type: file_exists
    name: log-written
    path: docs/pay-fine/orchestrator-log.md
  - type: llm
    name: log-names-row-and-artifact
    focus:
      source: file
      path: docs/pay-fine/orchestrator-log.md
    weight: 1
    criteria: |
      The orchestrator appends one entry to `orchestrator-log.md` in the target directory each time it routes, before invoking the routed skill. Each entry names the detected state that matched, where it routed, and the path the routed step will save to.

      Here the state is: a problem doc exists and nothing else (no scope map, no requirements doc, no slice). The right destination is `docs-writer`, which decides by `scope-map`'s own criteria whether this problem needs a scope map.

      PASS if the log has an entry whose detected state is that one (in its own words or the table's; it need not list every element of the row), whose destination is scope-map, and whose artifact line names a path under `docs/pay-fine/` (the scope map, or the record that none is needed). A later entry correcting an earlier one is fine.

      FAIL if there is no entry, the entry routes somewhere else, the detected state it names is a different row, or no artifact path under `docs/pay-fine/` is given.
  - type: llm
    name: stops-after-the-routed-step
    focus: last_message
    weight: 1
    criteria: |
      The orchestrator executes exactly one routed step per invocation, then reports what it detected, where it routed and what was produced, and asks whether to continue; it never chains into the next stage. Here the routed step is `docs-writer`, which decides by `scope-map`'s own criteria whether this problem needs a scope map.

      PASS if the response ends in one of two ways: with scope-map's own questions to the user (the routed skill stopping to ask, its artifact to come in a later turn), or with the routed step's result reported and a question whether to continue to the next step. The step's result is often the decision, made by scope-map's own criteria from the problem doc, that no scope map is needed and the whole problem is one unit; reporting that decision in the orchestrator's own voice, naming requirements refinement as what comes next and asking whether to start it, is that second ending. A skill that delivers its artifact without needing to ask, making its own judgment calls or stating assumptions inside that work, is doing its job; that is the second ending, not the orchestrator answering its questions. Either way nothing from a later stage (a requirements doc or a slice) has been produced.

      FAIL if the response goes on to run or produce a later stage's work, or if the routed skill had stopped to ask the user something and the response answers that question itself from the repository and carries on past it, or if it routes to something other than scope-map.
