schema_version: "1.0"
name: orchestrator-route-reliability
description: "Routing, one row of the orchestrator's table: a non-UI slice with security criteria filled and a reliability placeholder: routes to reliability-requirements."
tags: [orchestrator, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory. We're planning a new feature for it, and the planning documents so far are in `docs/cancel-hold/`. What's next?
  model: sonnet
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Grep, Glob, Write, Edit]
runs: 2
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  - type: tool_used
    name: routes-to-reliability-requirements
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:reliability-requirements"'
    min: 1
  - type: tool_used
    name: not-security-requirements
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:security-requirements"'
    min: 0
    max: 0
  - type: tool_used
    name: not-tdd-implementation
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:tdd-implementation"'
    min: 0
    max: 0
  - type: tool_used
    name: not-technology-bootstrap
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:technology-bootstrap"'
    min: 0
    max: 0
  - type: file_exists
    name: log-written
    path: docs/cancel-hold/orchestrator-log.md
  - type: llm
    name: log-names-row-and-artifact
    focus:
      source: file
      path: docs/cancel-hold/orchestrator-log.md
    weight: 1
    criteria: |
      The orchestrator appends one entry to `orchestrator-log.md` in the target directory each time it routes, before invoking the routed skill. Each entry names the detected state that matched, where it routed, and the path the routed step will save to.

      Here the state is: the slice has a design doc and filled security criteria, and its reliability criteria are still a placeholder. The right destination is `devsecops-engineer:reliability-requirements`.

      PASS if the log has an entry whose detected state is that one (in its own words), whose destination is reliability-requirements, and whose artifact line names a path under `docs/cancel-hold/` (the reliability criteria document, or the slice whose placeholder it fills). A later entry correcting an earlier one is fine.

      FAIL if there is no entry, the entry routes somewhere else, the detected state it names is a different row, or no artifact path under `docs/cancel-hold/` is given.
  - type: llm
    name: stops-after-the-routed-step
    focus: last_message
    weight: 1
    criteria: |
      The orchestrator executes exactly one routed step per invocation, then reports what it detected, where it routed and what was produced, and asks whether to continue; it never chains into the next stage. Here the routed step is `devsecops-engineer:reliability-requirements`.

      PASS if the response ends in one of two ways: with reliability-requirements's own questions to the user (the routed skill stopping to ask, its artifact to come in a later turn), or with the routed step's result reported and a question whether to continue to the next step. Either way nothing from a later stage (technology-bootstrap or implementation) has been produced.

      FAIL if the response goes on to run or produce a later stage's work, answers the routed skill's questions itself from what it read in the repository and proceeds past them, or routes to something other than reliability-requirements.
