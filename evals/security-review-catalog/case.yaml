schema_version: "1.0"
name: security-review-catalog
description: "Clean module: catalog/ with its Postgres adapter and public search route; nothing above Low expected."
tags: [security-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `.github/`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`, `test/`). Read whatever you need; do not modify anything.

    Security-review the `catalog/` module, the adapter that implements its port under `infra/postgres/`, and the route that exposes it under `infra/http/`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob]
runs: 3
graders:
  - type: llm
    name: reports-nothing-above-low
    focus: last_message
    weight: 1
    criteria: |
      This checks restraint on a module with no real security defect.

      `catalog/` searches books. `PostgresCatalogReader` (`infra/postgres/postgres-catalog-reader.ts`) uses bound parameters for every query; the search wraps the user's terms as `%${escapeLike(terms)}%` and passes that string as the bound `$1` parameter, so it is not interpolated into the SQL text, and `escapeLike` only neutralises LIKE wildcards inside the bound value. `GET /books/search/:terms` is unauthenticated by design: it is a public library catalog returning only isbn, title, author and copy count. `SearchCatalog` ignores searches shorter than two characters, the query returns at most 50 rows, and the route answers any failure with a generic 503 and reports only the request path to monitoring.

      PASS if the review reports no finding above Low for this module (Low or informational notes, for example about rate limiting, result-size limits or search input length, are fine), and in particular does not report SQL injection in the catalog search or missing authentication on it at Medium or above.

      FAIL if any finding about the catalog module, its adapter or its route is rated Medium or higher.


  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:security-review"'
    min: 1
