schema_version: "1.0"
name: security-review-catalog
description: "Clean module: catalog/ with its Postgres adapter and public search route; nothing above Low expected."
tags: [security-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `.github/`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`, `test/`). Read whatever you need; don't change the code.

    Security-review the `catalog/` module, the adapter that implements its port under `infra/postgres/`, and the route that exposes it under `infra/http/`.

    Save the review as `docs/reviews/security-review-catalog.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write]
runs: 3
graders:
  - type: file_exists
    name: review-written
    path: docs/reviews/security-review-catalog.md
  - type: regex
    name: leaves-the-code-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/reviews/security-review-catalog\.md")[^"]*"'
    match: not_contains
  - type: llm
    name: reports-nothing-above-low
    focus:
      source: file
      path: docs/reviews/security-review-catalog.md
    weight: 1
    criteria: |
      This checks restraint on a module with no real security defect.

      `catalog/` searches books. `PostgresCatalogReader` (`infra/postgres/postgres-catalog-reader.ts`) uses bound parameters for every query; the search wraps the user's terms as `%${escapeLike(terms)}%` and passes that string as the bound `$1` parameter, so it is not interpolated into the SQL text, and `escapeLike` only neutralises LIKE wildcards inside the bound value. Public search connects through its own pool as a separate `catalog_reader` role (`publicSearchClient()` in `main/wiring.ts`). `GET /books/search/:terms` is unauthenticated by design: it is a public library catalog returning only isbn, title, author and copy count. `SearchCatalog` ignores searches shorter than two characters, the query returns at most 50 rows, and the route answers any failure with a generic 503 and reports only the request path and a failure reason (such as `timeout`) to monitoring.

      PASS if the review reports no finding above Low for this module (Low or informational notes, for example about rate limiting, result-size limits or search input length, are fine), and in particular does not report SQL injection in the catalog search or missing authentication on it at Medium or above.

      FAIL if any finding about the catalog module, its adapter or its route is rated Medium or higher.


  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:security-review"'
    min: 1
  - type: llm
    name: names-what-holds-it-up
    focus:
      source: file
      path: docs/reviews/security-review-catalog.md
    weight: 1
    criteria: |
      Restraint on a clean module is only worth something if the reviewer looked. The catalog search is safe for reasons that can be named: every query passes the user's terms as a bound parameter (`$1`), never in the SQL text; `escapeLike` only neutralises LIKE wildcards inside that bound value; public search runs through its own pool as a separate `catalog_reader` role (`publicSearchClient()` in `main/wiring.ts`); the route returns only isbn, title, author and copy count; searches under two characters return nothing and results are capped at 50; failures answer with a generic 503 and report only the request path and a failure reason to monitoring, no query text or stack.

      PASS if the review names at least two of those specific controls as reasons the module is sound (in its own words; paraphrase counts), rather than only saying no issues were found.

      FAIL if fewer than two are named, or the only support for the verdict is generic ("follows best practices", "no vulnerabilities found").
