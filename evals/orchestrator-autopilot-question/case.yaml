schema_version: "1.0"
name: orchestrator-autopilot-question
description: "The autopilot question (0.15.1's C2 at A.2, held by no case until 0.16.0), the asking: a first slice ready to build, the delegation question answered in the owner's message, no `autopilot.md`. The orchestrator reaches the chunk loop's A step and asks the autopilot question once, in plain text (an eval run has no question tool), naming the three stops; it writes no autopilot file on its own, creates no branch and launches nothing before the answer. `orchestrator-autopilot-recorded` is the other half: the answer written to the file."
tags: [orchestrator, library-app, regression]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory, a git repository with its remote set up; the planning documents for the desk hold-cancel feature are in `docs/cancel-hold/`. What's next? Decisions that come up during the build may be settled with the owning persona without asking me, on this slice and every later one, logged and committed under the persona's name. If the sandbox check fails here, write no settings and continue unsandboxed.
  model: sonnet
  max_turns: 30
  timeout_seconds: 1200
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: orchestrator-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:orchestrator"'
    min: 1
  # The reply ends on the question: the loop's own recommendation, and the stop that names a standing Critical or High.
  - type: regex
    name: asks-the-autopilot-question
    target: last_message
    pattern: '(?=[\s\S]*\bown recommendation\b)(?=[\s\S]*\?)(?=[\s\S]*(?:Critical or High|verify, fix and review))'
  - type: regex
    name: no-autopilot-file-before-the-answer
    target: trace
    pattern: '"name":"Write","input":\{[^{}]*"(?:file_path|path)"\s*:\s*"[^"]*docs/cancel-hold/autopilot\.md"'
    match: not_contains
  - type: regex
    name: delegation-not-asked-again
    target: last_message
    pattern: '[Mm]ay decisions that come up during the build'
    match: not_contains
  - type: tool_used
    name: nothing-launched-before-the-answer
    tool: Agent
    min: 0
    max: 0
  - type: regex
    name: no-branch-before-the-answer
    target: trace
    pattern: 'git (?:switch -c|checkout -b) slice-001'
    match: not_contains
