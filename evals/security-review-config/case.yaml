schema_version: "1.0"
name: security-review-config
description: "Secrets and CI config (main/wiring.ts, .github/workflows/deploy.yml): hardcoded email API key fallback, long-lived AWS keys where OIDC exists, workflow-wide secrets with default token permissions; traps for the Stripe publishable key and the OIDC deploy job."
tags: [security-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `.github/`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`, `test/`). Read whatever you need; don't change the code.

    Security-review how this service handles its secrets and credentials, and its CI/CD workflow: `main/wiring.ts` and `.github/workflows/deploy.yml`, plus anything they use that you need to judge them.

    Save the review as `docs/reviews/security-review-config.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write]
runs: 3
graders:
  - type: file_exists
    name: review-written
    path: docs/reviews/security-review-config.md
  - type: regex
    name: leaves-the-code-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/reviews/security-review-config\.md")[^"]*"'
    match: not_contains
  - type: llm
    name: finds-hardcoded-sendgrid-key
    focus:
      source: file
      path: docs/reviews/security-review-config.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `mailer()` in `main/wiring.ts` falls back to a hardcoded SendGrid API key (`env.SENDGRID_API_KEY ?? 'SG.q7Rk...'`) committed in source. Whenever the variable is unset the service silently runs on the committed key.

      PASS if the review flags the committed API key as a top-severity finding (Critical or High, or the equivalent top tier), proposes removing the fallback and loading the key from a secret store / failing fast when it is missing, AND says the key must be rotated/revoked because it is in the repository history (deleting it from the file is not enough).

      FAIL if it is missed, rated Medium or below, or the fix does not mention rotating/revoking the key.
  - type: llm
    name: finds-long-lived-aws-keys-in-snapshot-job
    focus:
      source: file
      path: docs/reviews/security-review-config.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      The `snapshot` job in `.github/workflows/deploy.yml` authenticates to AWS with long-lived access keys (`SNAPSHOT_AWS_ACCESS_KEY_ID` / `SNAPSHOT_AWS_SECRET_ACCESS_KEY` secrets), while the `deploy` job in the same workflow already uses GitHub OIDC (`id-token: write` + `role-to-assume`), so federated short-lived credentials are demonstrably available.

      PASS if the review flags the static access keys as a credential finding and proposes switching the snapshot job to OIDC with its own narrowly scoped role (and retiring the keys).

      FAIL if it is missed.
  - type: llm
    name: finds-workflow-wide-secrets-and-default-permissions
    focus:
      source: file
      path: docs/reviews/security-review-config.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `.github/workflows/deploy.yml` puts every runtime secret (`STRIPE_SECRET_KEY`, `SENDGRID_API_KEY`, `TWILIO_*`, `PGPASSWORD`, `PGSEARCHPASSWORD`, `MONITOR_DSN`) in the workflow-level `env:` block, so every job gets them, including `test` (checkout, `npm ci`, typecheck, tests) which needs none of them and runs third-party install scripts. The workflow also has no top-level `permissions:` block, so `test` and `snapshot` run with the repository's default `GITHUB_TOKEN` permissions.

      PASS if the review flags the over-broad secret exposure (all secrets handed to jobs that don't need them) and proposes scoping each secret to the job/step that needs it. Also flagging the missing top-level permissions block is expected but not required for PASS.

      FAIL if the workflow-wide secrets are missed.
  - type: llm
    name: no-false-alarm-stripe-publishable-key
    focus:
      source: file
      path: docs/reviews/security-review-config.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      `main/wiring.ts` also hardcodes `stripePublishableKey = 'pk_live_...'`, served by `GET /payments/config`. A Stripe publishable key is designed to be public: it is embedded in browser payment forms and cannot create charges, refunds or read data.

      PASS if the review does not treat the publishable key as a leaked secret or credential at Medium or above, and does not ask for it to be rotated. Not mentioning it, saying it is public by design, or a Low note about moving it to configuration all pass.

      FAIL if it is reported as a secret/credential exposure at Medium or above, or the review asks for it to be rotated.

      An empty or findings-free review does not pass this check: the review must also report at least one real finding of its own (a problem it asks to be fixed, at any severity). FAIL if it reports none.
  - type: llm
    name: no-false-alarm-oidc-deploy-job
    focus:
      source: file
      path: docs/reviews/security-review-config.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      The `deploy` job uses GitHub OIDC (`permissions: contents: read, id-token: write` and `role-to-assume`) to get short-lived AWS credentials. `id-token: write` is what OIDC requires; it lets the job request an identity token, not write to the repository, and it is scoped to this one job.

      PASS if the review does not report the deploy job's `id-token: write` permission or its OIDC setup as over-privileged or as something to remove/replace. Notes about the role's own AWS permissions, the trust policy's subject conditions, or the account id appearing in the ARN are fine at any severity.

      FAIL if it says `id-token: write` grants excessive or write access to the repository, or asks for the OIDC setup to be removed or replaced.

      An empty or findings-free review does not pass this check: the review must also report at least one real finding of its own (a problem it asks to be fixed, at any severity). FAIL if it reports none.
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:security-review"'
    min: 1
