schema_version: "1.0"
name: supply-chain-review-accept-phase1
description: "Interactive accept flow, phase 1: asked to record an allowlisted advisory, the skill must ask which classification applies instead of inferring one."
tags: [supply-chain-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `package-lock.json`, `Dockerfile`, `audit-ci.jsonc`, `.github/`, `ops/`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`, `test/`). Read whatever you need; do not modify anything.

    We've decided `GHSA-9xj7-p3hc-r5mw` can stay allowlisted in `audit-ci.jsonc`. Record it properly so the next person understands it.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob]
runs: 3
graders:
  - type: llm
    name: asks-for-classification
    focus: last_message
    weight: 1
    criteria: |
      The user asked to keep `GHSA-9xj7-p3hc-r5mw` allowlisted in `audit-ci.jsonc` and record it properly, without saying why or how to classify it. The skill's rule is that the user picks the classification (false positive / not vulnerable because mitigated by design / accepted risk), because those make different claims and only the person who owns the consequences can make the accepted-risk one.

      PASS if the response asks the user to choose the classification (presenting the options or clearly asking which applies) and asks for, or makes room for, the reason, before recording anything.

      FAIL if the response picks a classification itself (for example writes the entry up as a false positive or as accepted risk without asking), or records the entry without a classification.
  - type: llm
    name: no-unenforced-temporary-option
    focus: last_message
    weight: 1
    criteria: |
      audit-ci's allowlist has no expiry mechanism.

      PASS if the response does not offer "accept temporarily / until a date" as an option, or offers it only together with a mechanism that would actually enforce the expiry (or explicitly warns that a date nothing enforces is not an expiry).

      FAIL if it offers a dated temporary acceptance with no enforcement and no warning.
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:supply-chain-review"'
    min: 1
