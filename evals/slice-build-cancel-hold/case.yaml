schema_version: "1.0"
name: slice-build-cancel-hold
description: "TODO.md's L2 (0.19.0), the `solo` cadence's builder: the cancel-hold slice built whole by `slice-build` from the task the orchestrator's S step hands over. The tests come before any code and fail on their assertions; each criterion is held by one test through the use case over the real queue, so the adapter gets no test file of its own; the gate's checks run before a commit that adds files by name; the report's first table has a row per criterion and the hand-back is its one line. Run on Opus, the model the step launches its builder on. Known-bad reference: the skill without its one-test-per-criterion rule."
tags: [slice-build, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory, a git repository on the branch `slice-001-cancel-hold`. Your task is in `docs/cancel-hold/implementation/build-task.md`: do what it says. I won't be around to answer questions while you work.
  model: opus
  max_turns: 120
  timeout_seconds: 2400
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: skill-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:slice-build"'
    min: 1
  - type: tool_order
    name: skill-before-any-write
    before: {tool: Skill, input_match: 'kad-dev-team:slice-build'}
    after: Write
  - type: regex
    name: tests-before-any-code
    target: trace
    pattern: '^(?:(?!"name":"Write","input":\{[^{}]*"(?:file_path|path)":"[^"]*test/[^"]*\.test\.ts")[\s\S])*"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"[^"]*(?:lending|infra)/'
    match: not_contains
  - type: regex
    name: red-on-assertions
    target: trace
    # As tdd-implementation-lite-cancel-hold's: after a test file is written
    # and before any green run, a failing test the runner names as a test,
    # not as a file.
    pattern: '"name":"Write","input":\{[^{}]*"(?:file_path|path)":"[^"]*test/[^"]*\.test\.ts"(?:(?!ℹ fail 0)[\s\S])*✖ (?![^\n\\]*\.test\.ts)[^\n\\]*?\(\d+(?:\.\d+)?ms\)'
  - type: regex
    name: last-test-run-green
    target: trace
    pattern: 'ℹ fail [1-9](?![\s\S]*ℹ fail \d)'
    match: not_contains
  # The rule under test. Every criterion of this slice is reachable through
  # the use case over the real in-memory queue, and a queue that fails is
  # passed at the port: nothing is left for a test file of the adapter.
  - type: regex
    name: no-test-file-for-the-adapter
    target: trace
    pattern: '"name":"Write","input":\{[^{}]*"(?:file_path|path)":"[^"]*test/[^"]*(?:queue|memory)[^"]*\.test\.ts"'
    match: not_contains
  - type: regex
    name: report-has-a-row-per-criterion
    target:
      source: file
      path: docs/cancel-hold/implementation/implementation-report-slice-001.md
    pattern: '(?:^|\n)## Criteria\s*\n\|[^\n]*\n\|[-:| ]+\n(?:\|[^\n]*\n){4,}'
  - type: regex
    name: report-says-the-level-of-each
    target:
      source: file
      path: docs/cancel-hold/implementation/implementation-report-slice-001.md
    pattern: '(?:^|\n)## Criteria\s*\n\|[^\n]*Level[^\n]*\n\|[-:| ]+\n\|[^\n]*\|\s*(?:app|port|module)\b'
  - type: tool_used
    name: gate-checks-run
    tool: Bash
    input_match: 'validation_gate\.py[^\n]*--checks-only'
    min: 1
  - type: tool_order
    name: checks-before-the-commit
    before: {tool: Bash, input_match: 'validation_gate\.py[^\n]*--checks-only'}
    after: {tool: Bash, input_match: 'git commit'}
  - type: tool_used
    name: committed
    tool: Bash
    input_match: 'git commit'
    min: 1
  - type: tool_used
    name: files-added-by-name
    tool: Bash
    input_match: 'git add\s+(?:-A\b|--all\b|\.(?:\s|$|"|;|&)|-u\b)'
    min: 0
    max: 0
  - type: regex
    name: no-bash-writes
    target: trace
    pattern: '"name":"Bash","input":\{[^{}]*"command":"(?:[^"\\]|\\.)*?(?:(?<![0-9&>])>{1,2}|\btee\b|\bsed\s+-i|\b(?:cp|mv|rm)\b|\b(?:python3?|node|perl|ruby|php)\s+(?:-[ce]\b|<<))(?:[^|;&"\\]|\\.)*?(?<![\w./-])(?:\./)?(?:catalog|members|lending|fines|notifications|reporting|services|utils|infra|main|test|docs)/'
    match: not_contains
  - type: regex
    name: planning-documents-untouched
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"[^"]*docs/cancel-hold/(?:slice-001|design-001|requirements-001|user-story-001|problem)\.md"'
    match: not_contains
  - type: regex
    name: stays-inside-the-slice
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"[^"]*(?:lending/place-hold\.ts|lending/hold\.ts|lending/loan|infra/http/|main/|package\.json|gate-checks\.json)'
    match: not_contains
  - type: regex
    name: hand-back-is-the-one-line
    target: last_message
    # The last line: a run asked by a person has summarised above it.
    pattern: '(?:^|\n)\s*`?built `?[0-9a-f]{7,40}`?\.\.`?[0-9a-f]{7,40}`?; `?\d+`? criteria, `?\d+`? tests; deviations `?\d+`?; [^\n]*implementation-report-slice-001\.md`?\s*$'
