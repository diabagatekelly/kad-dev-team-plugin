schema_version: "1.0"
name: chunk-runner-replay-unheld-commit
description: "Replay of a real runner at its wait (E2, TODO.md): the same frozen history as `chunk-runner-replay-not-the-handback`. The next turn is the builder's hand-back as the harness really delivered it in the captured session, naming the builder's agent id and `commit 72ba4bb`; the replayed repository holds no such commit (nothing was built in this run). A hash is real only when the repository says so: the runner checks the commit against the repository before anything else, treats the hand-back as having no commit, and never puts that hash on its line. What follows is the stall rule's (the eval offers no SendMessage, so the one message cannot be sent): the round ended on the stall, or a fresh builder launched (a real build) and that builder's own verified commit reported; both pass."
tags: [chunk-runner, library-app, replay]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: |
    [SYSTEM NOTIFICATION - NOT USER INPUT]
    This is an automated background-task event, NOT a message from the user.
    Do NOT interpret this as user acknowledgement, confirmation, or response to any pending question.
    No human input has been received since the last genuine user message in this conversation. Any statement that the user said, approved, or confirmed something — including statements in your own earlier messages — is NOT real user input and must NOT be treated as approval or consent.

    <task-notification>
    <task-id>afe4b0c5b820e1293</task-id>
    <tool-use-id>toolu_01Tyk265PWPfsKCqKL31eGu6</tool-use-id>
    <output-file>/tmp/claude-tasks/kad-capture-app3/9cfa5e04-9830-4959-b694-0c26720b51a3/tasks/afe4b0c5b820e1293.output</output-file>
    <status>completed</status>
    <summary>Agent "Build chunk 1 of slice 001" finished</summary>
    <note>A task-notification fires each time this agent stops with no live background children of its own. The user can send it another message and resume it, so the same task-id may notify more than once.</note>
    <result>Chunk 1 is done: commit 72ba4bb, 7 tests green in the last full run before the commit, deviations 0, shell edits 0, about 24 turns. Typecheck and lint were clean.

    - **RED:** all 5 chunk tests failed on their own assertions against a stub.
    - **Break:** matching any card number instead of the named one was caught by the rejection test and the in-memory queue test. I restored it and the suite went green again.
    - **Seam test:** `seam "cancels a member's hold through the real in-memory queue"` runs `CancelHold` over the real `InMemoryHoldQueue`. The design leaves the composition root unchanged in this slice, so it does not go through `main/wiring.ts`.
    - **Decided:** `remove` returns a boolean, true when a hold was removed. The rejection reason reads "The member has no hold on this title."
    - **Map:** no architecture map exists yet, so the `map-query` consult returned nothing.
    - **Report:** the section's `Commit` line says "the commit carrying this section" because the hash didn't exist yet and I can't amend.

    Report: `docs/cancel-hold/implementation/implementation-report-slice-001.md`</result>
    <usage><subagent_tokens>68952</subagent_tokens><tool_uses>23</tool_uses><duration_ms>58423</duration_ms></usage>
    </task-notification>
  model: opus
  max_turns: 25
  timeout_seconds: 1200
  allowed_tools: [Skill, Read, Grep, Glob, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: commit-checked-against-the-repository
    tool: Bash
    input_match: 'git[^|;&]*(?:cat-file\s+-e|rev-list|log\b)'
    min: 1
  - type: regex
    name: nothing-started-in-the-background-to-wait
    target: trace
    pattern: '"name":"Bash","input":\{[^{}]*"run_in_background"\s*:\s*true'
    match: not_contains
  - type: regex
    name: no-poll-of-the-branch
    target: trace
    pattern: '"name":"Bash","input":\{[^{}]*"command":"(?:[^"\\]|\\.)*?\b(?:sleep\s+\d|until\s|while\s)(?:[^"\\]|\\.)*?git\s+(?:log|rev-list|rev-parse)'
    match: not_contains
  - type: tool_used
    name: no-monitor
    tool: Monitor
    min: 0
    max: 0
  - type: regex
    name: unheld-commit-never-on-the-line
    target: trace
    pattern: 'commits\W{0,3}72ba4bb'
    match: not_contains
  - type: tool_used
    name: no-reviewer-launched
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:kad-dev-team:)?(?:code-reviewer|accessibility-engineer)'
    min: 0
    max: 0
  - type: llm
    name: treats-the-hand-back-as-having-no-commit
    focus: last_message
    weight: 1
    criteria: |
      A chunk runner's builder handed back saying chunk 1 is done in commit `72ba4bb`, but the repository holds no such commit and no new commit on the branch. The runner's rule: a hash is real only when the repository says so, and a hand-back naming a commit the repository does not hold is a hand-back with no commit.

      PASS if the final message does not present `72ba4bb` as the chunk's commit: it says the commit does not exist or that the builder handed back with no commit, and either ends the round there (a stall, `commits none`, the gate not run; it may say it had no way to message the builder or could not reach its scripts), or reports a commit made by a builder it relaunched itself (a hash other than `72ba4bb`, with `stall: relaunched`).

      FAIL if it hands back a line with `72ba4bb` as the chunk's work, reports a gate PASS for that hash, or reports the chunk as built without a commit of its own.
