schema_version: "1.0"
name: reliability-review-nightly
description: "Nightly job (main/jobs.ts, main/server.ts and the adapters it calls): unhandled rejection, no per-loan isolation, a leaked pool per run, a mailer with no timeout, a postal adapter that swallows failures; traps for the reminder catch, re-run idempotency and a correct SMS retry."
tags: [reliability-review, library-app]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The library-lending app is in your current working directory (its root holds `package.json`, `.github/`, `ops/`, `catalog/`, `members/`, `lending/`, `fines/`, `notifications/`, `reporting/`, `services/`, `utils/`, `infra/`, `main/`, `test/`). Read whatever you need; don't change the code.

    Review the nightly job for how it behaves when things go wrong: `main/jobs.ts`, how `main/server.ts` schedules it, and the adapters it drives through `main/wiring.ts` (email, SMS, postal, Postgres). Is it ready for production?

    Save the review as `docs/reviews/reliability-review-nightly.md`.
  model: sonnet
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Grep, Glob, Write]
runs: 3
graders:
  # E7 (TODO.md, decision 8, 2026-11-15): cut as judges that passed three
  # runs of three with and without the plugin in E6:
  # `finds-no-isolation-in-fine-loop`, `finds-member-directory-pool-leak`,
  # `finds-mailer-without-timeout`, `finds-postal-queue-swallows-errors`.
  # What they graded is still in the fixture.
  # `finds-unhandled-nightly-rejection` is the judge kept on the case's most
  # important planted problem.
  - type: file_exists
    name: review-written
    path: docs/reviews/reliability-review-nightly.md
  - type: regex
    name: leaves-the-code-alone
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^{}]*"(?:file_path|path)":"(?![^"]*docs/reviews/reliability-review-nightly\.md")[^"]*"'
    match: not_contains
  - type: llm
    name: finds-unhandled-nightly-rejection
    focus:
      source: file
      path: docs/reviews/reliability-review-nightly.md
    weight: 1
    criteria: |
      Judge substance only: rule names, category labels and the exact severity word do not matter unless this criterion says otherwise. What matters is whether the review identifies the problem described and proposes a fix that would address it.

      `main/server.ts` schedules the nightly job with `setInterval(() => { void runNightly(); }, 24 * 60 * 60 * 1000)`. `runNightly` in `main/jobs.ts` has no top-level try/catch, and `void` discards its promise, so any error thrown outside the per-reminder `try` (for example `loans.findOpen()`, a fine assessment, `members.findByCard`, or the monthly report export) becomes an unhandled promise rejection. The service targets Node 24, where an unhandled rejection terminates the process: the HTTP server goes down with the job, and nothing is written through the app logger or sent to monitoring.

      PASS if the review identifies that a failure in the nightly job is unhandled at its entry point, and states a concrete consequence (the process crashing / the web server going down, or the failure being invisible), rates it Critical or High (or the top two tiers of whatever scale it uses), and proposes catching and reporting failures at the job boundary (or running the job outside the web process).

      FAIL if it is missed, or only mentioned as a style point, or rated Medium or lower.
  - type: llm
    name: no-false-alarm-reminder-loop-catch
    focus:
      source: file
      path: docs/reviews/reliability-review-nightly.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      In `main/jobs.ts`, each reminder is sent inside its own `try`, and the `catch` logs `reminder failed` at `error` level with the reason and continues with the next member. This isolates one member's failure from the rest of the batch.

      PASS if the review does not present this per-reminder catch-and-continue as swallowing errors or as a reliability defect. Criticising what the log line contains (the whole member object, a security/PII concern) is fine and does not fail this check; so is suggesting a failure count or summary.

      FAIL if it says the reminder loop's catch hides or swallows failures and asks for it to stop continuing or to rethrow.

      An empty or findings-free review does not pass this check: the review must also report at least one real finding of its own (a problem it asks to be fixed, at any severity). FAIL if it reports none.
  - type: llm
    name: no-false-alarm-duplicate-fines-on-rerun
    focus:
      source: file
      path: docs/reviews/reliability-review-nightly.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      `AssessOverdueFine` (`fines/assess-overdue-fine.ts`) checks `alreadyAssessed` (an outstanding fine for the same loan id, through `outstandingFor`) before recording a new fine, so running the nightly job again after a finished or crashed run does not fine a loan twice while its fine is outstanding.

      PASS if the review does not claim that a sequential re-run of the nightly job double-fines a loan whose fine is still outstanding. These all pass, at any severity: not mentioning it; noting the guard; a check-then-insert race between two overlapping runs or instances (both pass the check before either inserts), even when the finding also says "repeated runs", "retry" or "re-run" and even when the random fine id or a missing unique constraint is part of the argument; and the observation that `outstandingFor` excludes settled and waived fines, so a loan still open after its fine was paid or waived is fined again on a later night. The race and the settled-fine gap are both real.

      FAIL only if the review's mechanism for duplicate fines is that a run started after the previous one finished re-fines a loan whose fine is still outstanding, with no mention of the `alreadyAssessed` check, of overlapping runs, or of settled or waived fines.

      An empty or findings-free review does not pass this check: the review must also report at least one real finding of its own (a problem it asks to be fixed, at any severity). FAIL if it reports none.
  - type: llm
    name: no-false-alarm-sms-retry
    focus:
      source: file
      path: docs/reviews/reliability-review-nightly.md
    weight: 1
    criteria: |
      Judge substance only. This checks that the review does NOT raise a false alarm.

      `infra/sms/twilio-sms-gateway.ts` retries a failed send only for 408/429/5xx statuses, with exponential backoff (500 ms, 1 s), at most three attempts, a 5-second client timeout, and the retry lives in the adapter.

      PASS if the review does not flag this retry as retrying non-transient failures, as hammering the provider, as misplaced, or as over-engineered. Not mentioning it, citing it as the model the other adapters should follow, or a Low note about a possible duplicate text all pass.

      FAIL if it reports this retry logic as a defect at Medium or above.

      An empty or findings-free review does not pass this check: the review must also report at least one real finding of its own (a problem it asks to be fixed, at any severity). FAIL if it reports none.
  - type: tool_used
    name: skill-invoked-display
    tool: Skill
    input_match: '"skill"\s*:\s*"kad-dev-team:reliability-review"'
    min: 1
